# Core — Auto-Tag + Dev/RC Tag Pipelines
#
# Extracted from core/.gitlab-ci.yml on 2026-04-22 as Phase 0 Part 2
# of the T2.3 split (2026-04-22-ci-pipeline-health-audit).
# Pure extraction — byte-identical to the deleted block. Included as
# `local: ci/auto-tag-and-dev-rc.yml` from core/.gitlab-ci.yml.
#
# Contents:
#   - auto-tag:version    — main-branch only; auto-creates v-tag or v-dev-N
#   - dev:verify / dev:lint:format / dev:lint:clippy / dev:test
#                         — lightweight dev-tag pipeline (no build/publish)
#   - rc:verify / rc:lint:format / rc:lint:clippy / rc:test / rc:mutation
#     / rc:security:audit — full rc-tag pipeline

# ============================================================
# Final Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
# Works for all version types: stable (0.4.0), dev (0.4.0-dev.0), rc (0.4.0-rc.1).
#
# If the version tag already exists (no bump), auto-creates a dev tag
# (v{version}-dev.N) so every merge to main produces a testable build.

auto-tag:version:
  extends: [.linux-runner-nocache, .main-only]
  # Never cut a (dev) tag on a SCHEDULED (nightly) pipeline. A tag push
  # triggers the downstream release verify/build chain (release:verify,
  # build:validate-bindings, build:apple, build:android). The nightly exists
  # for mutation/fuzz/bench only — it must not spawn release-verify pipelines.
  # Tagging belongs to main MERGES (source=push). This overrides .main-only's
  # rules (CI_COMMIT_BRANCH == default) to add the never-on-schedule guard;
  # merge behaviour is unchanged.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Stable/dev tags are externally visible release inputs. Keep this job in
  # the final stage without a `needs` DAG shortcut so every blocking main job
  # must pass before a tag can exist.
  stage: tag
  resource_group: auto-tag
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "50"
  before_script: []
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Use bot's verified commit_email — GITLAB_USER_EMAIL may be a human's
      # email that isn't verified on the bot account pushing via PROJECT_ACCESS_TOKEN.
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')
      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/package/publish stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "Tag ${TAG} already exists — creating dev tag instead"

        # Skip dev tag for non-code changes (docs, scripts, CI-only merges).
        # Uses CI_COMMIT_BEFORE_SHA (previous main HEAD before this push) to
        # detect ALL files changed in the merge, not just the last commit.
        # Fallback: if before-SHA is zeros (shouldn't happen on main), assume code changed.
        BEFORE="${CI_COMMIT_BEFORE_SHA:-0000000000000000000000000000000000000000}"
        if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          CODE_CHANGES=$(git diff --name-only "$BEFORE" HEAD | grep -cE '\.(rs)$|Cargo\.(toml|lock)$' || echo 0)
          if [ "$CODE_CHANGES" = "0" ]; then
            echo "ℹ No Rust code changes in this merge — skipping dev tag"
            echo "  Changed files:"
            git diff --name-only "$BEFORE" HEAD | sed 's/^/    /'
            exit 0
          fi
          echo "Detected ${CODE_CHANGES} code file(s) changed — proceeding with dev tag"
        else
          echo "⚠ CI_COMMIT_BEFORE_SHA is zeros — assuming code changed (safe default)"
        fi

        # Strip any pre-release suffix to get the base version for dev tags
        BASE_VERSION=$(echo "${VERSION}" | sed 's/-.*//')

        # Find highest existing dev tag and increment
        # Filter out ^{} dereferenced refs which break the grep pattern
        LAST_DEV=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-dev.*" \
          | grep -v '\^{}' | sed 's|.*/||' | sort -V | tail -1 || true)
        if [ -n "${LAST_DEV}" ]; then
          N=$(echo "${LAST_DEV}" | grep -oE '[0-9]+$')
          N=$((N + 1))
        else
          N=1
        fi
        DEV_TAG="v${BASE_VERSION}-dev.${N}"

        echo "Creating dev tag: ${DEV_TAG} (last=${LAST_DEV:-none}, N=${N})"
        git tag -a "${DEV_TAG}" -m "Dev build ${DEV_TAG}"
        if ! git push origin "${DEV_TAG}" 2>&1; then
          echo "✗ Failed to push ${DEV_TAG} — tag may already exist"
          exit 1
        fi
        echo "✓ Created and pushed dev tag ${DEV_TAG}"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Runs lint + test only.
# Dev tags do NOT run build/package/publish (excluded from .release-or-rc).

dev:verify:
  extends: [.linux-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.linux-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.linux-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.linux-runner, .dev-test-nextest, .timeout-standard]

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage, mutation, bench.

rc:verify:
  extends: [.linux-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.linux-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.linux-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .linux-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    COVERAGE_PACKAGE: "vauchi-core"
    COVERAGE_REPO_LABEL: "core"

rc:mutation:
  extends: [.mutation-nightly, .linux-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_PACKAGE: "vauchi-core"
    MUTATION_TIMEOUT_NIGHTLY: "240"
    MUTATION_EXTRA_FLAGS: "--exclude-re theme.rs --in-place"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]

rc:security:audit:
  extends: [.linux-runner-readonly, .rc-security-audit]
