[package]
name = "vauchi-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.vauchi-core]
path = ".."
features = ["network-rustls", "testing"]

# Prevent this from interfering with the parent workspace
[workspace]
members = ["."]

[[bin]]
name = "fuzz_decode_message"
path = "fuzz_targets/fuzz_decode_message.rs"
doc = false

[[bin]]
name = "fuzz_qr_payload"
path = "fuzz_targets/fuzz_qr_payload.rs"
doc = false

[[bin]]
name = "fuzz_unpad"
path = "fuzz_targets/fuzz_unpad.rs"
doc = false

[[bin]]
name = "fuzz_delta_decode"
path = "fuzz_targets/fuzz_delta_decode.rs"
doc = false

[[bin]]
name = "fuzz_recovery_claim"
path = "fuzz_targets/fuzz_recovery_claim.rs"
doc = false

[[bin]]
name = "fuzz_nfc_payload"
path = "fuzz_targets/fuzz_nfc_payload.rs"
doc = false

[[bin]]
name = "fuzz_ble_payload"
path = "fuzz_targets/fuzz_ble_payload.rs"
doc = false

[[bin]]
name = "fuzz_ble_advertisement"
path = "fuzz_targets/fuzz_ble_advertisement.rs"
doc = false

[[bin]]
name = "fuzz_exchange_payload"
path = "fuzz_targets/fuzz_exchange_payload.rs"
doc = false

[[bin]]
name = "fuzz_encrypted_exchange"
path = "fuzz_targets/fuzz_encrypted_exchange.rs"
doc = false

[[bin]]
name = "fuzz_ratchet_state"
path = "fuzz_targets/fuzz_ratchet_state.rs"
doc = false
