# cargo-mutants configuration for vauchi-core
# See: https://mutants.rs/config-file.html

# Exclude test infrastructure, generated code, and benchmarks from mutation
# The diagnostic scanner and YOLO pipeline compile only with the
# diagnostic-scanner / diagnostic-yolo features, which the mutation build
# (`--features testing`) does not enable; every mutant there would read
# as missed without ever being compiled (vauchi/private#522).
exclude_globs = [
    "tests/**",
    "benches/**",
    "fuzz/**",
    "vauchi-core/src/diagnostic/yolo_scan.rs",
    "vauchi-core/src/diagnostic/debug_session.rs",
    "vauchi-core/src/diagnostic/log_event.rs",
    "vauchi-core/src/diagnostic/preprocess.rs",
    "vauchi-core/src/diagnostic/report.rs",
    "vauchi-core/src/diagnostic/snapshot.rs",
    "vauchi-core/src/diagnostic/tuner.rs",
    "vauchi-core/src/diagnostic/yolo_detector.rs",
]

# Mutants we never expect to catch.
#
# Each entry is a regex matched against cargo-mutants' textual mutant
# description (e.g. `path/to/file.rs:LINE:COL: replace X with Y in fn`).
# Anchor by `path:line:col` for precision — every mutation cargo-mutants
# emits has a unique (file, line, col, replacement) tuple.
exclude_re = [
    # Cross-repo include_bytes! escapes the temp source copy that
    # cargo-mutants creates when --in-place is not used. Themes JSON
    # lives in a sibling repo so the path resolves outside the workspace.
    "test_themes_json_not_empty",
    "test_theme_by_id_found_in_json",
    "test_theme_by_id_not_found_in_json",
    # theme.rs: same cross-repo include_bytes! constraint. Kept here (not as
    # a CI `--exclude-re` flag) because cargo-mutants 26.x has a CLI
    # `--exclude-re` REPLACE every entry in this list rather than merge —
    # passing it on the command line silently re-enabled the equivalent
    # avatar mutants below and wasted full-timeout runs on them.
    "theme\\.rs",

    # ── Equivalent mutations in vauchi-core/src/avatar/mod.rs ──
    # Verified 2026-04-27 against an unmutated build. Each of these
    # produces source code that is observably indistinguishable from
    # the original for every reachable input. Refactoring would change
    # rendered avatar bytes, which is user-visible behavior.
    #
    # Boundary `dx*dx + dy*dy > radius_sq`. With size=N integer,
    # radius_sq = (N/2)² is an integer; dx and dy are integer+0.5,
    # so dx²+dy² has a non-integer fractional part. The two sides
    # can never be exactly equal, so `>` and `>=` partition the
    # plane identically.
    "vauchi-core/src/avatar/mod\\.rs:52:30: replace > with >=",
    # `y = 2.0 * x * y + y0` ↔ `y = 2.0 * x * y - y0`. Replacing y0
    # with -y0 in the iteration replaces c with conj(c). The
    # Mandelbrot set is invariant under conjugation, so the iter
    # count for any pixel is the same with either sign — colors
    # match exactly.
    "vauchi-core/src/avatar/mod\\.rs:63:29: replace \\+ with -",

    # consent.rs:77 swallows the "no such table" prepare error (SQLITE_ERROR,
    # pre-migration #60). Widening it to every prepare error needs a prepare
    # that fails some other way, which an in-memory SQLite never does
    # (vauchi/private#522).
    "vauchi-core/src/storage/stores/consent\\.rs:(77|130):20: replace match guard .* with true in ConsentStore<'_>::list_consent_records(_with_version)?$",

    # normalize_date's two format guards: loosening either only reformats a
    # value that is not a date, and the birthday validation that follows
    # drops it either way (probed 2026-10-06: "1990051a" and "--0515" import
    # no birthday with or without the guard) (vauchi/private#522).
    "vauchi-core/src/contact_card/vcard_import\\.rs:707:27: replace && with \\|\\| in normalize_date$",
    "vauchi-core/src/contact_card/vcard_import\\.rs:712:51: replace >= with < in normalize_date$",

    # find_preamble's Goertzel power is a float sum over sampled audio; it
    # never lands exactly on the 0.05 threshold, so `>` and `>=` pick the
    # same window (vauchi/private#522).
    "vauchi-core/src/exchange/audio_modem\\.rs:181:18: replace > with >= in find_preamble$",

    # The sharpness gate compares a float variance with 15.0; a frame never
    # lands exactly on it, so `<` and `<=` skip the same frames
    # (vauchi/private#522).
    "vauchi-core/src/qr/scanner\\.rs:133:26: replace < with <= in scan_qr_from_luma$",
    # scan_qr_from_luma_with_config compiles only with diagnostic-scanner,
    # which the mutation build does not enable (vauchi/private#522).
    "vauchi-core/src/qr/scanner\\.rs:[0-9]+:[0-9]+: replace scan_qr_from_luma_with_config ",
    # fast_laplacian_variance uses only the squared mean, so summing the
    # negated Laplacian gives the same variance (vauchi/private#522).
    "vauchi-core/src/qr/scanner\\.rs:255:17: replace \\+= with -= in fast_laplacian_variance$",

    # MockBLEVerifier and MockBLETransport are test doubles that ship in src
    # for downstream tests; a mutant there changes the double, not the
    # product (vauchi/private#522).
    "vauchi-core/src/exchange/ble\\.rs:[0-9]+:[0-9]+: .*MockBLE(Verifier|Transport)>?::",

    # run_device_sync_send's "two or more devices" gate only saves work: with
    # just its own device the orchestrator addresses no sibling and sends to
    # none, so `> 1` and `>= 1` both report 0 (vauchi/private#522).
    "vauchi-core/src/api/vauchi/device_sync_loop\\.rs:123:45: replace > with >= in Vauchi::run_device_sync_send$",
    # build_device_sync_envelopes has the same gate for the same reason.
    "vauchi-core/src/api/sync/device_orchestrator\\.rs:930:20: replace match guard r.device_count\\(\\) > 1 with true in build_device_sync_envelopes$",
    "vauchi-core/src/api/sync/device_orchestrator\\.rs:930:37: replace > with >= in build_device_sync_envelopes$",

    # SendPhase::sync paths that only a storage fault reaches: mark_delivered
    # and load_contact fail only when SQLite does, and a timed-out update is
    # found again only if clearing it after the send failed (the send path
    # clears it on success). No test hook injects these faults
    # (vauchi/private#522).
    "vauchi-core/src/api/send_phase\\.rs:150:25: delete match arm Err\\(e\\) in SendPhase<'a, T>::sync$",
    "vauchi-core/src/api/send_phase\\.rs:236:39: replace \\+= with [-*]= in SendPhase<'a, T>::sync$",
    "vauchi-core/src/api/send_phase\\.rs:186:75: replace \\+ with [-*] in SendPhase<'a, T>::sync$",

    # Crypto (vauchi/private#522):
    # - is_valid_bucket_size accepts 4096 by equality already, and 4096 is a
    #   multiple of the 256-byte overflow alignment, so `>` and `>=` agree.
    # - The reduced Argon2 memory cost exists only under `test-kdf`, which the
    #   mutation build (`--features testing`) does not enable.
    # - DoubleRatchetState's Drop zeroizes the root key; freed memory is not
    #   observable from a safe test. Its compile-time zeroize contract is still
    #   open (zeroize_contract_tests lists why; tracked in
    #   problems/2026-07-05-prose-rules-to-deterministic-lints/).
    "vauchi-core/src/crypto/padding\\.rs:95:17: replace > with >= in is_valid_bucket_size$",
    "vauchi-core/src/crypto/password_kdf\\.rs:31:41: replace \\* with [+/]$",
    "vauchi-core/src/crypto/ratchet\\.rs:[0-9]+:[0-9]+: replace <impl Drop for DoubleRatchetState>::drop with \\(\\)$",

    # Backup (vauchi/private#522):
    # - Export-side size limits need a serialized backup within a byte of
    #   32 MiB (contact export, and full/guardian output after compression)
    #   or 64 MiB (full/guardian JSON), which the export API cannot build to
    #   the byte. The contact export's output check can never fire after its
    #   plaintext check, since the output is exactly plaintext + 58 bytes.
    #   The import-side limits are pinned by backup_boundary_tests.
    # - The decompression buffer's initial capacity only sizes an allocation.
    # - FullBackupIdentityData's Drop zeroizes the seed; freed memory is not
    #   observable from a safe test.
    "vauchi-core/src/backup/contact_backup\\.rs:3[24]:[0-9]+: replace [*+] with [-+*/]$",
    "vauchi-core/src/backup/contact_backup\\.rs:[0-9]+:[0-9]+: replace [->/+*=]+ with [-=>/+*]+ in export_contact_backup$",
    "vauchi-core/src/backup/full_backup\\.rs:[0-9]+:[0-9]+: replace > with (==|>=) in export_(full|guardian)_backup$",
    "vauchi-core/src/backup/full_backup\\.rs:[0-9]+:[0-9]+: replace \\* with [+/] in decompress_backup_with_limit$",
    "vauchi-core/src/backup/full_backup\\.rs:[0-9]+:[0-9]+: replace <impl Drop for FullBackupIdentityData>::drop with \\(\\)$",
    # - advance_combination's `item_count < len` guard: with item_count ==
    #   len the only combination is the first, and the loop finds no position
    #   to advance, so `<` and `<=` both return false.
    "vauchi-core/src/backup/guardian_recovery\\.rs:71:41: replace < with <= in advance_combination$",

    # Exchange session (vauchi/private#522): handle_ignored_event lists each
    # ignored platform event with its reason, then a catch-all; every arm,
    # the catch-all included, does nothing and returns Ok, so deleting an arm
    # or the whole body changes no behaviour.
    "vauchi-core/src/exchange/session\\.rs:[0-9]+:[0-9]+: (delete match arm .* in|replace) ExchangeSession::handle_ignored_event",
    # Commitment's Drop zeroizes the reveal key; freed memory is not
    # observable from a safe test.
    "vauchi-core/src/exchange/multistage/commitment\\.rs:[0-9]+:[0-9]+: replace <impl Drop for Commitment>::drop with \\(\\)$",
    # get_display_qr compares the training summary only to decide whether to
    # write a dev-logging line; it changes no frame.
    "vauchi-core/src/exchange/multistage/session\\.rs:1064:33: replace != with == in MultiStageSession::get_display_qr$",
    # update_transfer_state's unacked/missing index lists and handle_done's
    # first-read check only feed dev-logging lines.
    "vauchi-core/src/exchange/multistage/session\\.rs:(1879|1888):17: delete ! in MultiStageSession::update_transfer_state$",
    "vauchi-core/src/exchange/multistage/session\\.rs:2061:12: delete ! in MultiStageSession::handle_done$",
    # transport_decrypt `< 28` vs `<= 28` differs only for a well-formed
    # chunk with an empty payload, which chunking never produces; dropping
    # one would only count a decrypt failure.
    "vauchi-core/src/exchange/multistage/session\\.rs:1965:29: replace < with <= in MultiStageSession::transport_decrypt$",
    # note_dropped_frame only counts drops to rate-limit a dev-logging line.
    # MultiStageSession's Drop calls clear_sensitive, which cancel() tests
    # observably; after drop the wiped memory is not.
    "vauchi-core/src/exchange/multistage/session\\.rs:[0-9]+:[0-9]+: (replace|replace .* in) MultiStageSession::note_dropped_frame",
    "vauchi-core/src/exchange/multistage/session\\.rs:[0-9]+:[0-9]+: replace <impl Drop for MultiStageSession>::drop with \\(\\)$",
    # BleHandshakeSession's Drop zeroizes its secrets; freed memory is not
    # observable from a safe test.
    "vauchi-core/src/exchange/ble_handshake\\.rs:[0-9]+:[0-9]+: replace <impl Drop for BleHandshakeSession>::drop with \\(\\)$",

    # duress_settings.created_at / updated_at are written but never read by
    # any API, so the time stamped there is unobservable (vauchi/private#522).
    "vauchi-core/src/storage/stores/duress\\.rs:[0-9]+:[0-9]+: replace DuressStore<'_>::now_secs -> u64 with ",
]

# Allow 1.5x the normal test timeout per mutant
timeout_multiplier = 1.5

# Use nextest for faster mutant killing (exits on first failure)
test_tool = "nextest"

# Build with the `mutants` profile (debug = "none") for ~25% faster per-mutant
# builds vs the default `test` profile. Measured 2026-07-07: clean build of
# vauchi-core drops from 17.0s to 12.8s (saves ~4.2s per mutant).
profile = "mutants"

# Skip doctests — each doctest compiles as a separate binary, slow for mutation.
# `--features testing` enables the `it` integration target (required-features =
# ["testing"]). Without it, the entire integration suite — the bulk of the
# crate's tests — never runs under mutation, so heavily-tested code reports as
# MISSED. The `it` target builds under cargo-mutants' relocated source tree only
# because contract_tests.rs loads themes.json at runtime (via VAUCHI_THEMES_DIR)
# rather than a compile-time include_bytes! that escapes the temp copy.
additional_cargo_test_args = ["--all-targets", "--features", "testing"]
