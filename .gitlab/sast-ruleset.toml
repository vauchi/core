# Custom Semgrep SAST configuration
# Security rules only — quality rules (CC-03, CC-06) excluded from dashboard.
# Quality rules for local use: semgrep --config scripts/semgrep-rules/vauchi-quality.yml .

[semgrep]
  description = "Semgrep with Rust community + vauchi security rules"

  # Disable community unsafe-usage rule: vauchi-cabi is a C ABI crate where
  # unsafe is inherent (extern "C" fn, raw pointers, no_mangle).
  # Replaced by custom vauchi-no-unsafe-in-core (in vauchi-security.yml)
  # which targets vauchi-core/src/** only — preserving the zero-unsafe guarantee.
  [[semgrep.ruleset]]
    disable = true
    [semgrep.ruleset.identifier]
      type = "semgrep_id"
      value = "rust.lang.security.unsafe-usage.unsafe-usage"

  [[semgrep.passthrough]]
    type = "url"
    value = "https://semgrep.dev/c/p/rust"
    target = "semgrep-rust-community.yml"

  [[semgrep.passthrough]]
    type = "url"
    value = "https://gitlab.com/api/v4/projects/77957857/repository/files/semgrep-rules%2Fvauchi-security.yml/raw?ref=d6fb250c9eac465a9328bea36153677917774173"
    target = "semgrep-vauchi-security.yml"
