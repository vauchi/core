        if [ -n "$f" ]; then
          printf "  \xe2\x94\x94 %s \xe2\x80\x94 %b\n" "$(tail -1 "$f")" "$(color_type "$(basename "$f" .txt)")"
        fi
      }

      while [ ! -f "$MUTANTS_OUT/mutants.json" ] && kill -0 "$MUTANTS_PID" 2>/dev/null; do
        sleep 10
      done
      if ! kill -0 "$MUTANTS_PID" 2>/dev/null; then
