[workspace]
resolver = "3"
members = [
    "vauchi-app",
    "vauchi-cabi",
    "vauchi-core",
    "vauchi-platform",
    "vauchi-protocol",
]

[workspace.package]
version = "0.19.17"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/core"
authors = ["Vauchi Contributors"]

[workspace.dependencies]
vauchi-core = { path = "vauchi-core", version = "0.19.6", default-features = false }
vauchi-app = { path = "vauchi-app", version = "0.19.6", default-features = false }
vauchi-protocol = { path = "vauchi-protocol", version = "0.19.6" }

# Release profile: optimized for size (mobile binaries)
[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile)
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip debug symbols from release binaries
overflow-checks = true  # Panic on integer overflow (security: prevent silent wrapping)

# Development profile: fast compilation, good debugging
[profile.dev]
opt-level = 0        # No optimization
debug = "line-tables-only"  # Backtraces work, 2-30% faster builds (use CARGO_PROFILE_DEV_DEBUG=2 for full debuginfo)
strip = false
split-debuginfo = "unpacked"  # Reduce linker work (skip debuginfo bundling)

# Release with debug info (for profiling)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# CI profile: faster builds with reasonable optimization
[profile.ci]
inherits = "release"
lto = "thin"          # Faster than full LTO, still good optimization
codegen-units = 16    # More parallelism during compilation
incremental = false   # CI builds are fresh, no benefit from incremental

# Test profile: backtraces work, but skip full debug info and split .dwo files.
# Reduces test binary size ~60% and eliminates 278K .dwo files (~7.5 GB).
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

# Mutation testing profile: fast incremental builds, no debug info needed
[profile.mutants]
inherits = "test"
debug = "none"        # Skip debug symbols — mutants only need pass/fail
