[package]
name = "vauchi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Vauchi - privacy-focused contact card exchange"

# SP-33: intentional breaking changes for v0.1 alpha (no deployed clients).
# DeviceSyncMessage/Ack removed, VersionedPayload::Legacy removed,
# send_device_sync_message signature simplified, MessageType discriminants shifted.


[features]
default = ["network", "network-http", "storage"]
storage = ["rusqlite"]
network = ["network-rustls", "storage"]
network-rustls = ["rustls", "webpki-roots", "storage"]
network-http = ["ureq", "ohttp"]
# Compat alias — removed in WS/Noise cleanup, downstream repos still reference it
network-native-tls = ["network", "network-http"]
secure-storage = ["keyring"]
# Platform-specific keyring backends (consumers pick the right one):
# - Linux: kernel keyutils + D-Bus Secret Service (GNOME Keyring, KDE Wallet, KeePassXC)
# - macOS/iOS: apple-native (Keychain)
# - Windows: windows-native (Credential Manager)
secure-storage-linux = ["secure-storage", "keyring/linux-native-sync-persistent"]
secure-storage-apple = ["secure-storage", "keyring/apple-native"]
secure-storage-windows = ["secure-storage", "keyring/windows-native"]
# Real audio proximity verification using CPAL (desktop only)
audio-cpal = ["cpal"]
# Enable this feature to expose internal modules for integration tests
testing = []
# Shorten protocol timeouts for fast e2e/integration tests (QR expiry: 300s → 5s)
test-timings = []
# Reduces Argon2id KDF cost parameters for faster test execution (~5x speedup).
# MUST NOT be enabled in production builds — only for test/dev profiles.
test-kdf = []
# JSON Schema generation for UI types (dev tooling only)
schema-gen = ["schemars", "vauchi-app/schema-gen"]
# Diagnostic QR scanner benchmarking (rqrr decoder + image preprocessing)
diagnostic-scanner = ["imageproc", "fast_image_resize"]
# YOLO-based QR detector for diagnostic scanner (adds ~15MB ONNX runtime)
diagnostic-yolo = ["diagnostic-scanner", "ort"]
# Profiling: install a tracing-flame layer at the start of every test run.
# Writes folded traces to `core/vauchi-core/artifacts/flame/` (gitignored).
# See `just flame-core <test_filter>`.
flame = ["dep:tracing-subscriber", "dep:tracing-flame", "dep:ctor"]

[dependencies]
# Cryptography (audited libraries)
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

# XChaCha20-Poly1305 (spec-mandated cipher, outside RustCrypto primary set but spec-mandated)
chacha20poly1305 = "0.10.1"

# Argon2id password KDF (spec-mandated, outside RustCrypto primary set but spec-mandated)
argon2 = "0.5.3"

# Async trait support for async sync pipeline
async-trait = "0.1"

# Compression for delta payloads
flate2 = "1.0"

# QR code generation
qrcode = { version = "0.14", default-features = false }

# Image decoding/encoding for avatar normalization (ADR-042)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9"
postcard = { version = "1.1", features = ["alloc"] }

# Bitflags for transport capability negotiation
bitflags = { version = "2.6", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Tracing spans for profiling. Events follow `.claude/rules/logging-rules.md`:
# never log PII (names, keys, tokens, card content). All `#[instrument]`
# attributes use `skip_all` and only emit non-sensitive metadata (sizes,
# variant tags, success/failure). At default level=info there is near-zero
# overhead — spans only emit when a subscriber matches the level.
tracing = "0.1"

# Profiling layer (enabled via `flame` feature; dev-only, gated to test builds).
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-flame = { version = "0.2", optional = true }
ctor = { version = "0.2", optional = true }

# Random number generation
rand = "0.8"

# Base64 encoding for keys/backups
base64 = "0.22"

# CRC32 checksums for animated QR frame validation
crc32fast = "1.4"

# Hex encoding for fingerprints
hex = "0.4"

# Constant-time comparison for cryptographic operations
subtle = "2.6"

# Zeroize sensitive data in memory
zeroize = { version = "1.8", features = ["derive"] }

# JSON Schema generation (optional, behind schema-gen feature)
schemars = { version = "0.8", optional = true }

# Unicode NFC normalization for cross-platform string consistency
unicode-normalization = "0.1.25"

# Shared relay/client protocol types
vauchi-protocol.workspace = true

# Database storage (optional — not available on wasm32)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# UUID generation for IDs
uuid = { version = "1.0", features = ["v4"] }

# (snow, tungstenite, native-tls removed — WebSocket transport replaced by HTTP v2)

# TLS for rustls feature (aws-lc-rs backend - works on Android/iOS)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0", optional = true }

# Platform keychain access (optional, for desktop apps)
# Backend features are platform-specific — see [target] sections below.
# Bare keyring dep used as the common optional dependency.
keyring = { version = "3", optional = true }

# Cross-platform audio for ultrasonic proximity verification (desktop only)
cpal = { version = "0.15", optional = true }

# Sync HTTP client for v2 relay protocol (no async runtime needed)
# Use rustls-no-provider + webpki-roots to avoid pulling in ring — aws-lc-rs is our TLS backend
ureq = { version = "3", default-features = false, features = ["json", "rustls-no-provider", "rustls-webpki-roots", "gzip"], optional = true }

# OHTTP client-side encryption (RFC 9458) for IP privacy
ohttp = { version = "0.7", default-features = false, features = ["client", "rust-hpke"], optional = true }

# QR code decoding — used by production mobile scanner (rxing tryHarder pipeline)
rqrr = "0.10"
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }

# Image preprocessing for diagnostic scanner benchmarking (optional)
imageproc = { version = "0.25", optional = true, default-features = false }
fast_image_resize = { version = "5", optional = true, default-features = false }

# ONNX Runtime for YOLO QR detector (optional, adds ~15MB)
ort = { version = "2.0.0-rc.9", optional = true }

# Remote content updates — module moved to vauchi-app.
# Feature retained as empty for backward compatibility (consumers may reference it).
# reqwest/tokio deps removed (were only used by the content module).



# WASM compatibility — uuid needs JS-backed RNG on wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# VRS01 zeroize contract test needs the ZeroizeOnDrop trait bound
# (same version as [dependencies] — no new supply-chain surface)
zeroize = { version = "1.8" }
# OHTTP server features for roundtrip tests (merged with optional ohttp dep)
ohttp = { version = "0.7", default-features = false, features = ["server", "rust-hpke"] }
# App-layer modules (tests reference ui, theme, help, i18n, content)
# Use rustls (not native-tls) — native-tls requires OpenSSL, which is unavailable on Android/WASM targets.
# network-http is REQUIRED so vauchi-app's core-driven link poll
# (advance_link_initiator/responder_session, #[cfg(all(network-http, storage))])
# compiles in — without it the whole ADR-049/050 escrow poll is cfg'd out and
# link_{initiator,responder}_poll_tests fail (broke the nightly mutation baseline).
vauchi-app = { workspace = true, features = ["content-updates", "network-rustls", "network-http"] }
# JSON Schema validation for contract tests
jsonschema = "0.28"
# Temporary directories for storage tests
tempfile = "3.0"
# Async runtime for async sync tests
tokio = { version = "1.0", features = ["rt", "macros"] }
# Property-based testing
proptest = "1.4"
# Parameterized tests
rstest = "0.26"
# Benchmarking
criterion = "0.5"
# BDD testing (executable Gherkin)
cucumber = "0.21"
futures = "0.3"

[[test]]
name = "it"
required-features = ["testing"]

[[test]]
name = "cucumber_tests"
harness = false
# Needs the `testing` exchange seams (MockProximityVerifier) for the two-party
# exchange steps; run with `--features testing,test-kdf`.
required-features = ["testing"]

[[test]]
name = "schema_gen"
required-features = ["schema-gen"]

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "performance_regression"
harness = false

[package.metadata.cargo-machete]
ignored = ["getrandom"]  # Target-specific wasm32 dependency (getrandom/js feature)

# ADR-055: inherit the workspace lint policy.
[lints]
workspace = true
