[package]
name = "vauchi-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Presentation-independent native execution of Vauchi platform commands"
publish = false

[dependencies]
vauchi-core.workspace = true
tokio = { version = "1", features = ["rt", "sync", "macros"] }
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=6.0.0", default-features = false, features = ["tokio"] }
uuid = { version = "1", default-features = false }
tokio = { version = "1", features = ["net"] }

[features]
# Test support: the scripted BlueZ that hosts of `BlueZDiscovery` test
# against (src/fake_bluez.rs).
fake-bluez = []

[dev-dependencies]
vauchi-hardware = { path = ".", features = ["fake-bluez"] }

[lints]
workspace = true
