# cargo-deny configuration for Vauchi
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls-pemfile is unmaintained — transitive via tungstenite/rustls-native-certs.
    # No fix available until tungstenite updates. Tracked upstream.
    "RUSTSEC-2025-0134",
    # bincode replaced with postcard (2026-02-15). Advisory no longer applies.
    # paste is unmaintained — transitive via uniffi. No action available.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-roots (Mozilla CA certs)
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates known to be problematic
deny = [
    # No direct openssl usage — only allowed via native-tls (platform TLS feature)
    # Prefer network-rustls feature for pure-Rust TLS
    { name = "openssl", wrappers = ["native-tls"] },
    { name = "openssl-sys", wrappers = ["native-tls", "openssl"] },
]

# Allow specific duplicates that are common and unavoidable
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
