[package]
name = "vauchi-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform bindings for Vauchi - UniFFI wrapper for Android/iOS/macOS/Desktop"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "vauchi_platform"

[features]
default = ["async-sync"]
# Async sync — runs sync in background thread via tokio::spawn_blocking
async-sync = ["tokio"]
# Enable remote content updates (networks, locales, themes)
content-updates = ["vauchi-core/content-updates", "tokio"]

[dependencies]
# Core Vauchi library (with rustls for Android/iOS - no OpenSSL dependency)
# Note: version required for `cargo package` (path used for local dev, version for published crate)
vauchi-core = { path = "../vauchi-core", version = "0.7.1", default-features = false, features = ["network-rustls"] }

# Async runtime for content updates and async sync (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "time"], optional = true }

# UniFFI for cross-language bindings (tokio feature enables async export support)
uniffi = { version = "0.28", features = ["cli", "tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Base64 encoding for backups
base64 = "0.22"

# Hex encoding for public IDs
hex = "0.4"

# WebSocket for sync (async, rustls for Android/iOS cross-compilation)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Stream/Sink combinators for async WebSocket
futures-util = "0.3"

# TLS for certificate pinning (aws-lc-rs backend — matches vauchi-core, eliminates ring duplication)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "0.26"

# Password strength checking
zxcvbn = "3.0"

# CRC32 checksums for multipart QR codec
crc32fast = "1.4"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "ffi_benchmarks"
harness = false
