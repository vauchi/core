[workspace]
resolver = "3"
members = [
    "vauchi-app",
    "vauchi-cabi",
    "vauchi-core",
    "vauchi-platform",
    "vauchi-protocol",
]
# Vendored fork of rqrr (see [patch.crates-io] below). Excluded from the
# workspace so it is NOT formatted, clippy-linted, or built by `--workspace`
# commands — it is third-party code held byte-identical to upstream (one
# patched function). It is still consumed via the [patch] redirect, and its
# own tripwire tests run standalone: `cargo test --manifest-path vendor/rqrr/Cargo.toml --lib`
# (--lib skips upstream's `img`-feature-gated crate-level doctest, which is
# unrelated to the patch and not run in CI since the crate is workspace-excluded).
exclude = ["vendor/rqrr"]

[workspace.package]
version = "0.52.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/core"
authors = ["Vauchi Contributors"]

[workspace.dependencies]
vauchi-core = { path = "vauchi-core", version = "0.52.0", default-features = false }
vauchi-app = { path = "vauchi-app", version = "0.52.0", default-features = false }
vauchi-protocol = { path = "vauchi-protocol", version = "0.52.0" }

# Vendored fork of rqrr 0.10.1 — patches Perspective::map to clamp instead of
# abort on a near-degenerate QR perspective (panic=abort makes the upstream
# assert uncatchable). Keeps version 0.10.1; redirects the `rqrr = "0.10"` dep
# in vauchi-core. See _private/docs/problems/2026-05-25-rqrr-perspective-panic-crashes-qr-scan
# and core/vendor/rqrr/src/geometry.rs (top-of-file patch marker).
[patch.crates-io]
rqrr = { path = "vendor/rqrr" }

# Release profile: optimized for size (mobile binaries)
[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile)
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip debug symbols from release binaries
overflow-checks = true  # Panic on integer overflow (security: prevent silent wrapping)

# Development profile: fast compilation, good debugging
[profile.dev]
opt-level = 0        # No optimization
debug = "line-tables-only"  # Backtraces work, 2-30% faster builds (use CARGO_PROFILE_DEV_DEBUG=2 for full debuginfo)
strip = false
split-debuginfo = "unpacked"  # Reduce linker work (skip debuginfo bundling)

# Release with debug info (for profiling)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# CI profile: faster builds with reasonable optimization
[profile.ci]
inherits = "release"
lto = "thin"          # Faster than full LTO, still good optimization
codegen-units = 16    # More parallelism during compilation
incremental = false   # CI builds are fresh, no benefit from incremental

# Test profile: backtraces work, but skip full debug info and split .dwo files.
# Reduces test binary size ~60% and eliminates 278K .dwo files (~7.5 GB).
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

# Mutation testing profile: fast incremental builds, no debug info needed
[profile.mutants]
inherits = "test"
debug = "none"        # Skip debug symbols — mutants only need pass/fail

# Shared lint policy (ADR-055). Members opt in with `[lints] workspace = true`.
# Phase 1: deny dev artifacts that must never ship. Higher-value restriction
# lints (unwrap_used, indexing_slicing, arithmetic_side_effects) are Phase 2 —
# they flag existing code and need per-site triage, so they land lint-by-lint.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
