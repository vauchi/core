# Rust-analyzer proc-macro support
[build]
rustc-wrapper = "sccache"
rustflags = ["--cfg", "rust_analyzer"]

# Use mold linker on Linux for faster linking (2-5x speedup)
# Install: apt install mold OR cargo install mold
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "--cfg", "rust_analyzer"]

# Android NDK configuration for cross-compilation
# NOTE: Linker paths are set via environment variables in build-bindings.sh
# to support different NDK locations (Android Studio SDK vs standalone NDK)

# Limit exported symbols to uniffi_*/Java_*/JNI_OnLoad via version script.
# Reduces GLOB_DAT relocations and speeds up linker load on eMMC devices
# (Pixel 3a cold start: ~10-30x fewer relocations to process).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--version-script=vauchi-platform/android-symbols.map"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,--version-script=vauchi-platform/android-symbols.map"]
