# GitLab CI for vauchi-core
#
# Pipeline strategy (PI-13 fail-fast DAG):
#   - MR: Validation with DAG ordering — cheap checks gate expensive ones
#   - Tags (v*): Build, package, publish releases
#
# DAG execution order (MR pipelines):
#   lint (< 2 min) ──┬── test (< 15 min) ──── mutation (advisory)
#                     ├── bench (advisory, change-based)
#                     └── security (< 5 min)
#
#   Lint must pass before tests or security run. Mutation only runs
#   after tests pass. Security runs parallel with tests.
#
# Uses shared templates from vauchi/scripts for consistency.
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#     - Rust lint/test: *.rs, Cargo.toml, Cargo.lock
#     - REUSE lint: LICENSES/, REUSE.toml, LICENSE*
#     - Security audit: Cargo.toml, Cargo.lock (dependencies)
#     - License check: Cargo.*, deny.toml
#   - Test and coverage combined in single pass
#   - DAG execution: needs: with optional:true for cross-rule compatibility
#   - Parallel build jobs (iOS + Android)
#   - Parallel test jobs (core + mobile)
#   - Parallel publish jobs (core + mobile)
#   - CARGO_INCREMENTAL=0 to reduce target/ size and cache overhead
#   - No-cache/read-only cache for lint/security jobs (skip expensive upload)
#   - mold linker on Linux (2-5x faster linking)
#   - Cargo.lock-based cache keys (smarter invalidation)

# Include shared templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/mutation.yml'

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - package
  - publish
  - trigger


# ============================================================
# Auto-Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.

auto-tag:version:
  extends: [.linux-runner-nocache, .main-only]
  stage: auto-tag
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  before_script: []
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "✓ Tag ${TAG} already exists — nothing to do"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git config user.name "vauchi-gitlab-runner"
      git config user.email "noreply@vauchi.app"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/package/publish stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"

# ============================================================
# Lint Stage — Preflight Gate (MR only, change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.linux-runner-nocache, .validation-rust, .timeout-quick]
  stage: lint
  needs: []
  script:
    - cargo fmt --all -- --check

lint:clippy:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: lint
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo clippy --all-targets -- -D warnings

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

# ============================================================
# Test Stage (MR only, gated by lint)
# ============================================================

# Clone sibling locales repo (needed by build.rs and i18n tests)
.clone-locales:
  before_script:
    - if [ ! -d ../locales ]; then git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales; else git -C ../locales pull --ff-only 2>/dev/null || true; fi

# Clone sibling themes repo (needed by content contract validation)
.clone-themes:
  before_script:
    - if [ ! -d ../themes ]; then git clone --depth=1 https://gitlab.com/vauchi/themes.git ../themes; else git -C ../themes pull --ff-only 2>/dev/null || true; fi

# MR test jobs: use nextest for fast feedback (12x faster than cargo test,
# avoids llvm-cov instrumentation rebuild). Coverage runs on main only.
# Cucumber tests use cargo test (not nextest) because harness=false output
# is incompatible with nextest's test listing format.
test:core:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: test
  parallel: 2
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run -p vauchi-core --partition slice:${CI_NODE_INDEX}/${CI_NODE_TOTAL}

test:cucumber:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: test
  allow_failure: true  # advisory: some feature files have parsing errors
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - if [ ! -d ../features ]; then git clone --depth=1 https://gitlab.com/vauchi/features.git ../features; else git -C ../features pull --ff-only 2>/dev/null || true; fi
  script:
    - cargo test --test cucumber_tests -- --tags "not @wip"

test:mobile:
  extends: [.linux-runner, .validation-mobile, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run -p vauchi-mobile

# Content contract validation — detect drift between core parsers and
# sibling content repos (themes/, locales/). Runs when parser code changes.
validate:content-contracts:
  extends: [.linux-runner, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - bash scripts/validate-content-contracts.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "vauchi-core/src/theme.rs"
          - "vauchi-core/src/i18n.rs"
          - "vauchi-core/src/social/**/*.rs"
          - "vauchi-core/src/content/**/*.rs"
          - "scripts/validate-content-contracts.sh"

# Coverage jobs: run on main merges only (not MRs) — llvm-cov is too slow
# for per-push feedback but still needed for coverage tracking/badges.
coverage:core:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo binstall cargo-llvm-cov --no-confirm 2>/dev/null || cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov -p vauchi-core --lcov --output-path lcov-core.info
    - cargo llvm-cov report -p vauchi-core --cobertura --output-path cobertura-core.xml
    - cargo llvm-cov report -p vauchi-core
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-core.xml
    paths:
      - lcov-core.info
      - cobertura-core.xml
    expire_in: 1 week

coverage:mobile:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo binstall cargo-llvm-cov --no-confirm 2>/dev/null || cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov -p vauchi-mobile --lcov --output-path lcov-mobile.info
    - cargo llvm-cov report -p vauchi-mobile --cobertura --output-path cobertura-mobile.xml
    - cargo llvm-cov report -p vauchi-mobile
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-mobile.xml
    paths:
      - lcov-mobile.info
      - cobertura-mobile.xml
    expire_in: 1 week

# ============================================================
# Benchmark Stage — Performance Regression Gate (PI-10)
# ============================================================
# Criterion benchmarks with baseline comparison.
# - merge to main: save baseline results
# - MR: compare against saved baseline, warn on > 20% regression

# Cache for benchmark baselines (shared between main and MR jobs)
.bench-cache:
  cache:
    key: bench-baseline-main
    paths:
      - target/criterion/

# Save baseline on merge to main
bench:save-baseline:
  extends: [.linux-runner, .timeout-standard, .bench-cache]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    # Run on schedule only (baseline up to 24h stale — acceptable given benchmark variance)
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression -- --save-baseline main
  artifacts:
    paths:
      - target/criterion/
    expire_in: 30 days

# Compare against baseline on MRs (advisory)
bench:compare:
  extends: [.linux-runner, .timeout-standard, .bench-cache]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "vauchi-core/src/**/*.rs"
          - "vauchi-core/benches/**/*.rs"
          - "vauchi-core/Cargo.toml"
          - ".gitlab-ci.yml"
      when: manual
  allow_failure: true
  cache:
    key: bench-baseline-main
    paths:
      - target/criterion/
    policy: pull
  script:
    - |
      if [ -d "target/criterion" ]; then
        echo "Found baseline — comparing..."
        cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression -- --baseline main 2>&1 | tee bench-results.txt
        # Check for regressions > 20%
        if grep -E 'regressed.*\+[2-9][0-9]\.' bench-results.txt || grep -E 'regressed.*\+[1-9][0-9][0-9]' bench-results.txt; then
          echo "⚠ WARNING: Performance regression > 20% detected!"
          echo "  Review bench-results.txt for details."
        else
          echo "✓ No significant regressions detected"
        fi
      else
        echo "No baseline found — running benchmarks without comparison"
        cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression 2>&1 | tee bench-results.txt
      fi
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 1 week
    when: always

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .linux-runner, .timeout-extended]
  variables:
    MUTATION_PACKAGE: "vauchi-core"
    MUTATION_TIMEOUT_NIGHTLY: "60"

mutation:incremental:
  extends: [.mutation-incremental, .linux-runner, .timeout-extended]
  needs:
    - job: test:core
      optional: true
  variables:
    MUTATION_PACKAGE: "vauchi-core"
    MUTATION_TIMEOUT_INCREMENTAL: "90"

# ============================================================
# Fuzz Testing (Nightly scheduled, T2-10)
# ============================================================

# Nightly fuzz run — cycles through all 11 fuzz targets for 5 minutes each
fuzz:nightly:
  extends: [.linux-runner, .timeout-extended]
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  script:
    - |
      # Install cargo-fuzz if not available
      command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked

      cd vauchi-core/fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FAILED=0

      for target in fuzz_decode_message fuzz_qr_payload fuzz_unpad fuzz_delta_decode \
                     fuzz_recovery_claim fuzz_nfc_payload fuzz_ble_payload \
                     fuzz_ble_advertisement fuzz_exchange_payload fuzz_encrypted_exchange \
                     fuzz_ratchet_state; do
        echo "=== Fuzzing $target for ${FUZZ_DURATION}s ==="
        cargo fuzz run "$target" -- -max_total_time="$FUZZ_DURATION" 2>&1 || {
          echo "CRASH FOUND in $target"
          FAILED=$((FAILED + 1))
        }
        echo ""
      done

      echo "=== Fuzz Summary ==="
      echo "Targets: 11, Crashes: $FAILED"
      [ "$FAILED" -eq 0 ] || exit 1
  artifacts:
    paths:
      - vauchi-core/fuzz/artifacts/
    expire_in: 1 month
    when: on_failure

# ============================================================
# Security Stage (MR only, gated by lint, parallel with test)
# ============================================================

# Rust-specific security audit (runs on dependency changes)
security:audit:
  extends: [.linux-runner-readonly, .validation-deps, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || cargo install cargo-audit || true
    - cargo audit

# Full cargo-deny check: advisories, licenses, bans, sources (runs on all MRs)
security:deny:
  extends: [.linux-runner-readonly, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - command -v cargo-deny >/dev/null 2>&1 || cargo binstall cargo-deny --no-confirm 2>/dev/null || cargo install cargo-deny || true
    - cargo deny check

# ============================================================
# Build Stage - Tags (release builds)
# ============================================================

# Verify tag is on main branch before proceeding with release
# Overrides .self-hosted SSH clone — tag pipelines need HTTPS checkout
# since the runner may not have gitlab.com in known_hosts
release:verify:
  extends: [.linux-runner, .release-only]
  stage: build
  needs: []
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "100"
  before_script: []
  script:
    - |
      echo "Verifying tag $CI_COMMIT_TAG is on main branch..."
      git fetch origin main --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "✓ Tag $CI_COMMIT_TAG is on main branch"
      else
        echo "✗ ERROR: Tag $CI_COMMIT_TAG is NOT on main branch!"
        echo "  Tags must only be created on commits that are on main."
        exit 1
      fi

build:ios:
  extends: [.macos-runner, .release-only, .timeout-extended]
  stage: build
  needs: [release:verify]
  script:
    - ./scripts/build-bindings.sh --ios
  artifacts:
    paths:
      - target/bindings/ios/
    expire_in: 1 day

build:android:
  extends: [.linux-runner, .release-only, .timeout-long]
  stage: build
  needs: [release:verify]
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
  artifacts:
    paths:
      - target/bindings/android/
    expire_in: 1 day

# Validate generated bindings have all expected types
build:validate-bindings:
  extends: [.linux-runner, .release-only]
  stage: build
  needs:
    - job: build:ios
      artifacts: true
    - job: build:android
      artifacts: true
  script:
    - ./scripts/validate-bindings.sh
  allow_failure: false

# ============================================================
# Package Stage (Tags only)
# ============================================================

package:xcframework:
  extends: [.macos-runner, .release-only]
  stage: package
  needs: [build:ios, build:validate-bindings]
  script:
    - ./scripts/package-xcframework.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/VauchiMobileFFI.xcframework.zip
      - dist/VauchiMobileFFI.xcframework.zip.sha256
      - dist/VauchiMobileFFI.xcframework.zip.sha256.sig
      - dist/VauchiMobile-*.zip
    expire_in: 1 week

package:android:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [build:android, build:validate-bindings]
  script:
    - ./scripts/package-android.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/vauchi-mobile-android-*.zip
      - dist/vauchi-mobile-android-*.zip.sha256
      - dist/vauchi-mobile-android-*.zip.sha256.sig
    expire_in: 1 week

# Generate CycloneDX SBOM for supply-chain traceability (T0-2)
package:sbom:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [release:verify]
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Generating SBOM for vauchi v${VERSION}..."

      # Install cargo-cyclonedx
      cargo install cargo-cyclonedx --locked

      # Generate CycloneDX JSON for each crate
      # cargo-cyclonedx >=0.5.7 outputs next to Cargo.toml with .cdx.json suffix
      mkdir -p dist

      for crate in vauchi-core vauchi-mobile vauchi-protocol; do
        cargo cyclonedx --manifest-path "${crate}/Cargo.toml" --format json
        mv "${crate}/bom.cdx.json" "dist/${crate}-${VERSION}.sbom.json"
      done

      # Generate checksums
      for f in dist/*.sbom.json; do
        sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
      done

      # Sign with cosign if available
      if [[ -n "${COSIGN_KEY:-}" ]]; then
        for f in dist/*.sbom.json.sha256; do
          cosign sign-blob --yes --key "$COSIGN_KEY" \
            --output-signature "${f}.sig" "$f"
        done
        echo "SBOMs signed"
      fi

      echo "SBOM generation complete"
  artifacts:
    paths:
      - dist/*.sbom.json
      - dist/*.sbom.json.sha256
      - dist/*.sbom.json.sha256.sig
    expire_in: 1 week

# ============================================================
# Publish Stage (Tags only)
# ============================================================

publish:packages:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [package:xcframework, package:android, package:sbom]
  script:
    - ./scripts/publish-packages.sh "$CI_COMMIT_TAG"

# Publish vauchi-core crate to GitLab package registry
publish:core:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-core $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml

        # Try to create an MR to bump version on main (non-blocking)
        echo "  Attempting to create MR to update version on main..."
        (
          BRANCH_NAME="chore/bump-version-${VERSION}"
          REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
          git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
          git checkout -b "$BRANCH_NAME"
          git add Cargo.toml
          git -c user.name="CI Bot" -c user.email="ci@vauchi.com" \
            commit -m "chore: Bump version to $VERSION"
          git push -u origin "$BRANCH_NAME" && \
          MR_RESP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"source_branch\": \"${BRANCH_NAME}\",
              \"target_branch\": \"main\",
              \"title\": \"chore: Bump version to ${VERSION}\",
              \"description\": \"Auto-generated by release pipeline. Tag ${CI_COMMIT_TAG} was published with version ${VERSION} but Cargo.toml had ${MANIFEST_VERSION}.\",
              \"remove_source_branch\": true
            }" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests") && \
          MR_IID=$(echo "$MR_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('iid',''))" 2>/dev/null || true) && \
          if [ -n "$MR_IID" ]; then
            echo "  ✓ MR created to bump version on main"
            # Enable auto-merge
            curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --request PUT \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge?merge_when_pipeline_succeeds=true" > /dev/null 2>&1 && \
            echo "  ✓ Auto-merge enabled" || echo "  ⚠ Could not enable auto-merge"
          fi
        ) || echo "  ⚠ Could not create MR (CI_JOB_TOKEN may lack write access). Please bump Cargo.toml manually."

        # Restore working tree for cargo package (subshell changed branch)
        git checkout -f "${CI_COMMIT_SHA}" 2>/dev/null || true
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Package the crate
      cargo package -p vauchi-core --allow-dirty

      # Upload to GitLab generic packages registry
      CRATE_FILE="target/package/vauchi-core-${VERSION}.crate"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${VERSION}/vauchi-core-${VERSION}.crate"

      echo "✓ Published vauchi-core $VERSION"

# Publish vauchi-mobile crate to GitLab package registry
publish:mobile:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-mobile $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package requires vauchi-core on crates.io)
      # Use temp directory to get correct archive structure
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-mobile-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-mobile/Cargo.toml "$PKG_DIR/"
      # Replace workspace version reference with actual version for standalone crate
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      cp vauchi-mobile/uniffi-bindgen.rs "$PKG_DIR/"
      cp vauchi-mobile/README.md "$PKG_DIR/"
      cp -r vauchi-mobile/src "$PKG_DIR/"
      cp -r vauchi-mobile/benches "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-mobile-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-mobile-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${VERSION}/vauchi-mobile-${VERSION}.crate"

      echo "✓ Published vauchi-mobile $VERSION"

release:create:
  extends: .release-only
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  interruptible: false
  needs: [publish:packages, publish:core, publish:mobile, package:sbom]
  script:
    - |
      echo "Creating release $CI_COMMIT_TAG"

      # T1-6: GPG-sign release checksums if signing key is available
      if [ -n "${GPG_SIGNING_KEY:-}" ]; then
        echo "Importing GPG signing key..."
        echo "$GPG_SIGNING_KEY" | gpg --batch --import 2>/dev/null
        GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)

        if [ -n "$GPG_KEY_ID" ]; then
          echo "Signing release tag $CI_COMMIT_TAG with GPG key $GPG_KEY_ID..."
          echo "$CI_COMMIT_TAG" | gpg --batch --yes --armor --detach-sign \
            --local-user "$GPG_KEY_ID" > release-tag.sig 2>/dev/null && \
          echo "Release tag signature created" || \
          echo "WARNING: GPG signing failed (non-blocking)"
        fi
      elif [ -n "${CI:-}" ]; then
        echo "WARNING: GPG_SIGNING_KEY not set — release will be unsigned"
      fi
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Vauchi $CI_COMMIT_TAG

      ### Rust Crates

      - [vauchi-core](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.crate)
      - [vauchi-mobile](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/vauchi-mobile-${CI_COMMIT_TAG#v}.crate)

      ### Mobile Bindings

      - [iOS XCFramework](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/VauchiMobileFFI.xcframework.zip)
      - [Android](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/vauchi-mobile-android-${CI_COMMIT_TAG#v}.zip)

      ### Supply Chain

      - [vauchi-core SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-mobile SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/vauchi-mobile-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-protocol SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-protocol/${CI_COMMIT_TAG#v}/vauchi-protocol-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)

      ### Integration

      See [documentation](https://gitlab.com/vauchi/core/-/blob/main/README.md) for integration instructions.

# ============================================================
# Trigger Stage (Tags only) — Mobile Distribution
# ============================================================
# Trigger vauchi-mobile-swift and vauchi-mobile-android to rebuild
# and publish bindings for this release version.
#
# Uses GitLab's native trigger: keyword instead of the Pipeline API
# because CI_JOB_TOKEN lacks the 'api' scope needed for POST /pipeline.
# The trigger: keyword uses CI_JOB_TOKEN implicitly — downstream projects
# must add vauchi/core to their CI_JOB_TOKEN allowlist.
#
# UPSTREAM_VERSION is passed as a variable so downstream repos know which
# core tag to build bindings from.

trigger:swift:
  stage: trigger
  needs: [release:create]
  interruptible: false
  variables:
    UPSTREAM_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/vauchi-mobile-swift
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

trigger:android:
  stage: trigger
  needs: [release:create]
  interruptible: false
  variables:
    UPSTREAM_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/vauchi-mobile-android
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ============================================================
# Downstream Verification (main branch only)
# ============================================================
# When core merges to main, verify that Rust consumer repos (desktop, cli,
# tui) still build and pass tests against the updated core. This catches
# API breaks early — before a release is even considered.
#
# Uses GitLab's trigger: keyword which creates linked child pipelines
# visible in the pipeline graph. CI_JOB_TOKEN is used implicitly —
# downstream projects must add vauchi/core to their CI_JOB_TOKEN allowlist.

verify:downstream-rust:
  stage: trigger
  extends: .trigger-parallel
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/desktop, vauchi/cli, vauchi/tui]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Manual Dev Build (on-demand)
# ============================================================

build:dev:
  extends: .linux-runner
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    DEV_VERSION: "dev-${CI_COMMIT_SHORT_SHA}"
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
    - ./scripts/package-android.sh "$DEV_VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 3 days

# ============================================================
# Cleanup Stage (scheduled or manual)
# ============================================================
# Runs periodically to clean up runner disk space

cleanup:runner:
  extends: .cleanup-runner
  # Run weekly via scheduled pipeline or manually
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
