[package]
name = "vauchi-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared protocol message types for Vauchi relay communication"

# SP-33: intentional breaking change for v0.1 alpha (no deployed clients).
# RegisterMailbox and DeregisterMailbox added to exhaustive MessagePayload enum.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
