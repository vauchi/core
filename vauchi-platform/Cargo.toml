[package]
name = "vauchi-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform bindings for Vauchi - UniFFI wrapper for Android/iOS/macOS/Desktop"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "vauchi_platform"

[features]
default = ["async-sync", "content-updates"]
# Async sync — runs sync in background thread via tokio::spawn_blocking
async-sync = ["tokio"]
# Enable remote content updates (networks, locales, themes).
# Default-on so mobile bindings expose check_content_updates() / apply_content_updates()
# instead of silently returning Disabled. Gate 2 of frontend architecture audit (2026-03-18).
content-updates = ["vauchi-app/content-updates", "tokio"]
# Diagnostic QR preprocessing pipeline (imageproc, fast_image_resize, CLAHE,
# adaptive threshold, unsharp mask). Gates the `diagnostic_scan_qr_with_config`
# UniFFI export. NOT in defaults — production mobile scanner uses rxing/rqrr
# directly via `diagnostic_scan_qr` (always available).
diagnostic-scanner = ["vauchi-core/diagnostic-scanner"]
# YOLO-based QR detector (adds ort ONNX runtime)
diagnostic-yolo = ["diagnostic-scanner", "vauchi-core/diagnostic-yolo"]

[dependencies]
# Core Vauchi library (with rustls for Android/iOS - no OpenSSL dependency)
# Note: version required for `cargo package` (path used for local dev, version for published crate)
vauchi-core = { workspace = true, default-features = false, features = ["network-rustls", "network-http"] }
vauchi-app = { workspace = true, default-features = false, features = ["network-rustls"] }

# Async runtime for content updates and async sync (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "time"], optional = true }

# UniFFI for cross-language bindings (tokio feature enables async export support)
uniffi = { version = "0.28", features = ["cli", "tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Base64 encoding for backups
base64 = "0.22"

# Hex encoding for public IDs
hex = "0.4"

# Password strength checking
zxcvbn = "3.0"

# CRC32 checksums for multipart QR codec
crc32fast = "1.4"

# QR code generation (replaces ZXing on Android, used for all platforms)
qrcode = { version = "0.14", default-features = false }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.0"
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "ffi_benchmarks"
harness = false
