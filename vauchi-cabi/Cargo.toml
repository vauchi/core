[package]
name = "vauchi-cabi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bindings for vauchi-core workflow engines"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
secure-storage = ["vauchi-core/secure-storage-linux"]
# Dev/debug-only stderr log backend. OFF in release: a shipped desktop
# binary registers no backend, so vauchi-app `log::` call sites are
# silent no-ops. The C host enables this only in its debug build config.
dev-logging = ["dep:env_logger"]

[dependencies]
vauchi-core = { workspace = true, default-features = false, features = ["storage", "network-rustls", "network-http"] }
vauchi-app = { workspace = true, default-features = false, features = ["network-rustls", "network-http"] }
serde_json = "1.0"
zeroize = "1.8"
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3"
# Facade only — lets the feature-off test assert no backend is installed.
log = "0.4"

[build-dependencies]
cbindgen = "0.29"

[package.metadata.cargo-machete]
ignored = ["cbindgen"]  # Build dependency used in build.rs
