# Core — Publish + Trigger Stages (release-or-rc tag pipelines only)
#
# Extracted from core/.gitlab-ci.yml on 2026-04-22 as Phase 0 Part 5
# of the T2.3 split (2026-04-22-ci-pipeline-health-audit).
# Pure extraction — byte-identical to the deleted block. Included as
# `local: ci/publish-and-trigger.yml` from core/.gitlab-ci.yml.
#
# Contents (only runs on stable/rc tag pipelines):
#
# Publish stage:
#   - publish:packages      — upload to generic package registry
#   - publish:maven         — Android Maven AAR + POM to package registry
#   - publish:swift         — update vauchi-platform-swift SPM package
#   - publish:github        — mirror tag to GitHub release
#   - update:swift-bindings — regenerate + commit Swift binding updates
#
# Trigger stage:
#   - trigger:ios           — fire downstream iOS consumer pipeline
#   - trigger:macos         — fire downstream macos pipeline
#   - trigger:android       — fire downstream android pipeline
#   - trigger:linux-gtk     — fire downstream linux-gtk pipeline
#   - trigger:linux-qt      — fire downstream linux-qt pipeline
#   - trigger:windows       — fire downstream windows pipeline
#   - prerelease:cleanup    — scheduled prerelease package cleanup

# ============================================================
# Publish Stage (Tags only)
# ============================================================

publish:packages:
  extends: [.linux-runner, .release-or-rc]
  stage: publish
  needs:
    - package:xcframework
    - package:android
    # Layer 2 ABI parity gate — block publishing if bindings
    # and artifacts drift. Plan Phase 2 Task 2.3.
    # check:binding-abi-ios is allow_failure:true (see its definition);
    # relying on the Android gate alone for now since all 799 symbols
    # match cross-platform, so drift would surface there first.
    - check:binding-abi-android
    # sbom is .release-only (not RC) — must be optional here since
    # publish:packages runs on RC tags too (.release-or-rc)
    - job: package:sbom
      optional: true
  script:
    - ./scripts/publish-packages.sh "$CI_COMMIT_TAG"

# Publish vauchi-core crate to GitLab package registry
publish:core:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-core $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml

        # Try to create an MR to bump version on main (non-blocking)
        echo "  Attempting to create MR to update version on main..."
        (
          BRANCH_NAME="chore/bump-version-${VERSION}"
          REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
          git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
          git checkout -b "$BRANCH_NAME"
          git add Cargo.toml
          # Use bot's verified commit_email — GITLAB_USER_EMAIL is the
          # human who pushed the tag, rejected by "unverified email" push rule.
          BOT_INFO=$(curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
          _EMAIL=$(echo "$BOT_INFO" | jq -r '.commit_email // .email // empty')
          _NAME=$(echo "$BOT_INFO" | jq -r '.name // empty')
          git -c user.name="${_NAME:-${GITLAB_USER_NAME}}" \
              -c user.email="${_EMAIL:-${GITLAB_USER_EMAIL}}" \
            commit -m "chore: Bump version to $VERSION"
          git push -u origin "$BRANCH_NAME" && \
          MR_RESP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"source_branch\": \"${BRANCH_NAME}\",
              \"target_branch\": \"main\",
              \"title\": \"chore: Bump version to ${VERSION}\",
              \"description\": \"Auto-generated by release pipeline. Tag ${CI_COMMIT_TAG} was published with version ${VERSION} but Cargo.toml had ${MANIFEST_VERSION}.\",
              \"remove_source_branch\": true
            }" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests") && \
          MR_IID=$(echo "$MR_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('iid',''))" 2>/dev/null || true) && \
          if [ -n "$MR_IID" ]; then
            echo "  ✓ MR created to bump version on main"
            # Enable auto-merge
            curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --request PUT \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge?merge_when_pipeline_succeeds=true" > /dev/null 2>&1 && \
            echo "  ✓ Auto-merge enabled" || echo "  ⚠ Could not enable auto-merge"
          fi
        ) || echo "  ⚠ Could not create MR (CI_JOB_TOKEN may lack write access). Please bump Cargo.toml manually."

        # Restore working tree for cargo package (subshell changed branch)
        git checkout -f "${CI_COMMIT_SHA}" 2>/dev/null || true
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package fails on workspace path deps
      # not published to crates.io — same workaround as publish:platform)
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-core-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-core/Cargo.toml "$PKG_DIR/"
      # Extract workspace metadata (not hardcoded — survives edition/license changes)
      WS_EDITION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^edition' | sed 's/.*"\(.*\)"/\1/')
      WS_LICENSE=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^license' | sed 's/.*"\(.*\)"/\1/')
      # Resolve workspace package metadata
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      sed -i "s/^edition\.workspace = true/edition = \"${WS_EDITION}\"/" "$PKG_DIR/Cargo.toml"
      sed -i "s/^license\.workspace = true/license = \"${WS_LICENSE}\"/" "$PKG_DIR/Cargo.toml"
      # Resolve ALL workspace dependency references (self-healing for future deps):
      # Dotted form: any-dep.workspace = true → any-dep = { version = "X" }
      sed -i "s/^\([a-z_-]*\)\.workspace = true/\1 = { version = \"${VERSION}\" }/" "$PKG_DIR/Cargo.toml"
      # Inline form: { workspace = true, features = [...] } → { version = "X", features = [...] }
      sed -i "s/workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      # Strip path references from inline deps (e.g. { path = "../x", version = "0.1" } → { version = "0.1" })
      sed -i 's|path = "\.\./[^"]*", ||g' "$PKG_DIR/Cargo.toml"
      sed -i 's|, path = "\.\./[^"]*"||g' "$PKG_DIR/Cargo.toml"
      cp -r vauchi-core/src "$PKG_DIR/"
      [ -f vauchi-core/build.rs ] && cp vauchi-core/build.rs "$PKG_DIR/"
      [ -f vauchi-core/README.md ] && cp vauchi-core/README.md "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-core-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-core-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${VERSION}/vauchi-core-${VERSION}.crate")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Published vauchi-core $VERSION"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ vauchi-core $VERSION already published — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

# Publish vauchi-platform crate to GitLab package registry
publish:platform:
  extends: [.linux-runner, .release-or-rc]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-platform $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package requires vauchi-core on crates.io)
      # Use temp directory to get correct archive structure
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-platform-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-platform/Cargo.toml "$PKG_DIR/"
      # Replace workspace version reference with actual version for standalone crate
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      cp vauchi-platform/uniffi-bindgen.rs "$PKG_DIR/"
      cp vauchi-platform/README.md "$PKG_DIR/"
      cp -r vauchi-platform/src "$PKG_DIR/"
      cp -r vauchi-platform/benches "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-platform-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-platform-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${VERSION}/vauchi-platform-${VERSION}.crate")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Published vauchi-platform $VERSION"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ vauchi-platform $VERSION already published — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

# Publish Android AAR to core's Maven registry (visible at group level).
# Eliminates the vauchi-platform-kotlin intermediary repo.
publish:maven:
  extends: .docker-runner
  stage: publish
  image: cimg/android:2025.01
  interruptible: false
  # Layer 2 ABI parity gate (plan Phase 2 Task 2.3) — Maven
  # publication of the AAR must not ship bindings that reference
  # symbols the shipped .so does not export.
  needs: [package:android, check:binding-abi-android]
  variables:
    VERSION: "${CI_COMMIT_TAG}"
  rules:
    # Release and RC tags only — dev tags do not publish to Maven
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      CLEAN_VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing Maven AAR version $CLEAN_VERSION"

      # Idempotency guard: skip if this version is already in the GitLab Maven
      # registry. A duplicate Maven PUT returns HTTP 400 (duplicates disallowed),
      # so a redundant release re-run of an already-published version turned into
      # a false-red even though the aar was fully published (2026-07-01: the
      # v0.51.67 re-run 400ed 48 min after the successful publish).
      if curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=maven&package_name=vauchi-platform&per_page=100" \
         | grep -q "\"version\":\"${CLEAN_VERSION}\""; then
        echo "✓ app.vauchi:vauchi-platform:$CLEAN_VERSION already in the Maven registry — skipping publish (idempotent re-run)"
        exit 0
      fi

      # Verify cosign signature on the zip before repackaging as AAR
      CHECKSUM_FILE="dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ -f "$BUNDLE_FILE" ]] && [[ -f "$COSIGN_PUB" ]]; then
        cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
          echo "ERROR: Android zip cosign verification FAILED — refusing to publish"
          exit 1
        }
        echo "✓ Android zip cosign signature verified"
      else
        echo "ERROR: cosign bundle or public key missing — cannot verify Android zip"
        exit 1
      fi

      # Verify the zip checksum matches the actual file
      EXPECTED=$(cat "$CHECKSUM_FILE" | tr -d '[:space:]')
      ACTUAL=$(sha256sum "dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip" | cut -d' ' -f1)
      if [[ "$EXPECTED" != "$ACTUAL" ]]; then
        echo "ERROR: zip checksum mismatch (expected $EXPECTED, got $ACTUAL)"
        exit 1
      fi
      echo "✓ Android zip checksum verified"

      # Extract pre-packaged Android bindings (zip has version-prefixed top dir)
      mkdir -p ci/maven-publish/vauchi-platform/src/main/jniLibs
      mkdir -p ci/maven-publish/vauchi-platform/src/main/kotlin
      rm -rf /tmp/android-bindings
      unzip -o dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip -d /tmp/android-bindings

      # Copy JNI libs (arm64-v8a, x86_64)
      cp -r /tmp/android-bindings/vauchi-platform-kotlin-${CLEAN_VERSION}/jniLibs/* ci/maven-publish/vauchi-platform/src/main/jniLibs/

      # Copy Kotlin bindings
      cp -r /tmp/android-bindings/vauchi-platform-kotlin-${CLEAN_VERSION}/kotlin/* ci/maven-publish/vauchi-platform/src/main/kotlin/

      # Build and publish AAR
      cd ci/maven-publish
      export VERSION="$CLEAN_VERSION"
      ./gradlew :vauchi-platform:publishReleasePublicationToGitLabRepository --no-daemon

      echo "✓ Published app.vauchi:vauchi-platform:$CLEAN_VERSION to Maven"

release:create:
  extends: .release-only
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  tags:
    - docker
  interruptible: false
  needs:
    - publish:packages
    - publish:core
    - publish:platform
    - job: publish:maven
      optional: true
    - package:sbom
    - package:slsa-provenance
  script:
    - |
      echo "Creating release $CI_COMMIT_TAG"

      # Delete existing release if present (idempotent on pipeline retry).
      # The `release:` keyword creates with --no-update, so a pre-existing
      # release (from a previous run of this pipeline) causes a hard failure.
      curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --request DELETE \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}" \
        && echo "Deleted stale release $CI_COMMIT_TAG (pipeline retry)" \
        || echo "No existing release — creating fresh"

      # T1-6: GPG-sign release checksums if signing key is available
      if [ -n "${GPG_SIGNING_KEY:-}" ]; then
        echo "Importing GPG signing key..."
        echo "$GPG_SIGNING_KEY" | gpg --batch --import 2>/dev/null
        GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)

        if [ -n "$GPG_KEY_ID" ]; then
          echo "Signing release tag $CI_COMMIT_TAG with GPG key $GPG_KEY_ID..."
          echo "$CI_COMMIT_TAG" | gpg --batch --yes --armor --detach-sign \
            --local-user "$GPG_KEY_ID" > release-tag.sig 2>/dev/null && \
          echo "Release tag signature created" || \
          echo "WARNING: GPG signing failed (non-blocking)"
        fi
      elif [ -n "${CI:-}" ]; then
        echo "WARNING: GPG_SIGNING_KEY not set — release will be unsigned"
      fi
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Vauchi $CI_COMMIT_TAG

      ### Rust Crates

      - [vauchi-core](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.crate)
      - [vauchi-platform](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-${CI_COMMIT_TAG#v}.crate)

      ### Platform Bindings

      - [iOS XCFramework](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/VauchiPlatformFFI.xcframework.zip)
      - [Android](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-kotlin-${CI_COMMIT_TAG#v}.zip)

      ### Supply Chain

      - [vauchi-core SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-platform SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-protocol SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-protocol/${CI_COMMIT_TAG#v}/vauchi-protocol-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [SLSA L2 Provenance](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/provenance.intoto.jsonl) ([verify](https://docs.vauchi.app/developers/verify-releases/))

      ### Integration

      See [documentation](https://gitlab.com/vauchi/core/-/blob/main/README.md) for integration instructions.

# ============================================================
# Trigger Stage (Tags only) — Platform Distribution
# ============================================================
#
# ============================================================
# Direct Distribution
# ============================================================
# Core owns the entire distribution chain:
#   - Maven AAR: published by publish:maven (above)
#   - Swift SPM: updated by update:swift-bindings (below)
#   - Consumer triggers: trigger:ios, trigger:macos, trigger:android (below)

# Update vauchi-platform-swift Package.swift + Swift bindings directly.
# Uses CI_PUSH_TOKEN_SWIFT (scoped project access token) for git push —
# CI_JOB_TOKEN pushes don't trigger downstream pipelines in ios/macos.
update:swift-bindings:
  extends: [.linux-runner, .timeout-quick]
  stage: trigger
  interruptible: false
  needs: [package:xcframework, publish:packages]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      VERSION="${CI_COMMIT_TAG}"
      CLEAN_VERSION="${VERSION#v}"
      echo "Updating vauchi-platform-swift to $VERSION"

      # Resolve bot identity so git author matches GitLab account (pre-receive hook)
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN_SWIFT}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')

      # Read checksum from local artifact (no network download needed)
      CHECKSUM=$(cat dist/VauchiPlatformFFI.xcframework.zip.sha256 | tr -d '[:space:]')
      echo "XCFramework checksum: $CHECKSUM"

      # Verify cosign signature on the checksum file
      CHECKSUM_FILE="dist/VauchiPlatformFFI.xcframework.zip.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ ! -f "$BUNDLE_FILE" ]]; then
        echo "ERROR: cosign bundle not found: $BUNDLE_FILE"
        echo "Signing may have been skipped or failed in package:xcframework"
        exit 1
      fi

      if [[ ! -f "$COSIGN_PUB" ]]; then
        echo "ERROR: cosign public key not found: $COSIGN_PUB"
        exit 1
      fi

      echo "Verifying cosign signature..."
      cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
        echo "ERROR: cosign verification FAILED for $VERSION"
        exit 1
      }
      echo "✓ Cosign signature verified"

      # Per-job paths — shared shell runner persists /tmp across jobs, and a
      # foreign-owned leftover dir would fail both `rm -rf` and the write with
      # EACCES. CI_JOB_ID guarantees uniqueness + ownership.
      SWIFT_BINDINGS_DIR="/tmp/swift-bindings-${CI_JOB_ID}"
      PLATFORM_SWIFT_DIR="/tmp/platform-swift-${CI_JOB_ID}"

      # Extract Swift bindings from local artifact
      rm -rf "$SWIFT_BINDINGS_DIR"
      unzip -o -j dist/VauchiPlatform-${CLEAN_VERSION}.zip \
        "VauchiPlatform-${CLEAN_VERSION}/Sources/vauchi_platform.swift" \
        -d "$SWIFT_BINDINGS_DIR/"

      # Clone platform-swift repo
      rm -rf "$PLATFORM_SWIFT_DIR"
      git clone --depth 1 "https://vauchi-gitlab-runner:${CI_PUSH_TOKEN_SWIFT}@gitlab.com/vauchi/vauchi-platform-swift.git" "$PLATFORM_SWIFT_DIR"
      cd "$PLATFORM_SWIFT_DIR"

      # Update Package.swift version + checksum only.
      # The binaryTarget structure is env-var-aware upstream — see
      # vauchi-platform-swift Package.swift's `useLocalXCFramework` block
      # (problem 2026-04-26-vauchi-platform-swift-resolve-hang). Do NOT
      # rewrite the binaryTarget here: the URL form would clobber the
      # `path:` escape hatch that ios/macos CI relies on to bypass
      # SwiftPM's hung URLSession download path.
      sed -i "s/let version = \".*\"/let version = \"$CLEAN_VERSION\"/" Package.swift
      sed -i "s/let checksum = \".*\"/let checksum = \"$CHECKSUM\"/" Package.swift

      # Sanity-check: the env-var-aware binaryTarget must still be present.
      # If a future commit removes it, the next bump-MR pipeline will hang
      # again on the URLSession path — fail loudly here instead.
      if ! grep -q "VAUCHI_PLATFORM_USE_LOCAL_XCFRAMEWORK" Package.swift; then
        echo "ERROR: vauchi-platform-swift Package.swift no longer contains"
        echo "       the VAUCHI_PLATFORM_USE_LOCAL_XCFRAMEWORK env-var switch."
        echo "       This is the documented escape hatch for CI consumers —"
        echo "       see _private/docs/problems/2026-04-26-vauchi-platform-swift-resolve-hang/."
        echo "       Restore the conditional binaryTarget before re-releasing."
        exit 1
      fi
      echo "Package.swift retains env-var-aware binaryTarget (Fix C intact)"

      # Update Swift bindings source
      cp "$SWIFT_BINDINGS_DIR/vauchi_platform.swift" Sources/VauchiPlatform/vauchi_platform.swift

      echo "Updated Package.swift:"
      head -12 Package.swift

      # Commit and push
      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"
      git add Package.swift Sources/VauchiPlatform/vauchi_platform.swift
      if git diff --cached --quiet; then
        echo "No changes — bindings already up to date"
        exit 0
      fi
      git commit -m "chore: Update to $VERSION"
      git tag -f "$VERSION"
      git push origin main --tags --force

      echo "✓ Updated vauchi-platform-swift to $VERSION"

# Assert the release actually produced consumable artifacts.
#
# Job status is a poor proxy for a finished release: on v0.59.1 every job
# that ran reported success, the tag was created, and the Maven AAR and SPM
# package were never published because a later failure cancelled them. This
# checks the outcome instead of the process, so "tag exists, bindings do
# not" fails loudly no matter which job caused it.
#
# `optional: true` + `when: always` are load-bearing: the v0.59.1 publish
# jobs were CANCELLED, and a plain `needs:` on a cancelled job would skip
# this check in exactly the case it exists to catch.
release:verify-published:
  extends: [.linux-runner, .timeout-quick]
  stage: trigger
  interruptible: false
  needs:
    - job: publish:maven
      optional: true
    - job: update:swift-bindings
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"
      FAILED=""

      MAVEN_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/app/vauchi/vauchi-platform/${VERSION}/vauchi-platform-${VERSION}.pom"
      if curl -fsS -o /dev/null "$MAVEN_URL" 2>/dev/null; then
        echo "OK   Maven  app.vauchi:vauchi-platform:${VERSION}"
      else
        echo "MISS Maven  app.vauchi:vauchi-platform:${VERSION}"
        FAILED="${FAILED} maven"
      fi

      SWIFT_TAG_URL="${CI_API_V4_URL}/projects/vauchi%2Fvauchi-platform-swift/repository/tags/${CI_COMMIT_TAG}"
      if curl -fsS -o /dev/null "$SWIFT_TAG_URL" 2>/dev/null; then
        echo "OK   SPM    vauchi-platform-swift ${CI_COMMIT_TAG}"
      else
        echo "MISS SPM    vauchi-platform-swift ${CI_COMMIT_TAG}"
        FAILED="${FAILED} spm"
      fi

      if [ -n "$FAILED" ]; then
        echo ""
        echo "Release ${CI_COMMIT_TAG} is tagged but not consumable:${FAILED}"
        echo "Consumers cannot upgrade. Re-run the packaging and publish jobs."
        exit 1
      fi
      echo ""
      echo "Release ${CI_COMMIT_TAG} is consumable by every binding consumer."

# Update windows/ repo with new CABI DLL version + SHA.
# Mirrors update:swift-bindings pattern.
trigger:windows:
  extends: [.linux-runner, .timeout-quick]
  stage: trigger
  # Notifying a consumer must never abort a release that is still
  # publishing. On v0.59.1 this job pushed its branch, got 403 creating
  # the MR, and cancelled package:xcframework, package:android,
  # publish:maven and update:swift-bindings — so the tag existed with no
  # mobile bindings behind it. The same applies to the ios/macos/android
  # bridges below: a red consumer is a consumer problem, not a reason to
  # withhold artifacts other consumers are waiting on.
  #
  # The 403 itself is a token-scope bug, not a GitLab limit: the MR call
  # below sends CI_PUSH_TOKEN_WINDOWS, which can push the branch but is
  # not permitted to create the merge request. Fix the scope/role on that
  # token — do not reach for a new credential. (Commit 3761e61d claimed
  # CI_JOB_TOKEN was the blocker; that was asserted without testing and
  # is wrong — this path never uses CI_JOB_TOKEN.)
  allow_failure: true
  interruptible: false
  needs: [build:cabi-windows]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      VERSION="${CI_COMMIT_TAG}"
      CLEAN_VERSION="${VERSION#v}"
      echo "Updating windows/ CABI version to $CLEAN_VERSION"

      # Resolve bot identity so git author matches GitLab account (pre-receive hook)
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN_WINDOWS}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')

      # Read checksum from build artifact
      DLL_SHA256=$(cat dist/vauchi_cabi.dll.sha256 | tr -d '[:space:]')
      echo "DLL checksum: $DLL_SHA256"

      # Verify cosign signature before propagating
      CHECKSUM_FILE="dist/vauchi_cabi.dll.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ ! -f "$BUNDLE_FILE" ]]; then
        echo "ERROR: cosign bundle not found: $BUNDLE_FILE"
        exit 1
      fi

      cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
        echo "ERROR: cosign verification FAILED for CABI DLL"
        exit 1
      }
      echo "✓ Cosign signature verified"

      # Clone windows/ and update cabi-version.json
      WINDOWS_REPO="https://project-access-token:${CI_PUSH_TOKEN_WINDOWS}@gitlab.com/vauchi/windows.git"
      git clone --depth 1 "$WINDOWS_REPO" windows-checkout
      cd windows-checkout
      BRANCH="chore/bump-vauchi-cabi-${CLEAN_VERSION}"

      if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
        OPEN_MR_URL=$(curl --fail --silent --show-error \
          --get \
          --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN_WINDOWS}" \
          --data-urlencode "state=opened" \
          --data-urlencode "source_branch=$BRANCH" \
          "${CI_API_V4_URL}/projects/vauchi%2Fwindows/merge_requests" \
          | jq -r '.[0].web_url // empty')
        if [ -n "$OPEN_MR_URL" ]; then
          echo "Branch $BRANCH is already under review: $OPEN_MR_URL"
          exit 0
        fi
        echo "ERROR: branch $BRANCH exists without an open merge request"
        exit 1
      fi
      git checkout -b "$BRANCH"

      cat > cabi-version.json << JSONEOF
      {
        "version": "$CLEAN_VERSION",
        "sha256": "$DLL_SHA256",
        "source_commit": "$CI_COMMIT_SHA"
      }
      JSONEOF

      # Sync cosign.pub if it changed
      if ! diff -q ../cosign.pub cosign.pub >/dev/null 2>&1; then
        cp ../cosign.pub cosign.pub
        echo "✓ cosign.pub updated"
      fi

      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"
      git add cabi-version.json cosign.pub
      git diff --cached --quiet && { echo "No changes to push"; exit 0; }
      git commit -m "chore: update CABI DLL to $CLEAN_VERSION

      SHA-256: $DLL_SHA256
      Source: $CI_COMMIT_SHA"
      git push -u origin "$BRANCH"

      DESCRIPTION=$(cat <<EOF
      ## Summary

      - Update the signed Vauchi C ABI DLL to $CLEAN_VERSION.
      - Keep the dependency change gated with any required Windows UI migration.

      ## Verification

      - Source commit: $CI_COMMIT_SHA
      - SHA-256: $DLL_SHA256

      This MR is intentionally Draft. Make it ready only after the Windows
      application and tests are compatible with this C ABI version.
      EOF
      )
      MR_RESPONSE=$(curl --fail --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN_WINDOWS}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n \
          --arg source_branch "$BRANCH" \
          --arg description "$DESCRIPTION" \
          --arg title "Draft: chore: update CABI DLL to ${CLEAN_VERSION}" \
          '{
            source_branch: $source_branch,
            target_branch: "main",
            title: $title,
            description: $description,
            remove_source_branch: true
          }')" \
        "${CI_API_V4_URL}/projects/vauchi%2Fwindows/merge_requests")
      MR_URL=$(printf '%s' "$MR_RESPONSE" | jq -r '.web_url')
      echo "✓ Opened Draft Windows CABI update: $MR_URL"

# Trigger consumer apps directly (no intermediary repos)
# Note: bridge jobs (trigger:) do not support timeout: — downstream jobs
# have their own timeouts via .timeout-standard/.timeout-extended.
trigger:ios:
  stage: trigger
  # See trigger:windows — consumer notification never gates the release.
  allow_failure: true
  needs: [update:swift-bindings]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/ios
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

trigger:macos:
  stage: trigger
  # See trigger:windows — consumer notification never gates the release.
  allow_failure: true
  needs: [update:swift-bindings]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/macos
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

trigger:android:
  stage: trigger
  # See trigger:windows — consumer notification never gates the release.
  allow_failure: true
  needs: [publish:maven]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/android
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Downstream Verification (main branch only)
# ============================================================
# When core merges to main, verify that Rust consumer repos (cli,
# tui, e2e, relay, linux-gtk) still build and pass tests. This catches
# API breaks early — before a release is even considered.
#
# Uses GitLab's trigger: keyword which creates linked child pipelines
# visible in the pipeline graph. CI_JOB_TOKEN is used implicitly —
# downstream projects must add vauchi/core to their CI_JOB_TOKEN allowlist.

verify:downstream-rust:
  stage: trigger
  extends: .trigger-parallel
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/cli, vauchi/tui, vauchi/e2e, vauchi/relay, vauchi/linux-gtk]
  # Do NOT leak core's pipeline variables into the child pipelines. Each
  # downstream repo must resolve its OWN pinned VAUCHI_SCRIPTS_REF (and its
  # own CARGO_HOME / runner config). Forwarding core's VAUCHI_SCRIPTS_REF made
  # verified-fetch download a humble_check.py that mismatched the downstream's
  # pinned checksum (cli lint:humble), and leaked an unwritable CARGO_HOME into
  # cargo-vet on read-only runners (relay security:vet). Downstream verifies
  # core's new code via the `branch = "main"` git dependency, so no core
  # variable needs forwarding.
  trigger:
    project: $DOWNSTREAM
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    # Skip on the scheduled (nightly) pipeline — this fans out to 5 downstream
    # repos; changes: evaluates true on schedules so it rode along, triggering
    # pointless downstream verify pipelines. Downstream verify belongs to main
    # merges (source=push), not the mutation/fuzz nightly.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

# verify:downstream-dev removed — verify:downstream-rust on main already
# triggers the same 5 repos against the same code. Running again from the
# dev tag was pure redundancy (~20 min wasted per merge).

# When core gets an RC tag, trigger downstream to verify compatibility
verify:downstream-rc:
  extends: .trigger-parallel-prerelease
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/cli, vauchi/tui, vauchi/e2e, vauchi/relay, vauchi/linux-gtk]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Manual Dev Build (on-demand)
# ============================================================

build:dev:
  extends: .linux-runner
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    DEV_VERSION: "dev-${CI_COMMIT_SHORT_SHA}"
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
    - ./scripts/package-android.sh "$DEV_VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 3 days

# ============================================================
# Reproducible Build Verification (G3)
# ============================================================
# Builds the CLI binary twice from the same source and verifies
# bit-identical output. Runs on tag pipelines (releases) and
# manually on MR pipelines. Failure = non-determinism in the
# build toolchain that needs investigation.

verify:reproducible:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: test
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    CARGO_INCREMENTAL: "0"
  script:
    - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
    - echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
    - echo "Rust toolchain:"
    - rustc --version --verbose

    # Per-job /tmp paths — shared shell runner persists /tmp across jobs,
    # so fixed names risk EACCES on writes when a prior run (or a different
    # user) left the file behind. CI_JOB_ID guarantees uniqueness + ownership.

    # Build 1
    - echo "=== Build 1 ==="
    - cargo build --release -p vauchi-core --lib
    - cp target/release/libvauchi_core.rlib "/tmp/build1-${CI_JOB_ID}.rlib" 2>/dev/null || true
    - cp target/release/libvauchi_core.a "/tmp/build1-${CI_JOB_ID}.a" 2>/dev/null || true
    - sha256sum target/release/libvauchi_core.* 2>/dev/null | tee "/tmp/build1-${CI_JOB_ID}-checksums.txt"

    # Clean and rebuild
    - cargo clean
    - echo "=== Build 2 ==="
    - cargo build --release -p vauchi-core --lib
    - sha256sum target/release/libvauchi_core.* 2>/dev/null | tee "/tmp/build2-${CI_JOB_ID}-checksums.txt"

    # Compare
    - echo "=== Comparison ==="
    - |
      if diff "/tmp/build1-${CI_JOB_ID}-checksums.txt" "/tmp/build2-${CI_JOB_ID}-checksums.txt"; then
        echo "✓ Reproducible: both builds produced identical output"
      else
        echo "✗ NOT reproducible: builds differ"
        echo "Build 1:" && cat "/tmp/build1-${CI_JOB_ID}-checksums.txt"
        echo "Build 2:" && cat "/tmp/build2-${CI_JOB_ID}-checksums.txt"
        exit 1
      fi
  artifacts:
    paths:
      - /tmp/build1-${CI_JOB_ID}-checksums.txt
      - /tmp/build2-${CI_JOB_ID}-checksums.txt
    when: always
    expire_in: 30 days

# ============================================================
# Cleanup Stage (scheduled or manual)
# ============================================================
# Runs periodically to clean up runner disk space

cleanup:runner:
  extends: .cleanup-runner
  # Run on scheduled pipeline when CLEANUP_ENABLED is set.
  # On non-scheduled pipelines: never create (manual .post jobs cause
  # pipeline status to show "failed" even with allow_failure: true —
  # see problem record 2026-03-16-pipeline-reliability).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_ENABLED == "true"
    - when: never
