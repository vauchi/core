# ============================================================
# Security Stage (MR only, gated by lint, parallel with test)
# ============================================================

# Rust-specific security audit (runs on dependency changes)
security:audit:
  extends: [.linux-runner-readonly, .validation-deps, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || cargo install cargo-audit || true
    - cargo audit

# Full cargo-deny check: advisories, licenses, bans, sources (runs on all MRs)
security:deny:
  extends: [.linux-runner-readonly, .timeout-quick]
  stage: security
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - command -v cargo-deny >/dev/null 2>&1 || cargo binstall cargo-deny --no-confirm 2>/dev/null || cargo install cargo-deny || true
    - cargo deny check

# ============================================================
# Build Stage - Tags (release builds)
# ============================================================

# Verify tag is on main branch before proceeding with release
# Overrides .self-hosted SSH clone — tag pipelines need HTTPS checkout
# since the runner may not have gitlab.com in known_hosts
release:verify:
  extends: [.linux-runner, .release-only]
  stage: build
  needs: []
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "100"
  before_script: []
  script:
    - |
      echo "Verifying tag $CI_COMMIT_TAG is on main branch..."
      git fetch origin main --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "✓ Tag $CI_COMMIT_TAG is on main branch"
      else
        echo "✗ ERROR: Tag $CI_COMMIT_TAG is NOT on main branch!"
        echo "  Tags must only be created on commits that are on main."
        exit 1
      fi

build:ios:
  extends: [.macos-runner, .release-only, .timeout-extended]
  stage: build
  needs: [release:verify]
  script:
    - ./scripts/build-bindings.sh --ios
  artifacts:
    paths:
      - target/bindings/ios/
    expire_in: 1 day

build:android:
  extends: [.linux-runner, .release-only, .timeout-long]
  stage: build
  needs: [release:verify]
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
  artifacts:
    paths:
      - target/bindings/android/
    expire_in: 1 day

# Validate generated bindings have all expected types
build:validate-bindings:
  extends: [.linux-runner, .release-only]
  stage: build
  needs:
    - job: build:ios
      artifacts: true
    - job: build:android
      artifacts: true
  script:
    - ./scripts/validate-bindings.sh
  allow_failure: false

# ============================================================
# Package Stage (Tags only)
# ============================================================

package:xcframework:
  extends: [.macos-runner, .release-only]
  stage: package
  needs: [build:ios, build:validate-bindings]
  script:
    - ./scripts/package-xcframework.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/VauchiMobileFFI.xcframework.zip
      - dist/VauchiMobileFFI.xcframework.zip.sha256
      - dist/VauchiMobileFFI.xcframework.zip.sha256.sig
      - dist/VauchiMobile-*.zip
    expire_in: 1 week

package:android:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [build:android, build:validate-bindings]
  script:
    - ./scripts/package-android.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/vauchi-mobile-android-*.zip
      - dist/vauchi-mobile-android-*.zip.sha256
      - dist/vauchi-mobile-android-*.zip.sha256.sig
    expire_in: 1 week

# ============================================================
# Publish Stage (Tags only)
# ============================================================

publish:packages:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [package:xcframework, package:android]
  script:
    - ./scripts/publish-packages.sh "$CI_COMMIT_TAG"

# Publish vauchi-core crate to GitLab package registry
publish:core:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-core $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml

        # Try to create an MR to bump version on main (non-blocking)
        echo "  Attempting to create MR to update version on main..."
        (
          BRANCH_NAME="chore/bump-version-${VERSION}"
          REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
          git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
          git checkout -b "$BRANCH_NAME"
          git add Cargo.toml
          git -c user.name="CI Bot" -c user.email="ci@vauchi.com" \
            commit -m "chore: Bump version to $VERSION"
          git push -u origin "$BRANCH_NAME" && \
          MR_RESP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"source_branch\": \"${BRANCH_NAME}\",
              \"target_branch\": \"main\",
              \"title\": \"chore: Bump version to ${VERSION}\",
              \"description\": \"Auto-generated by release pipeline. Tag ${CI_COMMIT_TAG} was published with version ${VERSION} but Cargo.toml had ${MANIFEST_VERSION}.\",
              \"remove_source_branch\": true
            }" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests") && \
          MR_IID=$(echo "$MR_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('iid',''))" 2>/dev/null || true) && \
          if [ -n "$MR_IID" ]; then
            echo "  ✓ MR created to bump version on main"
            # Enable auto-merge
            curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --request PUT \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge?merge_when_pipeline_succeeds=true" > /dev/null 2>&1 && \
            echo "  ✓ Auto-merge enabled" || echo "  ⚠ Could not enable auto-merge"
          fi
        ) || echo "  ⚠ Could not create MR (CI_JOB_TOKEN may lack write access). Please bump Cargo.toml manually."

        # Restore working tree for cargo package (subshell changed branch)
        git checkout -f "${CI_COMMIT_SHA}" 2>/dev/null || true
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Package the crate
      cargo package -p vauchi-core --allow-dirty

      # Upload to GitLab generic packages registry
      CRATE_FILE="target/package/vauchi-core-${VERSION}.crate"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${VERSION}/vauchi-core-${VERSION}.crate"

      echo "✓ Published vauchi-core $VERSION"

# Publish vauchi-mobile crate to GitLab package registry
publish:mobile:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-mobile $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package requires vauchi-core on crates.io)
      # Use temp directory to get correct archive structure
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-mobile-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-mobile/Cargo.toml "$PKG_DIR/"
      # Replace workspace version reference with actual version for standalone crate
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      cp vauchi-mobile/uniffi-bindgen.rs "$PKG_DIR/"
      cp vauchi-mobile/README.md "$PKG_DIR/"
      cp -r vauchi-mobile/src "$PKG_DIR/"
      cp -r vauchi-mobile/benches "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-mobile-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-mobile-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${VERSION}/vauchi-mobile-${VERSION}.crate"

      echo "✓ Published vauchi-mobile $VERSION"

release:create:
  extends: .release-only
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  interruptible: false
  needs: [publish:packages, publish:core, publish:mobile]
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Vauchi $CI_COMMIT_TAG

      ### Rust Crates

      - [vauchi-core](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.crate)
      - [vauchi-mobile](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/vauchi-mobile-${CI_COMMIT_TAG#v}.crate)

      ### Mobile Bindings

      - [iOS XCFramework](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/VauchiMobileFFI.xcframework.zip)
      - [Android](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-mobile/${CI_COMMIT_TAG#v}/vauchi-mobile-android-${CI_COMMIT_TAG#v}.zip)

      ### Integration

      See [documentation](https://gitlab.com/vauchi/core/-/blob/main/README.md) for integration instructions.

# ============================================================
# Trigger Stage (Tags only) — Mobile Distribution
# ============================================================
# Trigger vauchi-mobile-swift and vauchi-mobile-android to rebuild
# and publish bindings for this release version.
#
# Uses GitLab's native trigger: keyword instead of the Pipeline API
# because CI_JOB_TOKEN lacks the 'api' scope needed for POST /pipeline.
# The trigger: keyword uses CI_JOB_TOKEN implicitly — downstream projects
# must add vauchi/core to their CI_JOB_TOKEN allowlist.
#
# UPSTREAM_VERSION is passed as a variable so downstream repos know which
# core tag to build bindings from.

trigger:swift:
  stage: trigger
  needs: [release:create]
  interruptible: false
  allow_failure: true
  variables:
    UPSTREAM_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/vauchi-mobile-swift
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

trigger:android:
  stage: trigger
  needs: [release:create]
  interruptible: false
  allow_failure: true
  variables:
    UPSTREAM_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/vauchi-mobile-android
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ============================================================
# Downstream Verification (main branch only)
# ============================================================
# When core merges to main, verify that Rust consumer repos (desktop, cli,
# tui) still build and pass tests against the updated core. This catches
# API breaks early — before a release is even considered.
#
# Uses GitLab's trigger: keyword which creates linked child pipelines
# visible in the pipeline graph. CI_JOB_TOKEN is used implicitly —
# downstream projects must add vauchi/core to their CI_JOB_TOKEN allowlist.

verify:downstream-rust:
  stage: trigger
  extends: .trigger-parallel
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/desktop, vauchi/cli, vauchi/tui]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Manual Dev Build (on-demand)
# ============================================================

build:dev:
  extends: .linux-runner
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    DEV_VERSION: "dev-${CI_COMMIT_SHORT_SHA}"
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
    - ./scripts/package-android.sh "$DEV_VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 3 days

# ============================================================
# Cleanup Stage (scheduled or manual)
# ============================================================
# Runs periodically to clean up runner disk space

cleanup:runner:
  extends: .cleanup-runner
  # Run weekly via scheduled pipeline or manually
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
