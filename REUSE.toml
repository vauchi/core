version = 1
SPDX-PackageName = "vauchi-core"
SPDX-PackageSupplier = "Mattia Egloff <mattia.egloff@pm.me>"

# License files
[[annotations]]
path = ["LICENSES/**"]
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Lock files
[[annotations]]
path = ["**/Cargo.lock", "**/*.lock"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Fuzzer seed corpus files are raw parser inputs and cannot carry comments.
[[annotations]]
path = ["vauchi-core/fuzz/corpus/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Git and editor config files
[[annotations]]
path = [".gitignore", "**/.gitignore", ".DS_Store", "**/.gitkeep", ".dockerignore"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JSON data files (can't have comments)
[[annotations]]
path = ["**/*.json", "**/.version"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Cargo config
[[annotations]]
path = [".cargo/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Claude Code project instructions
[[annotations]]
path = ["**/CLAUDE.md"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# cargo-vet supply chain files (headers stripped by cargo-vet on regeneration)
[[annotations]]
path = ["supply-chain/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Gradle wrapper (binary + config — third-party, Apache-2.0 licensed)
[[annotations]]
path = ["ci/maven-publish/gradle/wrapper/gradle-wrapper.jar", "ci/maven-publish/gradle/wrapper/gradle-wrapper.properties", "ci/maven-publish/gradlew.bat"]
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

# Vendored fork of rqrr 0.10.1 (third-party; see [patch.crates-io] in
# Cargo.toml). Byte-identical to upstream except one patched function in
# src/geometry.rs. Covers src/, Cargo.toml, README, LICENSE-* and
# test_data/ — none carry per-file SPDX, so declare upstream's license
# expression here rather than editing the vendored files.
[[annotations]]
path = ["vendor/rqrr/**"]
SPDX-FileCopyrightText = "WanzenBug <moritz@wanzenbug.xyz>"
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND ISC"
