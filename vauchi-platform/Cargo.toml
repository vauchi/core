[package]
name = "vauchi-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform bindings for Vauchi - UniFFI wrapper for Android/iOS/macOS/Desktop"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "vauchi_platform"

[features]
default = ["async-sync", "content-updates"]
# Async sync — runs sync in background thread via tokio::spawn_blocking
async-sync = ["tokio"]
# Enable remote content updates (networks, locales, themes).
# Default-on so mobile bindings expose check_content_updates() / apply_content_updates()
# instead of silently returning Disabled. Gate 2 of frontend architecture audit (2026-03-18).
content-updates = ["vauchi-app/content-updates", "tokio"]
# Diagnostic QR preprocessing pipeline (imageproc, fast_image_resize, CLAHE,
# adaptive threshold, unsharp mask). Gates the `diagnostic_scan_qr_with_config`
# UniFFI export. NOT in defaults — production mobile scanner uses rxing/rqrr
# directly via `diagnostic_scan_qr` (always available).
diagnostic-scanner = ["vauchi-core/diagnostic-scanner"]
# YOLO-based QR detector (adds ort ONNX runtime)
diagnostic-yolo = ["diagnostic-scanner", "vauchi-core/diagnostic-yolo"]
# Weakens Argon2id KDF params for fast test execution (forwards to
# vauchi-core/test-kdf). Test-only — vauchi-core's compile_error guard
# forbids it in release builds. Required so the Argon2-heavy duress/auth
# platform tests don't hit nextest's 180s slow-timeout; mirrors test:core.
test-kdf = ["vauchi-core/test-kdf"]
# Dev/debug-only native log backend (Android Logcat / iOS+macOS os_log).
# OFF in release: a shipped binary registers no backend, so the existing
# vauchi-app `log::` call sites are silent no-ops (the `log` facade
# discards records when no logger is installed). Frontends enable this
# only in their debug build config. See logging.rs and logging-rules.md.
dev-logging = ["dep:android_logger", "dep:oslog"]

[dependencies]
# Core Vauchi library (with rustls for Android/iOS - no OpenSSL dependency)
# Note: version required for `cargo package` (path used for local dev, version for published crate)
vauchi-core = { workspace = true, default-features = false, features = ["network-rustls", "network-http"] }
vauchi-app = { workspace = true, default-features = false, features = ["network-rustls", "network-http"] }

# Async runtime for content updates and async sync (optional)
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "time"], optional = true }

# UniFFI for cross-language bindings (tokio feature enables async export support)
uniffi = { version = "0.31", features = ["cli", "tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Base64 encoding for backups
base64 = "0.22"

# Hex encoding for public IDs
hex = "0.4"

# Log facade — call sites live in vauchi-app (BLE/exchange/sync failure
# paths); this crate only wires the platform backend (see logging.rs).
log = "0.4"

# CRC32 checksums for multipart QR codec
crc32fast = "1.4"

# QR code generation (replaces ZXing on Android, used for all platforms)
qrcode = { version = "0.14", default-features = false }

# Native log backends for the mobile/desktop bridge (logging.rs).
# Excluded from Linux/Windows targets by [target.'cfg(...)'], and gated
# behind the `dev-logging` feature (off in release) — see [features].
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.14", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.4"

[[bench]]
name = "ffi_benchmarks"
harness = false
