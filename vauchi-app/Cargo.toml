[package]
name = "vauchi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "App-layer modules for Vauchi — themes, UI, content, i18n, help"

[dependencies]
vauchi-core = { workspace = true, default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Tracing spans for profiling. Same PII rules as vauchi-core (skip_all,
# only non-sensitive metadata).
tracing = "0.1"

# Crypto deps used by content/integrity.rs for manifest verification
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# Base64 encoding — used by orchestrator::device_link_relay for the
# request/response payloads that flow through the relay's V2 exchange API.
base64 = "0.22"

# JSON Schema generation (optional, behind schema-gen feature)
schemars = { version = "0.8", optional = true }

# Remote content (optional). ureq matches vauchi-core's sync HTTP stack;
# the async content-updates surface uses spawn_blocking.
ureq = { version = "3", default-features = false, features = ["json", "rustls-no-provider", "rustls-webpki-roots", "gzip"], optional = true }
tokio = { version = "1.0", features = ["rt"], optional = true }

[features]
default = ["storage", "network-rustls", "content-updates"]
storage = ["vauchi-core/storage"]
content-updates = ["ureq", "tokio"]
network-rustls = ["vauchi-core/network-rustls", "storage"]
network-http = ["vauchi-core/network-http"]
network = ["network-rustls", "network-http", "storage"]
# Compat alias — removed in WS/Noise cleanup, downstream repos still reference it
network-native-tls = ["network"]
# JSON Schema generation (dev tooling, forwarded from vauchi-core)
schema-gen = ["schemars", "vauchi-core/schema-gen"]
# Test-support primitives (ScreenModel walkers, reachability harness).
# Downstream crates add this to dev-dependencies to drive Layer 1
# reachability property tests against WorkflowEngine impls.
test-support = []
# Forwards `vauchi-core/testing` so the integration test binary can
# reach `FakeClock` + `DeterministicRng`. Mirrors vauchi-core's
# `it` test target wiring. Enable via `--features testing` (or via
# the workspace `just check` recipe which forwards it).
testing = ["vauchi-core/testing"]
# Weakens Argon2id KDF params for fast test execution (forwards to
# vauchi-core/test-kdf). Test-only — release builds are blocked by
# vauchi-core's compile_error guard. Keeps the password-import wiring
# tests well under nextest's slow-timeout; mirrors test:core.
test-kdf = ["vauchi-core/test-kdf"]

[package.metadata.cargo-machete]
ignored = ["tokio"]  # Optional dep behind content-updates feature

[[test]]
name = "reachability"
path = "tests/reachability/main.rs"
# Runs via `just reachability` — requires test-support to access
# `ui::testing`. Plan Task 1.4.
required-features = ["test-support"]

[dev-dependencies]
tempfile = "3.0"
proptest = "1.4"

# ADR-055: inherit the workspace lint policy.
[lints]
workspace = true
