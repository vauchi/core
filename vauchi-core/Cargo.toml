[package]
name = "vauchi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Vauchi - privacy-focused contact card exchange"

[features]
default = ["network"]
network = ["network-native-tls"]
network-native-tls = ["tungstenite", "tungstenite/handshake", "tungstenite/native-tls", "native-tls", "snow"]
network-rustls = ["tungstenite", "tungstenite/handshake", "tungstenite/rustls-tls-native-roots", "rustls", "webpki-roots", "snow"]
secure-storage = ["keyring"]
# Real audio proximity verification using CPAL (desktop only)
audio-cpal = ["cpal"]
# Enable this feature to expose internal modules for integration tests
testing = []
# Tor anonymity layer (embedded arti client)
tor = ["arti-client", "tor-rtcompat", "tokio-util"]
# Remote content updates (requires HTTP client)
content-updates = ["reqwest", "tokio"]

[dependencies]
# Cryptography (audited library)
ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

# XChaCha20-Poly1305 (spec-mandated cipher, documented exception to ring-only rule)
chacha20poly1305 = "0.10"

# Argon2id password KDF (spec-mandated, documented exception to ring-only rule)
argon2 = "0.5"

# Async trait support for async sync pipeline
async-trait = "0.1"

# Compression for delta payloads
flate2 = "1.0"

# QR code generation
qrcode = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9"
postcard = { version = "1.1", features = ["alloc"] }

# Error handling
thiserror = "2.0"

# Random number generation
rand = "0.8"

# Base64 encoding for keys/backups
base64 = "0.22"

# Hex encoding for fingerprints
hex = "0.4"

# Constant-time comparison for cryptographic operations
subtle = "2.6"

# Zeroize sensitive data in memory
zeroize = { version = "1.8", features = ["derive"] }

# Password strength estimation
zxcvbn = "3"

# Database storage
rusqlite = { version = "0.32", features = ["bundled"] }

# UUID generation for IDs
uuid = { version = "1.0", features = ["v4"] }

# Noise protocol for inner transport encryption (defense-in-depth inside TLS)
snow = { version = "0.9", optional = true }

# WebSocket transport (optional, not needed for mobile)
tungstenite = { version = "0.24", default-features = false, optional = true }
native-tls = { version = "0.2", optional = true }

# TLS for rustls feature (pure Rust with ring backend - works on Android/iOS)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

# Platform keychain access (optional, for desktop apps)
keyring = { version = "3", optional = true }

# Cross-platform audio for ultrasonic proximity verification (desktop only)
cpal = { version = "0.15", optional = true }

# HTTP client for remote content updates (optional)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"], optional = true }

# Async runtime for content fetching
tokio = { version = "1.0", features = ["rt"], optional = true }

# Embedded Tor client (optional, behind tor feature)
arti-client = { version = "0.27", optional = true, default-features = false, features = ["tokio", "native-tls"] }
tor-rtcompat = { version = "0.27", optional = true, features = ["tokio", "native-tls"] }
tokio-util = { version = "0.7", optional = true, features = ["io-util"] }

[dev-dependencies]
# Temporary directories for storage tests
tempfile = "3.0"
# Async runtime for async sync tests
tokio = { version = "1.0", features = ["rt", "macros"] }
# Property-based testing
proptest = "1.4"
# Benchmarking
criterion = "0.5"

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "performance_regression"
harness = false

[[test]]
name = "content"
path = "tests/content/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[[test]]
name = "integration"
