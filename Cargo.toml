[workspace]
resolver = "3"
members = [
    "vauchi-app",
    "vauchi-cabi",
    "vauchi-core",
    "vauchi-core-testkit",
    "vauchi-platform",
    "vauchi-protocol",
]

[workspace.package]
version = "0.104.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/core"
authors = ["Vauchi Contributors"]

[workspace.dependencies]
vauchi-core = { path = "vauchi-core", version = "0.104.0", default-features = false }
vauchi-app = { path = "vauchi-app", version = "0.104.0", default-features = false }
vauchi-protocol = { path = "vauchi-protocol", version = "0.104.0" }
vauchi-core-testkit = { path = "vauchi-core-testkit" }
# The shell contract (ADR-078): the Command/Event types, their schema and the
# fixture corpus; a git tag with a declared range, since there is no registry.
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.98.0", version = "^0.98" }

# rqrr 0.11.0 with the clamped Perspective::map (vauchi/utils/rqrr): upstream
# aborts on a near-degenerate QR perspective, uncatchable under
# panic = "abort". The version stays 0.11.0 so this redirects the
# `rqrr = "0.11"` dependency in vauchi-core; tests/it/rqrr_fork_tests.rs
# fails the moment it resolves from anywhere else. Record:
# _private/docs/problems/done/2026-05-25-rqrr-perspective-panic-crashes-qr-scan
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }

# Release profile: optimized for size (mobile binaries)
[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile)
panic = "abort"      # Smaller binary, no unwinding
strip = true         # Strip debug symbols from release binaries
overflow-checks = true  # Panic on integer overflow (security: prevent silent wrapping)

# Development profile: fast compilation, good debugging
[profile.dev]
opt-level = 0        # No optimization
debug = "line-tables-only"  # Backtraces work, 2-30% faster builds (use CARGO_PROFILE_DEV_DEBUG=2 for full debuginfo)
strip = false
split-debuginfo = "unpacked"  # Reduce linker work (skip debuginfo bundling)

# Optimize dependencies (crypto crates: ed25519/x25519, chacha20poly1305,
# argon2, sha2, ratchet) even in dev/test. Unoptimized crypto codegen makes the
# it-suite and crypto tests several times slower. Security-neutral: identical
# primitives and rounds, only machine-code optimization; our crates stay
# opt-level=0 for fast incremental rebuilds (deps are compiled once and cached).
[profile.dev.package."*"]
opt-level = 3

# Release with debug info (for profiling)
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# CI profile: faster builds with reasonable optimization
[profile.ci]
inherits = "release"
lto = "thin"          # Faster than full LTO, still good optimization
codegen-units = 16    # More parallelism during compilation
incremental = false   # CI builds are fresh, no benefit from incremental

# Test profile: backtraces work, but skip full debug info and split .dwo files.
# Reduces test binary size ~60% and eliminates 278K .dwo files (~7.5 GB).
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

# Mutation testing profile: fast incremental builds, no debug info needed
[profile.mutants]
inherits = "test"
debug = "none"        # Skip debug symbols — mutants only need pass/fail

# Shared lint policy (ADR-055). Members opt in with `[lints] workspace = true`.
# Phase 1: deny dev artifacts that must never ship. Higher-value restriction
# lints (unwrap_used, indexing_slicing, arithmetic_side_effects) are Phase 2 —
# they flag existing code and need per-site triage, so they land lint-by-lint.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
