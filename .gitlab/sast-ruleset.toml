# Custom Semgrep SAST configuration
# Security rules only — quality rules (CC-03, CC-06) excluded from dashboard.
# Quality rules for local use: semgrep --config scripts/semgrep-rules/vauchi-quality.yml .

[semgrep]
  description = "Semgrep with Rust community + vauchi security rules"

  # Disable generic unsafe-usage rule (Info severity, flags every `unsafe` block).
  # vauchi-cabi is a C ABI FFI crate where `unsafe` is structurally required.
  # Actual unsafe soundness is enforced by: no-unsafe policy in vauchi-core (CLAUDE.md),
  # code review, cargo-vet supply chain audits, and cargo-deny.
  [[semgrep.ruleset]]
    disable = true
    [semgrep.ruleset.identifier]
      type = "semgrep_id"
      value = "rust.lang.security.unsafe-usage.unsafe-usage"

  [[semgrep.passthrough]]
    type = "url"
    value = "https://semgrep.dev/c/p/rust"
    target = "semgrep-rust-community.yml"

  [[semgrep.passthrough]]
    type = "url"
    value = "https://gitlab.com/vauchi/scripts/-/raw/main/semgrep-rules/vauchi-security.yml"
    target = "semgrep-vauchi-security.yml"

