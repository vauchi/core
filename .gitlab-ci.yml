# GitLab CI for vauchi-core
#
# Pipeline strategy (PI-13 fail-fast DAG):
#   - MR: Validation with DAG ordering — cheap checks gate expensive ones
#   - Tags (v*): Build, package, publish releases
#
# DAG execution order (MR pipelines):
#   lint (< 2 min, includes vet+deny) ── test (< 15 min)
#
# Nightly/release pipelines also run bench:save-baseline + bench:compare + perf:binary-size.
#
#   cargo-vet and cargo-deny start immediately (needs:[]) alongside lint.
#   Lint must pass before tests run.
#
# Uses shared templates from vauchi/scripts for consistency.
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#     - Rust lint/test: *.rs, Cargo.toml, Cargo.lock
#     - REUSE lint: LICENSES/, REUSE.toml, LICENSE*
#     - Security audit: Cargo.toml, Cargo.lock (dependencies)
#     - License check: Cargo.*, deny.toml
#   - Test and coverage combined in single pass
#   - DAG execution: needs: with optional:true for cross-rule compatibility
#   - Parallel build jobs (iOS + Android)
#   - Parallel test jobs (core + platform)
#   - Parallel publish jobs (core + platform)
#   - CARGO_INCREMENTAL=0 to reduce target/ size and cache overhead
#   - No-cache/read-only cache for lint/security jobs (skip expensive upload)
#   - mold linker on Linux (2-5x faster linking)
#   - Cargo.lock-based cache keys (smarter invalidation)

# Include shared templates
include:
  - project: 'vauchi/scripts'
    # Pin the commit: ci-templates tags are protected and cut by the
    # maintainer; a SHA needs none (private#994).
    ref: 9adf5b8e9cd596075e3e5a34dc25971674c13628
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/allow-direct-guard.yml'
      - '/ci-templates/vendor-locales-sync.yml'
      - '/ci-templates/content-fetch.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/typos.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/cross-cutting-lint.yml'
  # Local include — nightly-only mutation + fuzz + slow tests extracted
  # 2026-04-22 under T2.3 split (2026-04-22-ci-pipeline-health-audit
  # Phase 2). Pure Phase 0 tidy — no behaviour change.
  - local: ci/mutation-and-fuzz.yml
  # Local include — auto-tag + dev-tag + rc-tag pipelines (tag-triggered
  # jobs only, not consumed on MR or main-branch pipelines). Extracted
  # 2026-04-22 as T2.3 Phase 0 Part 2.
  - local: ci/auto-tag-and-dev-rc.yml
  # Local include — release-or-rc build stage (tag pipelines only):
  # release:verify, build:apple, build:android, build:validate-bindings,
  # check:binding-abi-android, check:binding-abi-ios. Extracted 2026-04-22
  # as T2.3 Phase 0 Part 3.
  - local: ci/build.yml
  # Local include — release-or-rc package stage (tag pipelines only):
  # package:xcframework, package:android, build:cabi-windows, package:sbom,
  # package:slsa-provenance. Extracted 2026-04-22 as T2.3 Phase 0 Part 4.
  - local: ci/package.yml
  # Local include — release-or-rc publish + trigger stages (tag pipelines
  # only): publish:*, update:swift-bindings, trigger:*, prerelease:cleanup.
  # Extracted 2026-04-22 as T2.3 Phase 0 Part 5 — main file now under
  # 700 lines.
  - local: ci/publish-and-trigger.yml
  # Local include — main-branch prebuild: cache Apple+Android bindings
  # so tag pipelines skip ~45 min (Apple) + ~35 min (Android) of rebuild.
  # Extracted 2026-04-22 as T2.3 Phase 0 Part 6.
  - local: ci/prebuild.yml
  - local: ci/internal-dev-bindings.yml
  - local: ci/journey-fixtures.yml
  - local: ci/migration-safety.yml

# rust-base.yml cancels every job once one fails (on_job_failure: all).
# Neither interruptible: false (core!2251) nor a child pipeline (core!2252)
# exempts a job, so a pipeline that runs test:formal-models turns
# fail-fast off: a merge request changing the models, the nightly and
# release tags (vauchi/private#1115). A rules list replaces the
# template's, so the other rules repeat rust-base.yml's at the pinned ref;
# check:ci-self-tests (formal-triggers) holds the first rule's paths to the job's.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/verification/**/*
          - vauchi-app/verification/**/*
          - ci/formal-verification.sh
      auto_cancel:
        on_job_failure: none
    # #1178: a native failure must not cancel the other platform's evidence.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - ci/migration-safety.yml
          - ci/*migration*.ps1
          - ci/tests/native-migration-runner.tests.ps1
          - vauchi-core/src/storage/**
          - vauchi-core/src/api/shred/**
          - vauchi-core/src/api/config.rs
          - vauchi-core/src/api/storage_reset.rs
          - vauchi-core/src/api/vauchi/emergency.rs
          - vauchi-core/tests/migration_snapshot_safety.rs
          - vauchi-core/tests/migration_commit_durability.rs
          - vauchi-core/tests/shred_profile_scope.rs
          - vauchi-core/tests/profile_directory_authority.rs
          - Cargo.lock
          - vauchi-core/Cargo.toml
      auto_cancel:
        on_job_failure: none
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # main's merge guard (VCI05) stays: a merge must not cancel the
    # pipeline that ends in the release tag.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
        on_job_failure: none
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      auto_cancel:
        on_job_failure: none
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# Temporary containment for the allyson compiler stall (vauchi/private#198).
# A tiny compile probe passed while real dependency compilation still hung.
.self-hosted:
  variables:
    RUSTC_WRAPPER: ""

variables:
  # MUST match the include: ref above. The templates come from that ref and
  # the scripts this variable fetches at job runtime come from this one; two
  # different commits would mix template and script versions silently.
  # Bumped 2026-11-02 to d17972a: .macos-runner targets nell's shell runner
  # by macos-host, the only macOS tag it still carries (vauchi/private#309).
  # Previously c695eab, a bump this history did not record; before that:
  # Bumped 2026-10-16 to 1e039df for the bounded compiler cache probe,
  # job-local uncached fallback, and non-circular benchmark helper (#198).
  # Previously 2026-10-08 to 16dbb7b so quality:metrics-dashboard and the
  # other scripts checkouts fetch this SHA instead of `clone --branch`,
  # which rejects one (vauchi/private#556, vauchi/scripts!612); before
  # that, 2026-10-06 to 727e404 (= ci-templates-v2026.10.08): the push
  # helper is pushgateway-push.sh, HTTPS only, no ssh fallback
  # (vauchi/private#470, vauchi/scripts!607); before that,
  # 2026-10-05 to 096923a (= ci-templates-v2026.10.07) so
  # coverage:workspace fetches common.sh and its metrics reach the
  # Pushgateway (vauchi/private#520, vauchi/scripts!603); before that,
  # 2026-10-05 to 8e307d9 (= ci-templates-v2026.10.06) so a
  # mutation:nightly with nothing missed passes and its summary and metrics
  # read mutants.out (vauchi/private#511, vauchi/scripts!602); before that,
  # 2026-10-03 to 93ed835 (= ci-templates-v2026.10.05) so
  # mutation:nightly collects cargo-mutants' own exit status instead of
  # dying at the monitor's `wait` (vauchi/private#487, vauchi/scripts!601);
  # before that, 2026-09-26 to ci-templates-v2026.09.26 for the exact-zero release
  # ratchet (ADR-066, vauchi/private#11); before that, 2026-09-25 so
  # allow-direct:check fails closed when ripgrep is missing or errors,
  # instead of reporting OK unscanned (vauchi/scripts!570); before that,
  # 2026-09-07 for the standing cargo-audit gate (vauchi/scripts!557 — core
  # keeps the SHA form because tags here are not protected), the lint:typos
  # linux tag (vauchi/scripts!552) and retired_boundary_vocabulary
  # (vauchi/scripts!502).
  VAUCHI_SCRIPTS_REF: "9adf5b8e9cd596075e3e5a34dc25971674c13628"
  # cargo audit runs with --deny warnings; every entry here is an
  # advisory with no fix available to us, not one we chose to skip.
  #   RUSTSEC-2026-0192  ttf-parser unmaintained, reached through
  #                      ab_glyph -> owned_ttf_parser. Clears when
  #                      ab_glyph moves off it or we drop the dep.
  #   RUSTSEC-2026-0374  basic-toml unmaintained, build-time only via
  #                      uniffi -> askama; mirrors deny.toml. Clears
  #                      with private#718.
  AUDIT_IGNORES: "--ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0374"

# Ceiling for jobs that compile the full dependency tree. On a fresh or
# reinstalled shell runner ALL warm state is gone at once — per-slot
# target/ dirs (GIT_STRATEGY:none persistence), sccache, and the
# registry-only GitLab cache — so these jobs cold-build the whole tree
# concurrently and CPU contention multiplies solo durations: measured
# 57-60m+ under 3-way contention (pipelines 2699547003 / 2699666347,
# allyson post-reinstall) vs ~25m solo. Warm runs are unaffected; note
# the GitLab cache does NOT carry target/, so recovery comes from slot
# target/ reuse + sccache, not cache uploads. Root-cause record:
# _private backlog 2026-07-23-ci-cold-runner-cache-meltdown. The shared
# template's .timeout-extended is 45m (SHORTER than .timeout-long),
# hence this local tier.
.timeout-cold-rebuild:
  timeout: 2 hours

# Cosign pinned version + checksum (used by update:swift-bindings and publish:maven)
# Single source of truth for cosign binary integrity — update BOTH values together.
.cosign-install:
  script:
    - |
      COSIGN_VERSION="v3.0.5"
      COSIGN_SHA256="db15cc99e6e4837daabab023742aaddc3841ce57f193d11b7c3e06c8003642b2"
      if ! command -v cosign &>/dev/null; then
        echo "Installing cosign ${COSIGN_VERSION}..."
        curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
          -o /usr/local/bin/cosign || { echo "ERROR: cosign install failed"; exit 1; }
        echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c - || {
          echo "ERROR: cosign binary checksum mismatch — possible supply chain compromise"
          rm -f /usr/local/bin/cosign; exit 1
        }
        chmod +x /usr/local/bin/cosign
      fi

stages:
  - lint
  - test
  - security
  - mutation
  - prebuild
  - build
  - internal-dev
  - package
  - publish
  - trigger
  - deploy
  - tag

check:vendor-locales:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache git
  script:
    - sh ci/tests/vendor-locales.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/vendor-locales.sh
        - ci/check-vendored-locales.sh
        - ci/tests/vendor-locales.test.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# CI self-tests that need only alpine's sh, in one job: each was a job of
# its own, and on allyson a docker job spends ~27 s in setup for ~10 s of
# script (vauchi/private#1179). ci/run-ci-self-tests.sh runs every test even
# after one fails and names each failure. formal-triggers is among them: the
# formal jobs run on a merge request only when it changes what they check,
# so a trigger path that misses a harness or a model lets a broken proof
# merge until the nightly (vauchi/private#1032; #950).
check:ci-self-tests:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - sh ci/run-ci-self-tests.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The spec (vauchi/spec) cites Core's test, lemma and function names as the
# proof behind its claims and runs its ci/check-claim-names.sh against Core
# main. Running that check against this checkout tells the MR, not the
# next spec pipeline, that it removes or renames a cited name
# (vauchi/private#874). A rename goes through the spec's pending list: the
# spec cites the new name first, then this merges. The other roots the
# chapters cite (e2e, both relays) come from their mains. The last step
# compares the vectors fixture with the spec's copy and only warns (exit
# 3): a changed fixture needs spec and docs MRs, which follow this one.
# It also runs the spec's annotation check against this checkout: a claim
# must keep a test annotated `@claim: S<n>`, so deleting the last one fails
# here (spec!13).
check:spec-names:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  allow_failure:
    exit_codes: [3]
  script:
    - sh ci/tests/spec-names.test.sh
    - mkdir -p /tmp/roots
    - for r in spec e2e relay ohttp-relay; do wget -qO "/tmp/$r.tar.gz" "https://gitlab.com/vauchi/$r/-/archive/main/$r-main.tar.gz" || exit 1; tar -xzf "/tmp/$r.tar.gz" -C /tmp/roots || exit 1; done
    - sh /tmp/roots/spec-main/ci/check-claim-names.sh --self-test
    # A name the spec lists as pending that exists here is landing, not stale
    # (private#937). On main it is the spec's list to update and no Core change
    # can fix it, so spec's own CI holds that ratchet (private#1113).
    - export CLAIM_NAMES_SOURCES_MAY_LAND=1
    - for f in /tmp/roots/spec-main/src/claims.md /tmp/roots/spec-main/src/protocols/*.md; do sh /tmp/roots/spec-main/ci/check-claim-names.sh "$f" vauchi-app vauchi-cabi vauchi-core vauchi-platform vauchi-protocol /tmp/roots/e2e-main /tmp/roots/relay-main /tmp/roots/ohttp-relay-main || exit 1; done
    - sh /tmp/roots/spec-main/ci/check-claim-annotations.sh --self-test
    - sh /tmp/roots/spec-main/ci/check-claim-annotations.sh /tmp/roots/spec-main/src/claims.md vauchi-app vauchi-cabi vauchi-core vauchi-platform vauchi-protocol /tmp/roots/e2e-main || exit 1
    - 'cmp vauchi-core/tests/fixtures/test-vectors/vauchi-protocol-vectors-v1.json /tmp/roots/spec-main/src/vectors/vauchi-protocol-vectors-v1.json || { echo "WARN: the vectors fixture differs from the copy in the spec. After this merges, open spec (src/vectors/) and docs (src/developers/test-vectors/) MRs with the new file."; exit 3; }'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "vauchi-app/**/*"
        - "vauchi-cabi/**/*"
        - "vauchi-core/**/*"
        - "vauchi-platform/**/*"
        - "vauchi-protocol/**/*"
        - ci/tests/spec-names.test.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Holds the let_underscore_must_use allows at .ignored-results-baseline:
# each one lets a Result be dropped unseen, so a new one fails, and an MR
# that removes some lowers the baseline with them (vauchi/private#747).
check:ignored-results:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - sh ci/tests/ignored-results-ratchet.test.sh
    - sh scripts/check-ignored-results.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "vauchi-*/**/*.rs"
        - .ignored-results-baseline
        - scripts/check-ignored-results.sh
        - ci/tests/ignored-results-ratchet.test.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:consumer-pins-bump:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash git python3
    - |
      SCRIPTS_DIR=$(mktemp -d)
      git -C "$SCRIPTS_DIR" init -q
      git -C "$SCRIPTS_DIR" remote add origin https://gitlab.com/vauchi/scripts.git
      git -C "$SCRIPTS_DIR" fetch --depth=1 origin "${VAUCHI_SCRIPTS_REF}"
      git -C "$SCRIPTS_DIR" checkout -q --detach FETCH_HEAD
      echo "scripts checked out at $(git -C "$SCRIPTS_DIR" rev-parse HEAD)"
      export CORE_PINS="$SCRIPTS_DIR/scripts/core-pins.py"
      # A triggering pipeline that forwards its own older VAUCHI_SCRIPTS_REF
      # checks out scripts without core-pins.py (#465); say so, not rc=141.
      if [ ! -f "$CORE_PINS" ]; then
        echo "scripts ref ${VAUCHI_SCRIPTS_REF} has no scripts/core-pins.py;"
        echo "a triggering pipeline (${CI_PIPELINE_SOURCE}) may have forwarded its own pin"
        exit 1
      fi
  script:
    - test -f "$CORE_PINS" || { echo "core-pins.py gone before the test started"; exit 1; }
    - sh ci/tests/consumer-pins-bump.test.sh || { rc=$?; echo "test failed (rc=$rc); core-pins.py now:"; ls -la "$CORE_PINS" 2>&1; exit "$rc"; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:spec-reverify-issue:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash python3
  script:
    - sh ci/tests/spec-reverify-issue.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/open-spec-reverify-issue.sh
        - ci/tests/spec-reverify-issue.test.sh
        - ci/publish-and-trigger.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# A Core merge owes two follow-ups (private#1010): the spec drops the
# `name core!NNNN` pending claim names whose MR landed, since
# check:claim-names fails them once the name is on main, and features
# flips the scenarios whose annotated test landed from planned to
# implemented. scripts/open-follow-up-mrs.sh opens both MRs; merging stays
# with the maintainer, and each MR pipeline proves the change.
check:follow-up-mrs:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache bash git python3
  script:
    - sh ci/tests/follow-up-mrs.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/open-follow-up-mrs.sh
        - scripts/follow_ups.py
        - ci/tests/follow-up-mrs.test.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

open:follow-ups:
  stage: trigger
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  allow_failure: true
  interruptible: false
  variables:
    # The diff needs both ends of the push; a shallow clone has only one.
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git python3 curl
  script:
    - bash scripts/open-follow-up-mrs.sh "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

check:binding-validation-contract:
  stage: lint
  extends: [.linux-runner-nocache, .timeout-quick]
  needs: []
  script:
    - sh ci/tests/validate-bindings-contract.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Lint Stage — Preflight Gate (MR only, change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

# Informational: warn when merging without a version bump.
# Auto-tag will create a dev tag in that case (see auto-tag:version).
lint:images:
  extends: .image-lint

# Informational: tells the MR author whether the upcoming merge will
# bump the public version (and create a release tag) or fall through
# to an auto-dev-tag. allow_failure: true because there is no "wrong"
# answer — both branches of the script print useful info, and the
# job exists for visibility, not gating. Audited 2026-04-22 T2.5.
lint:version-check:
  extends: [.linux-runner-nocache, .timeout-quick]
  stage: lint
  needs: []
  allow_failure: true
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"

      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo ""
        echo "⚠ No version bump — tag ${TAG} already exists"
        echo "  On merge, auto-tag will create a dev tag (v${VERSION%-*}-dev.N)"
        echo "  To create a release tag, bump the version in Cargo.toml"
      else
        echo "✓ New version ${VERSION} — tag ${TAG} will be created on merge"
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

# Cross-cutting lint ratchet — combines the small alpine+docker lint checks
# that previously ran as separate jobs. Each check runs sequentially in the
# same container; a failure stops the job (fail-fast). Keeps tags: [docker].
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apk add --no-cache bash git python3 ripgrep jq findutils
    - |
      VAUCHI_CI_SCRIPTS_DIR=$(mktemp -d)
      export VAUCHI_CI_SCRIPTS_DIR
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" init
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" remote add origin https://gitlab.com/vauchi/scripts.git
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" fetch --depth=1 origin "${VAUCHI_SCRIPTS_REF}"
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" checkout --detach FETCH_HEAD
    - !reference [.clone-locales, before_script]
  script:
    # lint:generic-presentation-boundary
    - >-
      python3 "${VAUCHI_CI_SCRIPTS_DIR}/scripts/humble_check.py"
      --repo core
      --repo-path "${CI_PROJECT_DIR}"
      --config "${VAUCHI_CI_SCRIPTS_DIR}/scripts/humble_check_rules.json"
      --check "${VAUCHI_CI_SCRIPTS_DIR}/scripts/humble_check.baseline.json"
    # lint:workspace-version-alignment
    - bash "${VAUCHI_CI_SCRIPTS_DIR}/scripts/check-workspace-versions.sh" Cargo.toml
    # lint:locale-key-coverage
    - bash ../locales/scripts/check-locale-key-coverage.sh
        vauchi-app/src ../locales '*.rs'
    # lint:vendored-locales — a commit that cuts a release needs locales HEAD;
    # any other needs the revision its copy names (private#1112).
    - sh ci/check-vendored-locales.sh
    # lint:portable-content-links
    - |
      set -eu
      [ "$(readlink locales)" = "../locales" ] || {
        echo "locales must link to ../locales"
        exit 1
      }
      [ "$(readlink themes)" = "../themes" ] || {
        echo "themes must link to ../themes"
        exit 1
      }
    # lint:adr-constraints (SC-64: the rules a grep decides)
    - bash "${VAUCHI_CI_SCRIPTS_DIR}/scripts/check-adr-constraints.sh" .
    # lint:adr-046
    - bash "${VAUCHI_CI_SCRIPTS_DIR}/scripts/check-aead.sh" .
    # lint:core-purity
    - |
      set -eu
      SCRIPT="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-mobile-surface.sh"
      if [ ! -f "$SCRIPT" ]; then
        echo "audit-mobile-surface.sh is absent from the pinned scripts revision — failing: the gate cannot pass without its check."
        exit 1
      fi
      WS=$(mktemp -d)
      ln -sfn "$CI_PROJECT_DIR" "$WS/core"
      bash "$SCRIPT" --check-core-purity "$WS"
    # lint:crypto-hygiene
    - |
      set -eu
      SCRIPT="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-crypto-hygiene.sh"
      BASELINE="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-crypto-hygiene.baseline.json"
      if [ ! -f "$SCRIPT" ] || [ ! -f "$BASELINE" ]; then
        echo "audit-crypto-hygiene is absent from the pinned scripts revision — failing: the gate cannot pass without its check."
        exit 1
      fi
      WS=$(mktemp -d)
      ln -sfn "$CI_PROJECT_DIR" "$WS/core"
      bash "$SCRIPT" --check "$BASELINE" "$WS"
    # lint:test-hygiene
    - |
      set -eu
      SCRIPT="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-test-hygiene.sh"
      BASELINE="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-test-hygiene.baseline.json"
      if [ ! -f "$SCRIPT" ] || [ ! -f "$BASELINE" ]; then
        echo "audit-test-hygiene is absent from the pinned scripts revision — failing: the gate cannot pass without its check."
        exit 1
      fi
      WS=$(mktemp -d)
      ln -sfn "$CI_PROJECT_DIR" "$WS/core"
      bash "$SCRIPT" --check "$BASELINE" "$WS"
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "Cargo.toml"
          - "**/*.rs"
          - ".gitlab-ci.yml"
          # This job checks the vendored copy, so a change to the copy
          # itself has to trigger it. Without these paths a re-vendor MR
          # skipped the very gate that polices it, and hand-edited drift
          # stayed green until it turned main red.
          - "vauchi-app/locales/**"
          - "ci/check-vendored-locales.sh"
          - "scripts/vendor-locales.sh"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Exact-zero release gate (ADR-066, vauchi/private#11). Unlike
# lint:cross-cutting-blocking above (an MR ratchet — existing debt may
# stay while it shrinks), this runs `--require-zero`: every boundary
# counter, live and stored, must be zero before a release tag ships.
# release:verify needs this job (see ci/build.yml), so a failure here
# blocks every downstream build/package/publish job transitively.
# rules: widened from the template default (stable tags only) to match
# release:verify's `.release-or-rc` so RC tags are gated too — an RC
# that ships boundary debt just becomes the eventual release.
release:ratchet-zero:
  extends: .release-ratchet-zero
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

lint:format:
  extends: [.linux-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

# The MR pipeline's one compile (vauchi/private#1212). The test jobs below
# run the binaries this job archives, so this is the only MR job that
# holds the cold-rebuild-tree lock: one build per pipeline waits for the
# lock instead of a dozen one-to-six-minute warm jobs across every open
# pipeline (core pipeline 3049298754: 39 minutes of shell jobs, 2,021
# minutes of waiting). The checks that need a compiled tree and nothing
# else run here too, with the commands they had as jobs of their own.
build:tests:
  extends: [.linux-runner, .validation-rust, .timeout-cold-rebuild]
  stage: lint
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - echo "── clippy, --all-targets across the full dependency tree ──"
    - cargo clippy --all-targets -- -D warnings
    # CABI header freshness — catch stale headers after export changes (T0-11)
    - echo "── vauchi-cabi header ──"
    - cargo build -p vauchi-cabi
    - git diff --exit-code vauchi-cabi/include/vauchi.h || { echo "CABI header is stale — rebuild with 'cargo build -p vauchi-cabi' and commit the updated include/vauchi.h"; exit 1; }
    # vauchi-app with default features off is the wasm/web-demo configuration —
    # no other build exercises it, so feature-gate drift only surfaces at the
    # next downstream lock bump (web-demo froze 773 commits on exactly this,
    # 2026-06-12-web-demo-core-lock-freeze). Deny warnings so cross-feature
    # dead code is caught here too.
    - echo "── vauchi-app without default features ──"
    - RUSTFLAGS="-D warnings" cargo check -p vauchi-app --no-default-features
    - echo "── vauchi-cabi with secure-storage ──"
    - cargo check --features secure-storage -p vauchi-cabi
    # Release bindings are built in tag pipelines, so a dev-only feature
    # must fail the build there (private#794).
    - echo "── dev-logging refuses a tagged build ──"
    - |
      if CI_COMMIT_TAG=v0.0.0-guard cargo check -p vauchi-cabi --features vauchi-cabi/dev-logging > dev-build-guard.log 2>&1; then
        echo "a tagged build with dev-logging compiled; the dev-build guard is missing"
        exit 1
      fi
      grep "private#794" dev-build-guard.log
    # Guard: no diagnostic_* UniFFI exports in the default-feature binding
    # surface. Diagnostics ship only in --features diagnostic-scanner
    # builds (2026-04-19-diagnostics-out-of-production-plan.md). It builds
    # vauchi-platform and the binding generator on this tree.
    - echo "── no diagnostic exports in the default binding surface ──"
    - bash scripts/check-no-diagnostic-in-default.sh
    # One archive per package and feature set a test job runs; the features
    # are the ones the jobs passed to `cargo nextest run` before, with the
    # reasons kept at those jobs. The archives stay on the runner host
    # (every shell job runs on it): as artifacts the nine files were 413
    # Payload Too Large for gitlab.com (job 17902464819), and a round trip
    # through the coordinator would cost each test job minutes for files
    # it has on local disk. Older pipelines' archives are pruned here.
    - echo "── test archives ──"
    - export ARCHIVE_DIR="$HOME/.cache/vauchi-ci/archives/$CI_PROJECT_NAME/$CI_PIPELINE_ID"
    - find "$HOME/.cache/vauchi-ci/archives" -mindepth 2 -maxdepth 2 -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true
    - rm -rf "$ARCHIVE_DIR" && mkdir -p "$ARCHIVE_DIR"
    - cargo nextest archive -p vauchi-core --features test-kdf,testing --archive-file "$ARCHIVE_DIR/core.tar.zst"
    - cargo nextest archive -p vauchi-core --features testing --archive-file "$ARCHIVE_DIR/core-vectors.tar.zst"
    - cargo nextest archive -p vauchi-app --features test-kdf,network-http,testing --archive-file "$ARCHIVE_DIR/app.tar.zst"
    - cargo nextest archive -p vauchi-app --features vauchi-app/test-support --test reachability --archive-file "$ARCHIVE_DIR/app-reachability.tar.zst"
    - cargo nextest archive -p vauchi-platform --features test-kdf --archive-file "$ARCHIVE_DIR/platform.tar.zst"
    - cargo nextest archive -p vauchi-cabi --features vauchi-cabi/dev-logging --archive-file "$ARCHIVE_DIR/cabi-dev-logging.tar.zst"
    - cargo nextest archive -p vauchi-platform --features vauchi-platform/dev-logging --archive-file "$ARCHIVE_DIR/platform-dev-logging.tar.zst"
    # Cucumber is harness=false, which nextest cannot archive: build the
    # binary and keep it as is.
    - |
      cucumber="$(cargo test --test cucumber_tests --features testing,test-kdf --no-run --message-format=json \
        | python3 -c 'import json, sys
      for line in sys.stdin:
          message = json.loads(line)
          if message.get("reason") == "compiler-artifact" and message.get("executable") and message["target"]["name"] == "cucumber_tests":
              print(message["executable"])')"
      cp "$cucumber" "$ARCHIVE_DIR/cucumber_tests"
    - hostname > "$ARCHIVE_DIR/built-on"
    - ls -la "$ARCHIVE_DIR"

# SemVer compatibility check — catch breaking API changes before they cascade
# to 10+ downstream consumers (cli, tui, e2e, relay, linux-gtk, mobile bindings).
# Advisory while pre-1.0 (no deployed clients, SP-33 allows intentional breaks).
# Flip to allow_failure: false when version reaches 1.0.0.
lint:semver:
  # semver-checks rustdoc-builds BOTH the current and baseline crate graphs,
  # the heaviest cold build here (60m timeout hit in pipeline 2699666347).
  # It runs after build:tests instead of holding the lock: the build has
  # already warmed the tree and sccache by then, so a cold runner cannot
  # herd it against the build, and the MR pipeline holds the lock once.
  extends: [.linux-runner, .validation-rust, .timeout-long]
  stage: lint
  needs:
    - job: build:tests
      artifacts: false
  allow_failure: true
  script:
    # Refresh the binary: shell runners persist a preinstalled
    # cargo-semver-checks forever. 0.48.0 (current on 2026-07-04)
    # resolves the vauchi-protocol workspace path dep for vauchi-core
    # natively — upstream #638 (https://github.com/obi1kenobi/cargo-semver-checks/issues/638)
    # no longer bites — so both crates let semver-checks self-generate
    # current + baseline rustdoc. The old manual `cargo +nightly doc`
    # JSON was rejected by the --current-rustdoc file-loader once the
    # nightly rustdoc format reached v60 (2026-07-02); dropping it removes
    # the format-mismatch failure.
    - cargo binstall cargo-semver-checks --no-confirm --force 2>/dev/null || command -v cargo-semver-checks >/dev/null 2>&1 || cargo install cargo-semver-checks
    # rustdoc JSON is nightly-only; semver-checks invokes nightly itself.
    - rustup toolchain install nightly --profile minimal --component rustdoc 2>/dev/null || true
    - git fetch origin main
    - python3 ci/tests/semver-baseline.test.py
    # #1173: queued merged results must use their own target snapshot.
    - baseline_ref="$(sh ci/semver-baseline.sh)"
    - git fetch origin "$baseline_ref"
    # Not --baseline-rev: since 0.51.0 it extracts the rev as an archive and
    # rejects the repo-root locales/themes symlinks (../locales) as pointing
    # outside the tree. A worktree checks the symlinks out as plain links.
    - BASELINE="$(mktemp -d)/core"
    # Shell runners keep .git across jobs; drop worktrees a failed run left.
    - git worktree prune
    - git worktree add -f --detach "$BASELINE" "$baseline_ref"
    - cargo semver-checks check-release -p vauchi-protocol --baseline-root "$BASELINE"
    - cargo semver-checks check-release -p vauchi-core --baseline-root "$BASELINE"
    - git worktree remove --force "$BASELINE"
    # vauchi-platform: include_bytes! references sibling themes/ repo —
    # skipped until themes are vendored or a similar workaround is applied
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"
          - "rust-toolchain.toml"
          - "ci/semver-baseline.sh"
          - "ci/tests/semver-baseline.test.py"

# Duplicate dependency check (advisory — detects multiple versions of same crate)
lint:duplicates:
  extends: [.linux-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory — detects unused crates via cargo-machete)
lint:machete:
  extends: [.linux-runner-nocache, .lint-machete-job, .timeout-quick]

# Fail closed when the pinned analyzer or its source inputs are missing.
lint:architecture:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1
  tags: [docker]
  needs: []
  allow_failure: false
  variables:
    RUSTC_WRAPPER: "sccache"
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-architecture"
    SCCACHE_DIR: "${CI_PROJECT_DIR}/.cache/sccache/architecture"
    SCCACHE_CACHE_SIZE: "256M"
  cache:
    key: "architecture-sccache-${VAUCHI_SCRIPTS_REF}"
    paths:
      - .cache/sccache/architecture/
      - .cargo-architecture/registry/index/
      - .cargo-architecture/registry/cache/
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends sccache
    - |
      VAUCHI_CI_SCRIPTS_DIR=$(mktemp -d)
      export VAUCHI_CI_SCRIPTS_DIR
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" init
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" remote add origin https://gitlab.com/vauchi/scripts.git
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" fetch --depth=1 origin "${VAUCHI_SCRIPTS_REF}"
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" checkout --detach FETCH_HEAD
      test -f "$VAUCHI_CI_SCRIPTS_DIR/scripts/architecture-check.sh"
      test -f "$VAUCHI_CI_SCRIPTS_DIR/tools/architecture-check/Cargo.lock"
    - git fetch --depth=1 origin +main:refs/remotes/origin/main
  script:
    # Keep the standalone tool's linker settings separate; sccache stays enabled.
    - cd "$VAUCHI_CI_SCRIPTS_DIR"
    - bash "$VAUCHI_CI_SCRIPTS_DIR/scripts/architecture-check.sh" "$CI_PROJECT_DIR" check origin/main
    - sccache --show-stats
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Older aggregate surface metric remains advisory alongside the exact ratchet.
metric:audit-mobile-surface:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  allow_failure: true
  before_script:
    - apk add --no-cache bash git python3
    - |
      VAUCHI_CI_SCRIPTS_DIR=$(mktemp -d)
      export VAUCHI_CI_SCRIPTS_DIR
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" init
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" remote add origin https://gitlab.com/vauchi/scripts.git
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" fetch --depth=1 origin "${VAUCHI_SCRIPTS_REF}"
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" checkout --detach FETCH_HEAD
  script:
    - |
      set -euo pipefail
      SCRIPT="${VAUCHI_CI_SCRIPTS_DIR}/scripts/audit-mobile-surface.sh"
      if [ ! -f "$SCRIPT" ]; then
        echo "audit-mobile-surface.sh is absent from the pinned scripts revision — skipping."
        exit 0
      fi

      # The audit script expects a workspace root containing a `core/`
      # sub-directory. We are inside core, so symlink to mimic the
      # layout. Frontend counters (ios_, android_, tui_) come out as 0
      # in core CI by design — those repos are audited from their own
      # pipelines or from the workspace-root snapshot in `_private/`.
      WS_HEAD=$(mktemp -d)
      ln -sfn "$CI_PROJECT_DIR" "$WS_HEAD/core"
      bash "$SCRIPT" "$WS_HEAD" >"$WS_HEAD/head.json"
      echo "── HEAD ──"
      cat "$WS_HEAD/head.json"

      # Run the same script against origin/main via a worktree.
      # GitLab CI's default clone is shallow — fetch main explicitly
      # before the worktree add, matching `lint:semver`'s pattern.
      # A failed refresh must fail the job rather than compare against a
      # potentially stale local reference.
      git fetch --depth=1 origin main
      if ! git rev-parse origin/main >/dev/null 2>&1; then
        echo "origin/main not available — skipping delta."
        exit 0
      fi
      WS_MAIN=$(mktemp -d)
      git worktree add -f --detach "$WS_MAIN/core" origin/main >/dev/null
      bash "$SCRIPT" "$WS_MAIN" >"$WS_MAIN/main.json"
      echo "── origin/main ──"
      cat "$WS_MAIN/main.json"

      python3 - "$WS_MAIN/main.json" "$WS_HEAD/head.json" <<'PY'
      import json, sys
      main = json.load(open(sys.argv[1]))["totals"]
      head = json.load(open(sys.argv[2]))["totals"]
      width = max(len(k) for k in head)
      grew, shrank, same = [], [], []
      for k in sorted(head):
          m, h = main.get(k, 0), head[k]
          d = h - m
          (grew if d > 0 else shrank if d < 0 else same).append((k, m, h, d))
      print()
      print("=" * 72)
      print("Legacy-surface ratchet — HEAD vs origin/main")
      print("=" * 72)
      if shrank:
          print("\n[OK] Counters that shrank:")
          for k, m, h, d in shrank:
              print(f"  {k:<{width}}  {m:>4} -> {h:>4}  (Δ {d:+d})")
      if same:
          print("\n[--] Counters unchanged:")
          for k, m, h, d in same:
              print(f"  {k:<{width}}  {m:>4}")
      if grew:
          print("\n[FAIL] Counters that GREW (ratchet violation):")
          for k, m, h, d in grew:
              print(f"  {k:<{width}}  {m:>4} -> {h:>4}  (Δ +{d})")
          print("\nThis MR added legacy surface. Audit the diff for new")
          print("`Mobile*` types, new PlatformAppEngine pub fns outside the")
          print("Humble allow-list, or new SystemTime::now / thread_rng /")
          print("thread::sleep callsites under vauchi-core. Plan:")
          print("  _private/docs/planning/todo/2026-05-11-pure-functional-core-program-plan.md")
          sys.exit(1)
      print()
      PY
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"


# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

# ============================================================
# Test Stage (MR only, gated by lint)
# ============================================================

# MR test jobs: use nextest for fast feedback (12x faster than cargo test,
# avoids llvm-cov instrumentation rebuild). Coverage runs on main only.
# Cucumber tests use cargo test (not nextest) because harness=false output
# is incompatible with nextest's test listing format.
# The test jobs run build:tests' archives: no compiler, no lock, any
# runner slot of the one shell runner. `--workspace-remap` points the
# binaries' CARGO_MANIFEST_DIR at this checkout, so fixtures and the
# sibling locales/themes resolve; the junit report still lands in
# target/nextest/ci/. A second shell runner would need the archives as
# artifacts instead; the built-on check names that case.
.run-archive:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs:
    - job: build:tests
      artifacts: false
  variables:
    # Word-split by the shell at use, so no quotes: the checkout path has
    # no spaces on the shell runners.
    NEXTEST_ARCHIVE_ARGS: --profile ci --workspace-remap $CI_PROJECT_DIR --extract-to target/archive-run --extract-overwrite

# The first script lines of every archive-running job (their before_script
# lists differ, so this is a script reference, not a before_script).
.archive-setup:
  script:
    - export ARCHIVE_DIR="$HOME/.cache/vauchi-ci/archives/$CI_PROJECT_NAME/$CI_PIPELINE_ID"
    - |
      if [ ! -d "$ARCHIVE_DIR" ]; then
        echo "ERROR: build:tests' archives are not on this host ($ARCHIVE_DIR missing)."
        echo "  The test jobs read them from the runner's disk; a build on another runner needs them as artifacts."
        exit 1
      fi
      [ "$(cat "$ARCHIVE_DIR/built-on")" = "$(hostname)" ] || { echo "ERROR: archives were built on $(cat "$ARCHIVE_DIR/built-on"), this job runs on $(hostname)"; exit 1; }
    - mkdir -p target/archive-run

test:core:
  extends: [.run-archive, .validation-rust]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    # `testing` compiles the `it` integration binary (required-features =
    # ["testing"]); without it the ~5000-test suite never ran in CI and
    # regressions merged green — F4 convergence, a V2 wire-format break, and
    # 5 stale multistage tests all shipped this way. See backlog
    # 2026-07-27-f4-bounded-skew-convergence-regression. The features are
    # in build:tests' archive.
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/core.tar.zst
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# The known-answer vectors' end-to-end backup import needs production
# Argon2id, which `test-kdf` above compiles out; this runs the vector tests
# alone without it (vauchi/private#119).
test:vectors:
  extends: [.run-archive]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/core-vectors.tar.zst -E 'test(protocol_test_vectors)'
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/tests/it/protocol_test_vectors_tests.rs
          - vauchi-core/tests/it/protocol_test_vectors_backup_v7_tests.rs
          - "vauchi-core/tests/fixtures/test-vectors/**"
          - "vauchi-core/src/crypto/**"
          - "vauchi-core/src/backup/**"
          - "vauchi-core/src/identity/**"
          - vauchi-core/src/exchange/x3dh.rs
          - vauchi-core/src/network/mailbox_token.rs
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# vauchi-protocol carries the shared relay/client wire types and their
# contract tests (tests/it/contract_relay_consumer_tests.rs, which pin the
# exact V2 request/response JSON). No other test job runs `-p
# vauchi-protocol`, so a wire-format regression there used to merge green
# and surface only at release-dev — see backlog
# 2026-07-27-core-ci-skips-vauchi-protocol-tests. No locales/themes or
# test-kdf: the crate is serde-only.
test:protocol:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
  script:
    - cargo nextest run --profile ci -p vauchi-protocol --features schema-gen
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

test:core-32bit:
  extends: [.validation-rust, .timeout-long]
  stage: test
  image:
    # Bookworm's sccache 0.4 pre-release races its startup notification socket.
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/i386/rust:1.93.1-trixie
    docker:
      platform: linux/386
  tags: [docker]
  needs:
    - job: lint:format
      optional: true
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo-i386
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/target-i386
    CARGO_INCREMENTAL: "0"
    RUSTC_WRAPPER: "sccache"
    SCCACHE_DIR: ${CI_PROJECT_DIR}/.cache/sccache/i386
    SCCACHE_CACHE_SIZE: "1G"
  cache:
    key: core-32bit-${CI_COMMIT_REF_SLUG}
    fallback_keys: ["core-32bit-${CI_DEFAULT_BRANCH}"]
    paths: [.cargo-i386/registry/, target-i386/, .cache/sccache/i386/]
  script:
    - 'test "$(getconf LONG_BIT)" = 32 || { echo "ERROR: expected a 32-bit userland, got $(getconf LONG_BIT)-bit"; exit 1; }'
    - apt-get update -qq
    - apt-get install -y --no-install-recommends sccache
    - sh ci/tests/rust-cache.test.sh
    - cargo test --locked -p vauchi-core --lib --features test-kdf
    # Integration tests that guard a 32-bit usize (#784) carry `32_bit` in
    # their name; only this job runs them where the bug can happen.
    - cargo test --locked -p vauchi-core --features "test-kdf testing" --test it -- 32_bit
  after_script:
    - sccache --show-stats
  rules:
    - !reference [.validation-rust, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths: [ci/tests/rust-cache.test.sh]

# The formal checks, in two jobs so each runs only on the merge requests
# that change what it checks (#757, private#1032). Kani and the wipe
# tests read Rust and its dependencies; the Tamarin and Quint models are
# hand-written and read no Rust, so a Rust change does not start them.
# Before the split one job ran both on every trigger, 32 to 51 minutes,
# and half its runs were lockfile-only changes that no model reads.
# check:ci-self-tests (formal-triggers) holds both path lists to the files they check;
# the slow models run in test:formal-extended below (private#842).
test:formal-code:
  extends: [.timeout-long]
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1-bookworm
  tags: [docker]
  needs: []
  variables:
    FORMAL_HOME: ${CI_PROJECT_DIR}/.formal
    # The image's own, not the template's ${CI_PROJECT_DIR}/.cargo: that
    # makes the repo's .cargo/config.toml (clang + mold, absent here)
    # cargo's home config, which `cargo install kani-verifier` then reads;
    # and `kani setup` needs rustup where CARGO_HOME points.
    CARGO_HOME: /usr/local/cargo
  cache:
    key: core-formal-code
    paths: [.formal/]
  script:
    - command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y --no-install-recommends python3)
    - FORMAL_SET=code sh ci/formal-verification.sh
  artifacts:
    when: always
    paths: [.formal-results/padding.json]
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/src/crypto/**/*.rs
          - vauchi-core/src/exchange/**/*.rs
          - vauchi-core/src/recovery/**/*.rs
          - vauchi-core/src/sync/delta*.rs
          - vauchi-core/tests/*wipe_on_drop_tests.rs
          - ci/formal-verification.sh
          - ci/check-kani-result.py
          - ci/tests/check-kani-result.test.py
          - Cargo.lock
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

test:formal-models:
  extends: [.timeout-long]
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1-bookworm
  tags: [docker]
  needs: []
  variables:
    FORMAL_HOME: ${CI_PROJECT_DIR}/.formal
    CARGO_HOME: /usr/local/cargo
  cache:
    key: core-formal-models
    paths: [.formal/]
  script:
    - FORMAL_SET=models sh ci/formal-verification.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/verification/**/*
          - vauchi-app/verification/**/*
          - ci/formal-verification.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The Bluetooth handshake lemmas (six capped prover runs, 18 minutes) and
# the Apalache verifies of the Bluetooth and multi-stage machines, which
# pushed the formal job past its hour (private#842, job 17540297472).
# Nightly on main; on a merge request that touches the models it is there
# to press. It shares test:formal-models' tools, so it shares its cache.
test:formal-extended:
  extends: [.timeout-extended]
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1-bookworm
  tags: [docker]
  needs: []
  variables:
    FORMAL_HOME: ${CI_PROJECT_DIR}/.formal
    CARGO_HOME: /usr/local/cargo
  cache:
    key: core-formal-models
    paths: [.formal/]
  script:
    - FORMAL_SET=extended sh ci/formal-verification.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/verification/**/*
          - vauchi-app/verification/**/*
          - ci/formal-verification.sh
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"

# e2e's smoke suite against this merge request's own Core (vauchi/private#1032,
# decision D8). The job clones e2e at main, points e2e's Core dependency at
# this checkout and builds e2e's pinned relays against it, then runs smoke_
# on e2e's Core device, which calls this Core in-process: no CLI is built,
# so a change the CLI must follow can merge first (vauchi/private#1118).
# A [patch] cannot do this: the exact
# `version = "=X"` pins refuse a Core of another version, so
# ci/point-core-at.sh rewrites the job's own clones and nothing is committed.
# Replaced verify:downstream-rust's e2e leg (that job is gone, private#1051),
# which built e2e's own pinned tag and proved nothing about the merge. When it fails, ci/e2e-smoke.sh tries
# the target branch's Core too: if that fails as well, e2e's pinned set is
# behind Core (a Core minor moved, e2e's bump not yet in) and the job only
# warns, exit 3, instead of blocking every protocol MR (private#1034).
test:e2e-smoke:
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  needs: []
  allow_failure:
    exit_codes: [3]
  variables:
    E2E_DIR: ${CI_PROJECT_DIR}/../e2e-for-core-${CI_JOB_ID}
    TARGET_CORE_DIR: ${CI_PROJECT_DIR}/../core-target-${CI_JOB_ID}
  script:
    - git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/e2e.git" "$E2E_DIR"
    - git clone --depth=1 --branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/core.git" "$TARGET_CORE_DIR"
    - sh ci/e2e-smoke.sh "$E2E_DIR" "$CI_PROJECT_DIR" "$TARGET_CORE_DIR"
  after_script:
    - rm -rf "${CI_PROJECT_DIR}/../e2e-for-core-${CI_JOB_ID}" "${CI_PROJECT_DIR}/../core-target-${CI_JOB_ID}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - vauchi-core/src/crypto/**/*
          - vauchi-core/src/exchange/**/*
          - vauchi-core/src/network/**/*
          - vauchi-core/src/backup/**/*
          - vauchi-core/src/recovery/**/*
          - vauchi-core/src/sync/**/*
          - vauchi-protocol/**/*
          - Cargo.lock

test:cucumber:
  extends: [.run-archive, .validation-rust]
  allow_failure: false
  before_script:
    - !reference [.self-hosted, before_script]
    # Force the cached ../features checkout to the tip of main. A plain
    # `pull --ff-only … || true` silently kept a STALE checkout on any
    # runner whose cache had diverged, so cucumber ran against old .feature
    # files and previously-wired scenarios regressed to skipped — a
    # spurious gate failure that had nothing to do with the MR. fetch +
    # hard-reset always lands on origin/main and fails loudly if it can't.
    - if [ ! -d ../features/.git ]; then git clone --depth=1 https://gitlab.com/vauchi/features.git ../features; else git -C ../features fetch --depth=1 origin main && git -C ../features reset --hard FETCH_HEAD; fi
  script:
    # @ui features (theming/a11y/navigation/onboarding/…) describe frontend
    # rendering — untestable against core; they belong in the frontend
    # harnesses (Espresso/XCUITest/AT-SPI). Excluded so the core run reflects
    # only core-eligible scenarios.
    # `testing` exposes the exchange test seams (MockProximityVerifier) the
    # two-party exchange steps drive; `test-kdf` keeps per-scenario identity
    # creation fast. Both features are in build:tests' cucumber binary; the
    # binary finds ../features through CARGO_MANIFEST_DIR, which cargo
    # would set and a direct run must.
    - !reference [.archive-setup, script]
    - CARGO_MANIFEST_DIR="$CI_PROJECT_DIR/vauchi-core" "$ARCHIVE_DIR/cucumber_tests" --tags "not @wip and not @ui"

test:platform:
  extends: [.run-archive, .validation-platform]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/platform.tar.zst
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# vauchi-app unit + `it` integration tests. The `it` binary
# (`tests/it/main.rs`) hosts the Wire Humble regression test
# (ADR-044), engine-wiring tests, notification contracts, and
# component serialization tests. Without this job those would only
# run via `coverage:workspace` on main merges — too late to gate an
# MR. The `reachability` binary is excluded automatically because
# its `required-features = ["test-support"]` filter rejects
# default-feature builds; it runs in `test:reachability` below.
test:app:
  extends: [.run-archive, .validation-rust]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    # network-http is not in vauchi-app's defaults, and `-p` builds the
    # package alone rather than the workspace — so without it, everything
    # behind `cfg(all(feature = "network-http", feature = "storage"))`
    # compiles out and is never tested here. That silently excluded the
    # whole device-link initiator (25 tests). Local `just check core`
    # builds the workspace, where vauchi-platform enables the feature and
    # unification hides the gap, so a test can pass locally and vanish in
    # CI. No network is touched: those tests drive fakes.
    #
    # `testing` is the same trap: tests behind `cfg(feature = "testing")`
    # (they need FakeClock, or vauchi-core modules that are public only
    # under its `testing` feature) compiled out here and in
    # `just test core`, so 14 tests ran nowhere. One had gone stale and one
    # failed one run in four, unnoticed (2026-10-02, vauchi/private#438).
    # The features are in build:tests' archive.
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/app.tar.zst
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Exercises the `dev-logging` feature ON path (the native tracing
# subscriber the mobile/desktop bridge installs). Every other test job runs
# with the feature OFF, so only the no-subscriber release posture is
# covered. On Linux only the cabi (stderr fmt) sink compiles; the
# target-gated tracing-oslog / paranoid-android sinks are exercised by
# their own binding builds. The vauchi-platform leg is compile-coverage
# for the feature on a non-mobile target.
test:dev-logging:
  extends: [.run-archive, .validation-rust]
  before_script:
    - !reference [.self-hosted, before_script]
  script:
    # The tag guard (a dev-only feature must not build in a tag pipeline,
    # private#794) runs in build:tests with the other compile-time checks.
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/cabi-dev-logging.tar.zst
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/platform-dev-logging.tar.zst

# Layer 1 ScreenModel reachability gate — catches orphan handler arms
# (declared but no affordance emits the action_id) and orphan
# affordances (emitted ScreenActions nothing handles). Today pins
# three known Onboarding orphans (submit_custom_group,
# submit_display_name, add_social); failure indicates either a
# regression or a fix that wasn't reflected in the test's pinned
# set. Gated behind test-support feature to keep default tests fast.
#
# Plan:
#   _private/docs/planning/todo/2026-04-20-frontend-correctness-strategy-plan.md
#   Phase 1 Task 1.4.
test:reachability:
  extends: [.run-archive, .validation-rust]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - !reference [.archive-setup, script]
    - cargo nextest run $NEXTEST_ARCHIVE_ARGS --archive-file "$ARCHIVE_DIR"/app-reachability.tar.zst
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# WASM compatibility guard — verifies no C FFI crate (aws-lc-rs, ring, openssl)
# appears in vauchi-core's non-TLS dependency path. Compilation check is not
# possible with --no-default-features because some modules reference feature-gated
# code unconditionally (tracked issue — fix requires conditional compilation audit).
# Instead, verify the dependency tree is C-FFI-free outside the TLS path.
validate:wasm-compat:
  extends: [.linux-runner-nocache, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - |
      echo "Checking vauchi-core dependency tree for C FFI crates..."
      # List all non-dev deps, excluding the TLS chain (rustls → aws-lc-rs is intentional)
      CFFI_DEPS=$(cargo tree -p vauchi-core --no-default-features --depth 3 -e no-dev 2>/dev/null \
        | grep -E "aws-lc|ring |openssl" || true)
      if [ -n "$CFFI_DEPS" ]; then
        echo "❌ C FFI dependencies found in non-TLS path:"
        echo "$CFFI_DEPS"
        echo ""
        echo "These would break wasm32-unknown-unknown compilation."
        echo "Use pure Rust crates (RustCrypto) for crypto operations."
        exit 1
      fi
      echo "✅ No C FFI in vauchi-core's non-TLS dependency path"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/Cargo.toml"
          - "vauchi-core/src/crypto/**/*.rs"
          - "vauchi-core/src/lib.rs"

# Content contract validation — detect drift between core parsers and
# sibling content repos (themes/, locales/) and the CDN's networks file
# (website/app-files-src/networks.json, private#734). Runs when parser
# code changes.
validate:content-contracts:
  # .timeout-cold-rebuild: see the template comment.
  extends: [.linux-runner, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - |
      mkdir -p ../website/app-files-src
      NETWORKS_URL=https://gitlab.com/vauchi/website/-/raw/main/app-files-src/networks.json
      HTTP_STATUS=$(curl -s -o ../website/app-files-src/networks.json -w '%{http_code}' "$NETWORKS_URL") || HTTP_STATUS="000"
      [ "$HTTP_STATUS" = "200" ] || { echo "ERROR: $NETWORKS_URL → HTTP $HTTP_STATUS"; exit 1; }
  script:
    - bash scripts/validate-content-contracts.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-app/src/theme.rs"
          - "vauchi-app/src/i18n.rs"
          - "vauchi-core/src/social/**"
          - "vauchi-app/src/content/**/*.rs"
          - "scripts/validate-content-contracts.sh"
    # C4: Run when triggered by content repos (themes/, locales/)
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $CONTENT_TRIGGER_REPO

lint:module-boundaries:
  extends: [.linux-runner-nocache]
  stage: lint
  needs: []
  script:
    - python3 scripts/tests/check-module-boundaries.test.py
    - bash scripts/check-module-boundaries.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/src/**/*.rs"
          - "scripts/check-module-boundaries.sh"
          - "scripts/tests/check-module-boundaries.test.py"
          - ".gitlab-ci.yml"

# Guard: no diagnostic_* UniFFI exports in default-feature binding surface.
# Diagnostics must only ship in --features diagnostic-scanner builds
# (test/debug). See 2026-04-19-diagnostics-out-of-production-plan.md.
# Coverage job: run on main merges only (not MRs) — llvm-cov is too slow
# for per-push feedback but still needed for coverage tracking/badges.
# Measures both vauchi-core and vauchi-platform in a single instrumentation
# run (avoids redundant compilation + instrumentation overhead).
coverage:workspace:
  extends: [.coverage-job, .linux-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_PACKAGE: ""
    COVERAGE_REPO_LABEL: "core"
    # The same features `just test core` enables (resolve-repo.sh,
    # repo_test_features): without vauchi-core/testing the `it` target is
    # not built and the figure describes a third of the suite (private#975).
    COVERAGE_EXTRA_FLAGS: "--features vauchi-core/testing,vauchi-core/test-kdf,vauchi-app/testing"

# Binary size tracking — builds release and pushes metrics to Grafana.
# Runs on main merges and release tags (not per-MR — release build is slow).
perf:binary-size:
  extends: [.binary-size-tracking-job, .linux-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  variables:
    BINARY_SIZE_PACKAGES: "vauchi-core vauchi-platform"
    BINARY_SIZE_REPO_LABEL: "core"

# ============================================================
# Benchmark Stage — Performance Regression Gate (PI-10)
# ============================================================
# Criterion benchmarks with baseline comparison.
# Uses shared template from vauchi/scripts ci-templates/benchmark.yml.
# Runs on nightly schedule + release tags (not per-MR).

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  variables:
    BENCH_PACKAGE: "vauchi-core"
    BENCH_TARGETS: "--bench crypto_benchmarks --bench performance_regression"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  # Perf-benchmark comparison is informational and must NOT gate releases. On a
  # release (tag) pipeline a failure here cancelled the trigger-stage
  # update:swift-bindings and silently blocked the vauchi-platform-swift publish
  # (observed on v0.51.59 — package/publish all green, bindings never shipped).
  # allow_failure surfaces a regression (red job) without blocking merge or
  # release; a real regression is then investigated, not auto-blocking.
  allow_failure: true
  variables:
    BENCH_PACKAGE: "vauchi-core"
    BENCH_TARGETS: "--bench crypto_benchmarks --bench performance_regression"

# ============================================================
# Security Stage (MR only, gated by lint, parallel with test)
# ============================================================

# Rust-specific security audit (runs on dependency changes)
security:audit:
  extends: [.linux-runner-readonly, .security-audit, .validation-deps, .timeout-quick]
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || cargo install cargo-audit

# Full cargo-deny check: advisories, licenses, bans, sources (runs on all MRs)
# Inherits lint stage + needs:[] from shared template — starts immediately
security:deny:
  extends: [.linux-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet)
# Inherits lint stage + needs:[] from shared template — starts immediately.
# Uses --locked (committed Cargo.lock is source of truth for core).
# On main, auto-regenerates exemptions if a lockfile update introduced unvetted deps.
security:vet:
  extends: [.linux-runner-readonly, .security-vet-autofix-job]
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/77957857/repository/files/scripts%2Fci%2Fvet-autofix.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o vet-autofix.sh
      chmod +x vet-autofix.sh
    - ./vet-autofix.sh

# Refine semgrep-sast from security.yml: gate on lint, run only on Rust changes
semgrep-sast:
  allow_failure: false
  needs:
    - job: lint:format
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

security:sast-severity:
  extends: .security-sast-severity-gate
  rules: !reference [semgrep-sast, rules]

# Refine secret_detection from security.yml: gate on lint
secret_detection:
  allow_failure: false
  needs:
    - job: lint:format
      optional: true

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
  # Skip on the scheduled (nightly) pipeline — no docs/badges change to
  # deploy. Job-level rules replace the extended .badges-pages rules
  # (badges.yml), so we replicate them + never-on-schedule. Merges unchanged.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

github-mirror:
  extends: .github-mirror
  # Skip on the scheduled (nightly) pipeline — nothing new to mirror.
  # Replicates .github-mirror rules (github-mirror.yml) + never-on-schedule.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
