# GitLab CI for vauchi-core
#
# Pipeline strategy (PI-13 fail-fast DAG):
#   - MR: Validation with DAG ordering — cheap checks gate expensive ones
#   - Tags (v*): Build, package, publish releases
#
# DAG execution order (MR pipelines):
#   lint (< 2 min, includes vet+deny) ── test (< 15 min)
#
# Nightly/release pipelines also run bench:save-baseline + bench:compare + perf:binary-size.
#
#   cargo-vet and cargo-deny start immediately (needs:[]) alongside lint.
#   Lint must pass before tests run.
#
# Uses shared templates from vauchi/scripts for consistency.
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#     - Rust lint/test: *.rs, Cargo.toml, Cargo.lock
#     - REUSE lint: LICENSES/, REUSE.toml, LICENSE*
#     - Security audit: Cargo.toml, Cargo.lock (dependencies)
#     - License check: Cargo.*, deny.toml
#   - Test and coverage combined in single pass
#   - DAG execution: needs: with optional:true for cross-rule compatibility
#   - Parallel build jobs (iOS + Android)
#   - Parallel test jobs (core + platform)
#   - Parallel publish jobs (core + platform)
#   - CARGO_INCREMENTAL=0 to reduce target/ size and cache overhead
#   - No-cache/read-only cache for lint/security jobs (skip expensive upload)
#   - mold linker on Linux (2-5x faster linking)
#   - Cargo.lock-based cache keys (smarter invalidation)

# Include shared templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/typos.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/benchmark.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

# Cosign pinned version + checksum (used by update:swift-bindings and publish:maven)
# Single source of truth for cosign binary integrity — update BOTH values together.
.cosign-install:
  script:
    - |
      COSIGN_VERSION="v3.0.5"
      COSIGN_SHA256="db15cc99e6e4837daabab023742aaddc3841ce57f193d11b7c3e06c8003642b2"
      if ! command -v cosign &>/dev/null; then
        echo "Installing cosign ${COSIGN_VERSION}..."
        curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
          -o /usr/local/bin/cosign || { echo "ERROR: cosign install failed"; exit 1; }
        echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c - || {
          echo "ERROR: cosign binary checksum mismatch — possible supply chain compromise"
          rm -f /usr/local/bin/cosign; exit 1
        }
        chmod +x /usr/local/bin/cosign
      fi

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - prebuild
  - build
  - package
  - publish
  - trigger
  - deploy


# ============================================================
# Auto-Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
# Works for all version types: stable (0.4.0), dev (0.4.0-dev.0), rc (0.4.0-rc.1).
#
# If the version tag already exists (no bump), auto-creates a dev tag
# (v{version}-dev.N) so every merge to main produces a testable build.

auto-tag:version:
  extends: [.linux-runner-nocache, .main-only]
  stage: auto-tag
  resource_group: auto-tag
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "50"
  before_script: []
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Use bot's verified commit_email — GITLAB_USER_EMAIL may be a human's
      # email that isn't verified on the bot account pushing via PROJECT_ACCESS_TOKEN.
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')
      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/package/publish stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "Tag ${TAG} already exists — creating dev tag instead"

        # Skip dev tag for non-code changes (docs, scripts, CI-only merges).
        # Uses CI_COMMIT_BEFORE_SHA (previous main HEAD before this push) to
        # detect ALL files changed in the merge, not just the last commit.
        # Fallback: if before-SHA is zeros (shouldn't happen on main), assume code changed.
        BEFORE="${CI_COMMIT_BEFORE_SHA:-0000000000000000000000000000000000000000}"
        if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
          CODE_CHANGES=$(git diff --name-only "$BEFORE" HEAD | grep -cE '\.(rs)$|Cargo\.(toml|lock)$' || echo 0)
          if [ "$CODE_CHANGES" = "0" ]; then
            echo "ℹ No Rust code changes in this merge — skipping dev tag"
            echo "  Changed files:"
            git diff --name-only "$BEFORE" HEAD | sed 's/^/    /'
            exit 0
          fi
          echo "Detected ${CODE_CHANGES} code file(s) changed — proceeding with dev tag"
        else
          echo "⚠ CI_COMMIT_BEFORE_SHA is zeros — assuming code changed (safe default)"
        fi

        # Strip any pre-release suffix to get the base version for dev tags
        BASE_VERSION=$(echo "${VERSION}" | sed 's/-.*//')

        # Find highest existing dev tag and increment
        # Filter out ^{} dereferenced refs which break the grep pattern
        LAST_DEV=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-dev.*" \
          | grep -v '\^{}' | sed 's|.*/||' | sort -V | tail -1 || true)
        if [ -n "${LAST_DEV}" ]; then
          N=$(echo "${LAST_DEV}" | grep -oE '[0-9]+$')
          N=$((N + 1))
        else
          N=1
        fi
        DEV_TAG="v${BASE_VERSION}-dev.${N}"

        echo "Creating dev tag: ${DEV_TAG} (last=${LAST_DEV:-none}, N=${N})"
        git tag -a "${DEV_TAG}" -m "Dev build ${DEV_TAG}"
        if ! git push origin "${DEV_TAG}" 2>&1; then
          echo "✗ Failed to push ${DEV_TAG} — tag may already exist"
          exit 1
        fi
        echo "✓ Created and pushed dev tag ${DEV_TAG}"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Runs lint + test only.
# Dev tags do NOT run build/package/publish (excluded from .release-or-rc).

dev:verify:
  extends: [.linux-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.linux-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.linux-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.linux-runner, .dev-test-nextest, .timeout-standard]

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage, mutation, bench.

rc:verify:
  extends: [.linux-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.linux-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.linux-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .linux-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    COVERAGE_PACKAGE: "vauchi-core"
    COVERAGE_REPO_LABEL: "core"

rc:mutation:
  extends: [.mutation-nightly, .linux-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_PACKAGE: "vauchi-core"
    MUTATION_EXTRA_FLAGS: "--exclude-re theme.rs"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]

rc:security:audit:
  extends: [.linux-runner-readonly, .rc-security-audit]

# ============================================================
# Lint Stage — Preflight Gate (MR only, change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

# Informational: warn when merging without a version bump.
# Auto-tag will create a dev tag in that case (see auto-tag:version).
lint:images:
  extends: .image-lint

lint:version-check:
  extends: [.linux-runner-nocache, .timeout-quick]
  stage: lint
  needs: []
  allow_failure: true
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"

      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo ""
        echo "⚠ No version bump — tag ${TAG} already exists"
        echo "  On merge, auto-tag will create a dev tag (v${VERSION%-*}-dev.N)"
        echo "  To create a release tag, bump the version in Cargo.toml"
      else
        echo "✓ New version ${VERSION} — tag ${TAG} will be created on merge"
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

lint:format:
  extends: [.linux-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.linux-runner, .lint-clippy, .validation-rust, .timeout-standard]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]

# SemVer compatibility check — catch breaking API changes before they cascade
# to 10+ downstream consumers (cli, tui, e2e, relay, linux-gtk, mobile bindings).
# Advisory while pre-1.0 (no deployed clients, SP-33 allows intentional breaks).
# Flip to allow_failure: false when version reaches 1.0.0.
lint:semver:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: lint
  needs: []
  allow_failure: true
  script:
    - command -v cargo-semver-checks >/dev/null 2>&1 || cargo binstall cargo-semver-checks --no-confirm 2>/dev/null || cargo install cargo-semver-checks
    - rustup toolchain install nightly --profile minimal --component rustdoc 2>/dev/null || true
    - git fetch origin main
    # vauchi-protocol: no workspace path deps, can check directly
    - cargo semver-checks check-release -p vauchi-protocol --baseline-rev origin/main
    # vauchi-core: depends on vauchi-protocol (workspace path dep) which can't
    # resolve in semver-checks' isolated temp project.
    # Upstream: https://github.com/obi1kenobi/cargo-semver-checks/issues/638
    # Workaround: pre-generate rustdoc JSON in workspace context with nightly,
    # then pass to semver-checks via --current-rustdoc / --baseline-rustdoc.
    - |
      echo "Generating current rustdoc JSON for vauchi-core..."
      RUSTDOCFLAGS="-Z unstable-options --output-format json" cargo +nightly doc -p vauchi-core --no-deps
      echo "Generating baseline rustdoc JSON from origin/main..."
      git worktree remove /tmp/baseline 2>/dev/null || true
      git worktree prune
      rm -rf /tmp/baseline
      git worktree add /tmp/baseline origin/main --detach
      RUSTDOCFLAGS="-Z unstable-options --output-format json" cargo +nightly doc --manifest-path /tmp/baseline/Cargo.toml -p vauchi-core --no-deps
      cargo semver-checks check-release -p vauchi-core \
        --current-rustdoc target/doc/vauchi_core.json \
        --baseline-rustdoc /tmp/baseline/target/doc/vauchi_core.json
      git worktree remove /tmp/baseline 2>/dev/null || true
    # vauchi-platform: include_bytes! references sibling themes/ repo —
    # skipped until themes are vendored or a similar workaround is applied

# Duplicate dependency check (advisory — detects multiple versions of same crate)
lint:duplicates:
  extends: [.linux-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory — detects unused crates via cargo-machete)
lint:machete:
  extends: [.linux-runner-nocache, .lint-machete-job, .timeout-quick]

# CABI header freshness — catch stale headers after export changes (T0-11)
lint:cabi-header:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: lint
  needs: []
  script:
    - cargo build -p vauchi-cabi
    - git diff --exit-code vauchi-cabi/include/vauchi.h || { echo "CABI header is stale — rebuild with 'cargo build -p vauchi-cabi' and commit the updated include/vauchi.h"; exit 1; }

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

# ============================================================
# Test Stage (MR only, gated by lint)
# ============================================================

# MR test jobs: use nextest for fast feedback (12x faster than cargo test,
# avoids llvm-cov instrumentation rebuild). Coverage runs on main only.
# Cucumber tests use cargo test (not nextest) because harness=false output
# is incompatible with nextest's test listing format.
test:core:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run --profile ci -p vauchi-core --features test-kdf
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

test:cucumber:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: test
  allow_failure: false
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - if [ ! -d ../features ]; then git clone --depth=1 https://gitlab.com/vauchi/features.git ../features; else git -C ../features pull --ff-only 2>/dev/null || true; fi
  script:
    - cargo test --test cucumber_tests -- --tags "not @wip"

test:platform:
  extends: [.linux-runner, .validation-platform, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run --profile ci -p vauchi-platform
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# Schema contract validation — detect drift between core UI types and
# generated JSON schemas. Runs when UI type definitions change.
validate:schema:
  extends: [.linux-runner, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - cargo test --features schema-gen -p vauchi-core --test schema_gen
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/src/ui/**/*.rs"
          - "vauchi-core/schemas/**"
          - "vauchi-core/Cargo.toml"


# The secure-storage feature is only used by downstream CABI consumers
# (linux-qt, windows). Core CI doesn't enable it by default, so trait
# imports and API compatibility can break undetected (F1, 2026-03-20).
validate:secure-storage:
  extends: [.linux-runner, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo check --features secure-storage -p vauchi-cabi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-cabi/src/**/*.rs"
          - "vauchi-core/src/storage/**/*.rs"
          - "vauchi-core/Cargo.toml"
          - "vauchi-cabi/Cargo.toml"

# WASM compatibility guard — verifies no C FFI crate (aws-lc-rs, ring, openssl)
# appears in vauchi-core's non-TLS dependency path. Compilation check is not
# possible with --no-default-features because some modules reference feature-gated
# code unconditionally (tracked issue — fix requires conditional compilation audit).
# Instead, verify the dependency tree is C-FFI-free outside the TLS path.
validate:wasm-compat:
  extends: [.linux-runner-nocache, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - |
      echo "Checking vauchi-core dependency tree for C FFI crates..."
      # List all non-dev deps, excluding the TLS chain (rustls → aws-lc-rs is intentional)
      CFFI_DEPS=$(cargo tree -p vauchi-core --no-default-features --depth 3 -e no-dev 2>/dev/null \
        | grep -E "aws-lc|ring |openssl" || true)
      if [ -n "$CFFI_DEPS" ]; then
        echo "❌ C FFI dependencies found in non-TLS path:"
        echo "$CFFI_DEPS"
        echo ""
        echo "These would break wasm32-unknown-unknown compilation."
        echo "Use pure Rust crates (RustCrypto) for crypto operations."
        exit 1
      fi
      echo "✅ No C FFI in vauchi-core's non-TLS dependency path"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/Cargo.toml"
          - "vauchi-core/src/crypto/**/*.rs"
          - "vauchi-core/src/lib.rs"

# Content contract validation — detect drift between core parsers and
# sibling content repos (themes/, locales/). Runs when parser code changes.
validate:content-contracts:
  extends: [.linux-runner, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - bash scripts/validate-content-contracts.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/src/theme.rs"
          - "vauchi-core/src/i18n.rs"
          - "vauchi-core/src/social/**/*.rs"
          - "vauchi-core/src/content/**/*.rs"
          - "scripts/validate-content-contracts.sh"
    # C4: Run when triggered by content repos (themes/, locales/)
    - if: $CI_PIPELINE_SOURCE == "pipeline" && $CONTENT_TRIGGER_REPO

lint:module-boundaries:
  extends: [.linux-runner-nocache]
  stage: lint
  needs: []
  script:
    - bash scripts/check-module-boundaries.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "vauchi-core/src/**/*.rs"
          - "scripts/check-module-boundaries.sh"

# Coverage job: run on main merges only (not MRs) — llvm-cov is too slow
# for per-push feedback but still needed for coverage tracking/badges.
# Measures both vauchi-core and vauchi-platform in a single instrumentation
# run (avoids redundant compilation + instrumentation overhead).
coverage:workspace:
  extends: [.coverage-job, .linux-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_PACKAGE: ""
    COVERAGE_REPO_LABEL: "core"
    COVERAGE_EXTRA_FLAGS: "--features test-kdf"

# Binary size tracking — builds release and pushes metrics to Grafana.
# Runs on main merges and release tags (not per-MR — release build is slow).
perf:binary-size:
  extends: [.binary-size-tracking-job, .linux-runner, .timeout-long]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  variables:
    BINARY_SIZE_PACKAGES: "vauchi-core vauchi-platform"
    BINARY_SIZE_REPO_LABEL: "core"

# ============================================================
# Benchmark Stage — Performance Regression Gate (PI-10)
# ============================================================
# Criterion benchmarks with baseline comparison.
# Uses shared template from vauchi/scripts ci-templates/benchmark.yml.
# Runs on nightly schedule + release tags (not per-MR).

bench:save-baseline:
  extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
  variables:
    BENCH_PACKAGE: "vauchi-core"
    BENCH_TARGETS: "--bench crypto_benchmarks --bench performance_regression"

bench:compare:
  extends: [.bench-compare, .linux-runner, .timeout-standard, .bench-cache]
  variables:
    BENCH_PACKAGE: "vauchi-core"
    BENCH_TARGETS: "--bench crypto_benchmarks --bench performance_regression"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .linux-runner, .timeout-extended]
  variables:
    MUTATION_PACKAGE: "vauchi-core"
    MUTATION_EXTRA_FLAGS: "--exclude-re theme.rs"
    # Absolute path so cargo-mutants' /tmp/ copies can still find locales
    VAUCHI_LOCALES_DIR: "$CI_BUILDS_DIR/$CI_PROJECT_PATH/../locales"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]

# ============================================================
# Fuzz Testing (Nightly scheduled, T2-10)
# ============================================================

# Nightly fuzz run — cycles through all 11 fuzz targets for 5 minutes each
fuzz:nightly:
  extends: [.linux-runner, .timeout-extended]
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_ENABLED == "true"
  allow_failure: true
  script:
    - |
      # Install cargo-fuzz if not available (--force handles stale cached binaries)
      command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked --force

      cd vauchi-core/fuzz
      FUZZ_DURATION="${FUZZ_DURATION_SECS:-300}"
      FUZZ_JOBS="${FUZZ_PARALLEL_JOBS:-4}"

      TARGETS="fuzz_decode_message fuzz_qr_payload fuzz_unpad fuzz_delta_decode \
               fuzz_recovery_claim fuzz_nfc_payload fuzz_ble_payload \
               fuzz_ble_advertisement fuzz_exchange_payload fuzz_encrypted_exchange \
               fuzz_ratchet_state"

      echo "=== Fuzzing $(echo $TARGETS | wc -w) targets, ${FUZZ_JOBS} parallel, ${FUZZ_DURATION}s each ==="

      FAILED=0
      echo "$TARGETS" | tr ' ' '\n' | grep -v '^$' | \
        xargs -P "$FUZZ_JOBS" -I{} sh -c \
          'echo "START: {}"; cargo fuzz run {} -- -max_total_time='"$FUZZ_DURATION"' 2>&1 || echo "CRASH:{}"' \
          | tee /tmp/fuzz-output.log

      FAILED=$(grep -c '^CRASH:' /tmp/fuzz-output.log || true)
      echo "=== Fuzz Summary ==="
      echo "Targets: 11, Crashes: $FAILED"
      [ "$FAILED" -eq 0 ] || exit 1
  cache:
    key: fuzz-corpus-core
    paths:
      - vauchi-core/fuzz/corpus/
    policy: pull-push
  artifacts:
    paths:
      - vauchi-core/fuzz/artifacts/
    expire_in: 1 month
    when: on_failure

# Slow property tests — timing-sensitive exchange tests with wall-clock jitter.
# Runs #[ignore] tests that are too slow for per-push CI (~2 min).
test:slow:
  extends: [.linux-runner, .timeout-standard]
  stage: mutation
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SLOW_TESTS_ENABLED == "true"
  allow_failure: true
  script:
    - cargo test --workspace -- --ignored --nocapture

# ============================================================
# Security Stage (MR only, gated by lint, parallel with test)
# ============================================================

# Rust-specific security audit (runs on dependency changes)
security:audit:
  extends: [.linux-runner-readonly, .security-audit, .validation-deps, .timeout-quick]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || cargo install cargo-audit

# Full cargo-deny check: advisories, licenses, bans, sources (runs on all MRs)
# Inherits lint stage + needs:[] from shared template — starts immediately
security:deny:
  extends: [.linux-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet)
# Inherits lint stage + needs:[] from shared template — starts immediately
# Override script to use --locked (prevents generate-lockfile from resolving unvetted versions)
security:vet:
  extends: [.linux-runner-readonly, .security-vet-job]
  script:
    - cargo fetch
    - cargo vet --locked

# Refine semgrep-sast from security.yml: gate on lint, run only on Rust changes
semgrep-sast:
  needs:
    - job: lint:format
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Refine secret_detection from security.yml: gate on lint
secret_detection:
  needs:
    - job: lint:format
      optional: true

# ============================================================
# Prebuild Stage — Cache bindings on main merge
# ============================================================
# Pre-builds Apple and Android bindings on every merge to main and
# uploads them to the GitLab Generic Package Registry keyed by commit SHA.
# The release pipeline (build stage) checks for cached artifacts before
# building from scratch, saving ~45 min (Apple) + ~35 min (Android).
#
# Artifacts expire after 7 days in the package registry — only the
# latest main merge matters for the next release.

prebuild:apple:
  extends: [.macos-runner, .timeout-extended]
  stage: prebuild
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "scripts/build-bindings.sh"
          - "scripts/package-xcframework.sh"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    # Build ALL Apple targets (device + simulator + macOS) so prebuild
    # artifacts are complete for tag pipelines that need xcframework packaging.
    # --release-only was removed: it skipped sim targets, making every tag
    # pipeline fall back to a full rebuild (defeating the prebuild cache).
    - ./scripts/build-bindings.sh --apple
    - |
      echo "Uploading Apple binding artifacts for SHA ${CI_COMMIT_SHA}..."
      tar czf bindings-apple.tar.gz -C target/bindings ios/ macos/
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file bindings-apple.tar.gz \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-prebuild/${CI_COMMIT_SHA}/bindings-apple.tar.gz")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Apple bindings cached for SHA ${CI_COMMIT_SHA}"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ Apple bindings already cached for SHA ${CI_COMMIT_SHA} — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

prebuild:android:
  extends: [.linux-runner, .timeout-long]
  stage: prebuild
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "scripts/build-bindings.sh"
          - "scripts/package-android.sh"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android --release-only
    - |
      echo "Uploading Android binding artifacts for SHA ${CI_COMMIT_SHA}..."
      tar czf bindings-android.tar.gz -C target/bindings android/
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file bindings-android.tar.gz \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-prebuild/${CI_COMMIT_SHA}/bindings-android.tar.gz")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Android bindings cached for SHA ${CI_COMMIT_SHA}"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ Android bindings already cached for SHA ${CI_COMMIT_SHA} — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

# ============================================================
# Build Stage — All version tags (stable, RC, dev)
# Builds platform bindings for iOS and Android on every version tag.
# Checks for prebuild cache first — falls back to full build on miss.
# ============================================================

# Verify tag is on main branch before proceeding with release
# Overrides .self-hosted SSH clone — tag pipelines need HTTPS checkout
# since the runner may not have gitlab.com in known_hosts
release:verify:
  extends: [.linux-runner, .release-or-rc]
  stage: build
  needs: []
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "100"
  before_script: []
  script:
    - |
      echo "Verifying tag $CI_COMMIT_TAG is on main branch..."
      git fetch origin main --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "✓ Tag $CI_COMMIT_TAG is on main branch"
      else
        echo "✗ ERROR: Tag $CI_COMMIT_TAG is NOT on main branch!"
        echo "  Tags must only be created on commits that are on main."
        exit 1
      fi

build:apple:
  extends: [.macos-runner, .release-or-rc, .timeout-extended]
  stage: build
  needs: [release:verify]
  script:
    - |
      # Try to download prebuild artifacts cached on main merge
      echo "Checking for prebuild Apple bindings at SHA ${CI_COMMIT_SHA}..."
      HTTP_CODE=$(curl -s -o bindings-apple.tar.gz -w "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-prebuild/${CI_COMMIT_SHA}/bindings-apple.tar.gz")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "✓ Found prebuild Apple bindings — extracting"
        mkdir -p target/bindings
        tar xzf bindings-apple.tar.gz -C target/bindings
        rm bindings-apple.tar.gz
        # Prebuild uses --release-only (device ARM64 only, for speed).
        # Tag pipelines need sim lib too for xcframework packaging.
        # Self-healing: rebuild all targets if prebuild is incomplete.
        if [ ! -f "target/bindings/ios/libs/libvauchi_platform_sim.a" ]; then
          echo "⚠ Prebuild lacks simulator library — rebuilding full Apple targets..."
          ./scripts/build-bindings.sh --apple
        else
          echo "  ✓ Prebuild complete (device + simulator)"
        fi
      else
        echo "⚠ No prebuild found (HTTP $HTTP_CODE) — building from scratch"
        ./scripts/build-bindings.sh --apple
      fi
  artifacts:
    paths:
      - target/bindings/ios/
      - target/bindings/macos/
    # 7 days: release pipeline retries may span multiple days
    expire_in: 7 days

build:android:
  extends: [.linux-runner, .release-or-rc, .timeout-long]
  stage: build
  needs: [release:verify]
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - |
      # Try to download prebuild artifacts cached on main merge
      echo "Checking for prebuild Android bindings at SHA ${CI_COMMIT_SHA}..."
      HTTP_CODE=$(curl -s -o bindings-android.tar.gz -w "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-prebuild/${CI_COMMIT_SHA}/bindings-android.tar.gz")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "✓ Found prebuild Android bindings — extracting (skipping ~35 min build)"
        mkdir -p target/bindings
        tar xzf bindings-android.tar.gz -C target/bindings
        rm bindings-android.tar.gz
      else
        echo "⚠ No prebuild found (HTTP $HTTP_CODE) — building from scratch"
        ./scripts/build-bindings.sh --android
      fi
  artifacts:
    paths:
      - target/bindings/android/
    # 7 days: release pipeline retries may span multiple days
    expire_in: 7 days

# Validate generated bindings have all expected types
build:validate-bindings:
  extends: [.linux-runner, .release-or-rc]
  stage: build
  needs:
    - job: build:apple
      artifacts: true
    - job: build:android
      artifacts: true
  script:
    - ./scripts/validate-bindings.sh
  allow_failure: false

# ============================================================
# Package Stage (Tags only)
# ============================================================

package:xcframework:
  extends: [.macos-runner, .release-or-rc]
  stage: package
  needs: [build:apple, build:validate-bindings]
  script:
    - ./scripts/package-xcframework.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/VauchiPlatformFFI.xcframework.zip
      - dist/VauchiPlatformFFI.xcframework.zip.sha256
      - dist/VauchiPlatformFFI.xcframework.zip.sha256.bundle
      - dist/VauchiPlatform-*.zip
    expire_in: 1 week

package:android:
  extends: [.linux-runner, .release-or-rc]
  stage: package
  needs: [build:android, build:validate-bindings]
  script:
    - ./scripts/package-android.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/vauchi-platform-kotlin-*.zip
      - dist/vauchi-platform-kotlin-*.zip.sha256
      - dist/vauchi-platform-kotlin-*.zip.sha256.bundle
    expire_in: 1 week

# Build CABI DLL for Windows consumers (P/Invoke).
# Cross-compiles from Linux using cargo-xwin (clang-cl + lld-link).
# Eliminates dependency on SaaS Windows runner availability.
# Signs checksum with cosign and uploads to generic package registry.
build:cabi-windows:
  extends: .linux-runner-nocache
  stage: package
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      # Verify cross-compilation toolchain
      rustup target add x86_64-pc-windows-msvc
      cargo xwin --version || { echo "ERROR: cargo-xwin not installed — run 'cargo install cargo-xwin' on runner"; exit 1; }
      clang-cl --version || { echo "ERROR: clang-cl not found — install clang/llvm on runner"; exit 1; }
      cmake --version || { echo "ERROR: cmake not found"; exit 1; }
      nasm -v || { echo "ERROR: nasm not found"; exit 1; }

      # Build CABI DLL via cross-compilation
      echo "Cross-compiling vauchi-cabi for x86_64-pc-windows-msvc..."
      cargo xwin build -p vauchi-cabi --release \
        --target x86_64-pc-windows-msvc \
        --features audio
      echo "Cross-compilation complete"

      # Prepare dist
      mkdir -p dist
      cp target/x86_64-pc-windows-msvc/release/vauchi_cabi.dll dist/
      cp vauchi-cabi/include/vauchi.h dist/

      # Compute SHA-256
      HASH=$(sha256sum dist/vauchi_cabi.dll | awk '{print $1}')
      printf '%s' "$HASH" > dist/vauchi_cabi.dll.sha256
      echo "SHA-256: $HASH"

      # Sign checksum with cosign (matches package-xcframework.sh pattern)
      # GitLab masked file variables store base64-encoded content — decode if needed.
      if [ -z "${COSIGN_KEY:-}" ]; then
        echo "ERROR: COSIGN_KEY is required for DLL signing"
        exit 1
      fi
      COSIGN_KEY_FILE="$COSIGN_KEY"
      if ! head -1 "$COSIGN_KEY" | grep -q -- "-----BEGIN"; then
        COSIGN_KEY_FILE=$(mktemp)
        base64 -d < "$COSIGN_KEY" > "$COSIGN_KEY_FILE"
      fi
      cosign sign-blob --yes \
        --key "$COSIGN_KEY_FILE" \
        --bundle dist/vauchi_cabi.dll.sha256.bundle \
        dist/vauchi_cabi.dll.sha256
      [ "$COSIGN_KEY_FILE" != "$COSIGN_KEY" ] && rm -f "$COSIGN_KEY_FILE"
      echo "DLL checksum signed"

      # Upload to generic package registry
      CLEAN_VERSION="${CI_COMMIT_TAG#v}"
      BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-cabi-windows/${CLEAN_VERSION}"

      for file in vauchi_cabi.dll vauchi_cabi.dll.sha256 vauchi_cabi.dll.sha256.bundle vauchi.h; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "dist/${file}" \
          "${BASE_URL}/${file}" && echo "Uploaded ${file}" \
          || { echo "ERROR: Failed to upload ${file}"; exit 1; }
      done
      echo "All artifacts uploaded (${CLEAN_VERSION})"
  artifacts:
    paths:
      - dist/vauchi_cabi.dll
      - dist/vauchi_cabi.dll.sha256
      - dist/vauchi_cabi.dll.sha256.bundle
      - dist/vauchi.h
    expire_in: 1 week
  timeout: 30 minutes

# Generate CycloneDX SBOM for supply-chain traceability (T0-2)
package:sbom:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [release:verify]
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Generating SBOM for vauchi v${VERSION}..."

      # Install cargo-cyclonedx (prefer pre-built binary, fall back to source)
      cargo binstall cargo-cyclonedx --no-confirm 2>/dev/null || cargo install cargo-cyclonedx --locked

      # Generate CycloneDX JSON for all workspace crates in one pass
      # cargo-cyclonedx v0.5.7 outputs {crate}/{crate}.cdx.json
      mkdir -p dist
      cargo cyclonedx --all --format json

      for crate in vauchi-core vauchi-platform vauchi-protocol; do
        mv "${crate}/${crate}.cdx.json" "dist/${crate}-${VERSION}.sbom.json"
      done

      # Generate checksums
      for f in dist/*.sbom.json; do
        sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
      done

      # Sign SBOM checksums with cosign (required in CI, matches xcframework/android guards)
      # GitLab masked file variables store base64-encoded content — decode if needed.
      if [[ -n "${COSIGN_KEY:-}" ]]; then
        COSIGN_KEY_FILE="$COSIGN_KEY"
        if ! head -1 "$COSIGN_KEY" | grep -q -- "-----BEGIN"; then
          COSIGN_KEY_FILE=$(mktemp)
          base64 -d < "$COSIGN_KEY" > "$COSIGN_KEY_FILE"
        fi
        for f in dist/*.sbom.json.sha256; do
          cosign sign-blob --yes --key "$COSIGN_KEY_FILE" \
            --bundle "${f}.bundle" "$f"
        done
        [[ "$COSIGN_KEY_FILE" != "$COSIGN_KEY" ]] && rm -f "$COSIGN_KEY_FILE"
        echo "SBOMs signed"
      elif [[ -n "${CI:-}" ]]; then
        echo "ERROR: COSIGN_KEY is required in CI for SBOM signing"
        exit 1
      fi

      # Ensure all dist artifacts are world-readable — shell runners may have
      # restrictive umask (0077), producing 0600 files that downstream Docker
      # jobs can't read.
      chmod 644 dist/*

      echo "SBOM generation complete"
  artifacts:
    paths:
      - dist/*.sbom.json
      - dist/*.sbom.json.sha256
      - dist/*.sbom.json.sha256.bundle
    expire_in: 1 week

# ============================================================
# Publish Stage (Tags only)
# ============================================================

publish:packages:
  extends: [.linux-runner, .release-or-rc]
  stage: publish
  needs:
    - package:xcframework
    - package:android
    # sbom is .release-only (not RC) — must be optional here since
    # publish:packages runs on RC tags too (.release-or-rc)
    - job: package:sbom
      optional: true
  script:
    - ./scripts/publish-packages.sh "$CI_COMMIT_TAG"

# Publish vauchi-core crate to GitLab package registry
publish:core:
  extends: [.linux-runner, .release-only]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-core $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml

        # Try to create an MR to bump version on main (non-blocking)
        echo "  Attempting to create MR to update version on main..."
        (
          BRANCH_NAME="chore/bump-version-${VERSION}"
          REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
          git remote set-url origin "$REPO_URL" 2>/dev/null || git remote add origin "$REPO_URL"
          git checkout -b "$BRANCH_NAME"
          git add Cargo.toml
          # Use bot's verified commit_email — GITLAB_USER_EMAIL is the
          # human who pushed the tag, rejected by "unverified email" push rule.
          BOT_INFO=$(curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
          _EMAIL=$(echo "$BOT_INFO" | jq -r '.commit_email // .email // empty')
          _NAME=$(echo "$BOT_INFO" | jq -r '.name // empty')
          git -c user.name="${_NAME:-${GITLAB_USER_NAME}}" \
              -c user.email="${_EMAIL:-${GITLAB_USER_EMAIL}}" \
            commit -m "chore: Bump version to $VERSION"
          git push -u origin "$BRANCH_NAME" && \
          MR_RESP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"source_branch\": \"${BRANCH_NAME}\",
              \"target_branch\": \"main\",
              \"title\": \"chore: Bump version to ${VERSION}\",
              \"description\": \"Auto-generated by release pipeline. Tag ${CI_COMMIT_TAG} was published with version ${VERSION} but Cargo.toml had ${MANIFEST_VERSION}.\",
              \"remove_source_branch\": true
            }" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests") && \
          MR_IID=$(echo "$MR_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('iid',''))" 2>/dev/null || true) && \
          if [ -n "$MR_IID" ]; then
            echo "  ✓ MR created to bump version on main"
            # Enable auto-merge
            curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --request PUT \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge?merge_when_pipeline_succeeds=true" > /dev/null 2>&1 && \
            echo "  ✓ Auto-merge enabled" || echo "  ⚠ Could not enable auto-merge"
          fi
        ) || echo "  ⚠ Could not create MR (CI_JOB_TOKEN may lack write access). Please bump Cargo.toml manually."

        # Restore working tree for cargo package (subshell changed branch)
        git checkout -f "${CI_COMMIT_SHA}" 2>/dev/null || true
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package fails on workspace path deps
      # not published to crates.io — same workaround as publish:platform)
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-core-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-core/Cargo.toml "$PKG_DIR/"
      # Extract workspace metadata (not hardcoded — survives edition/license changes)
      WS_EDITION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^edition' | sed 's/.*"\(.*\)"/\1/')
      WS_LICENSE=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^license' | sed 's/.*"\(.*\)"/\1/')
      # Resolve workspace package metadata
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      sed -i "s/^edition\.workspace = true/edition = \"${WS_EDITION}\"/" "$PKG_DIR/Cargo.toml"
      sed -i "s/^license\.workspace = true/license = \"${WS_LICENSE}\"/" "$PKG_DIR/Cargo.toml"
      # Resolve ALL workspace dependency references (self-healing for future deps):
      # Dotted form: any-dep.workspace = true → any-dep = { version = "X" }
      sed -i "s/^\([a-z_-]*\)\.workspace = true/\1 = { version = \"${VERSION}\" }/" "$PKG_DIR/Cargo.toml"
      # Inline form: { workspace = true, features = [...] } → { version = "X", features = [...] }
      sed -i "s/workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      # Strip path references from inline deps (e.g. { path = "../x", version = "0.1" } → { version = "0.1" })
      sed -i 's|path = "\.\./[^"]*", ||g' "$PKG_DIR/Cargo.toml"
      sed -i 's|, path = "\.\./[^"]*"||g' "$PKG_DIR/Cargo.toml"
      cp -r vauchi-core/src "$PKG_DIR/"
      [ -f vauchi-core/build.rs ] && cp vauchi-core/build.rs "$PKG_DIR/"
      [ -f vauchi-core/README.md ] && cp vauchi-core/README.md "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-core-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-core-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${VERSION}/vauchi-core-${VERSION}.crate")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Published vauchi-core $VERSION"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ vauchi-core $VERSION already published — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

# Publish vauchi-platform crate to GitLab package registry
publish:platform:
  extends: [.linux-runner, .release-or-rc]
  stage: publish
  needs: [release:verify]
  interruptible: false
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing vauchi-platform $VERSION to GitLab package registry..."

      # Ensure Cargo.toml version matches the tag
      MANIFEST_VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
        echo "⚠ Version mismatch: Cargo.toml=$MANIFEST_VERSION, tag=$VERSION"
        echo "  Patching Cargo.toml to match tag..."
        sed -i "s/^version = \"${MANIFEST_VERSION}\"/version = \"${VERSION}\"/" Cargo.toml
      else
        echo "  ✓ Version aligned: $VERSION"
      fi

      # Create tarball manually (cargo package requires vauchi-core on crates.io)
      # Use temp directory to get correct archive structure
      TMPDIR=$(mktemp -d)
      PKG_DIR="$TMPDIR/vauchi-platform-${VERSION}"
      mkdir -p "$PKG_DIR"

      cp vauchi-platform/Cargo.toml "$PKG_DIR/"
      # Replace workspace version reference with actual version for standalone crate
      sed -i "s/^version\.workspace = true/version = \"${VERSION}\"/" "$PKG_DIR/Cargo.toml"
      cp vauchi-platform/uniffi-bindgen.rs "$PKG_DIR/"
      cp vauchi-platform/README.md "$PKG_DIR/"
      cp -r vauchi-platform/src "$PKG_DIR/"
      cp -r vauchi-platform/benches "$PKG_DIR/"
      cp -r LICENSES "$PKG_DIR/"

      mkdir -p target/package
      CRATE_FILE="target/package/vauchi-platform-${VERSION}.crate"
      tar czf "$CRATE_FILE" -C "$TMPDIR" "vauchi-platform-${VERSION}"
      rm -rf "$TMPDIR"

      # Upload to GitLab generic packages registry
      HTTP_CODE=$(curl -s -w '%{http_code}' -o /dev/null \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${VERSION}/vauchi-platform-${VERSION}.crate")
      if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
        echo "✓ Published vauchi-platform $VERSION"
      elif [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "409" ]; then
        echo "✓ vauchi-platform $VERSION already published — skipping"
      else
        echo "✗ Upload failed with HTTP ${HTTP_CODE}"
        exit 1
      fi

# Publish Android AAR to core's Maven registry (visible at group level).
# Eliminates the vauchi-platform-kotlin intermediary repo.
publish:maven:
  extends: .docker-runner
  stage: publish
  image: cimg/android:2025.01
  interruptible: false
  needs: [package:android]
  variables:
    VERSION: "${CI_COMMIT_TAG}"
  rules:
    # Release and RC tags only — dev tags do not publish to Maven
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      CLEAN_VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing Maven AAR version $CLEAN_VERSION"

      # Verify cosign signature on the zip before repackaging as AAR
      CHECKSUM_FILE="dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ -f "$BUNDLE_FILE" ]] && [[ -f "$COSIGN_PUB" ]]; then
        cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
          echo "ERROR: Android zip cosign verification FAILED — refusing to publish"
          exit 1
        }
        echo "✓ Android zip cosign signature verified"
      else
        echo "ERROR: cosign bundle or public key missing — cannot verify Android zip"
        exit 1
      fi

      # Verify the zip checksum matches the actual file
      EXPECTED=$(cat "$CHECKSUM_FILE" | tr -d '[:space:]')
      ACTUAL=$(sha256sum "dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip" | cut -d' ' -f1)
      if [[ "$EXPECTED" != "$ACTUAL" ]]; then
        echo "ERROR: zip checksum mismatch (expected $EXPECTED, got $ACTUAL)"
        exit 1
      fi
      echo "✓ Android zip checksum verified"

      # Extract pre-packaged Android bindings (zip has version-prefixed top dir)
      mkdir -p ci/maven-publish/vauchi-platform/src/main/jniLibs
      mkdir -p ci/maven-publish/vauchi-platform/src/main/kotlin
      rm -rf /tmp/android-bindings
      unzip -o dist/vauchi-platform-kotlin-${CLEAN_VERSION}.zip -d /tmp/android-bindings

      # Copy JNI libs (arm64-v8a, x86_64)
      cp -r /tmp/android-bindings/vauchi-platform-kotlin-${CLEAN_VERSION}/jniLibs/* ci/maven-publish/vauchi-platform/src/main/jniLibs/

      # Copy Kotlin bindings
      cp -r /tmp/android-bindings/vauchi-platform-kotlin-${CLEAN_VERSION}/kotlin/* ci/maven-publish/vauchi-platform/src/main/kotlin/

      # Build and publish AAR
      cd ci/maven-publish
      export VERSION="$CLEAN_VERSION"
      ./gradlew :vauchi-platform:publishReleasePublicationToGitLabRepository --no-daemon

      echo "✓ Published app.vauchi:vauchi-platform:$CLEAN_VERSION to Maven"

release:create:
  extends: .release-only
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  tags:
    - docker
  interruptible: false
  needs:
    - publish:packages
    - publish:core
    - publish:platform
    - job: publish:maven
      optional: true
    - package:sbom
  script:
    - |
      echo "Creating release $CI_COMMIT_TAG"

      # T1-6: GPG-sign release checksums if signing key is available
      if [ -n "${GPG_SIGNING_KEY:-}" ]; then
        echo "Importing GPG signing key..."
        echo "$GPG_SIGNING_KEY" | gpg --batch --import 2>/dev/null
        GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)

        if [ -n "$GPG_KEY_ID" ]; then
          echo "Signing release tag $CI_COMMIT_TAG with GPG key $GPG_KEY_ID..."
          echo "$CI_COMMIT_TAG" | gpg --batch --yes --armor --detach-sign \
            --local-user "$GPG_KEY_ID" > release-tag.sig 2>/dev/null && \
          echo "Release tag signature created" || \
          echo "WARNING: GPG signing failed (non-blocking)"
        fi
      elif [ -n "${CI:-}" ]; then
        echo "WARNING: GPG_SIGNING_KEY not set — release will be unsigned"
      fi
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Vauchi $CI_COMMIT_TAG

      ### Rust Crates

      - [vauchi-core](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.crate)
      - [vauchi-platform](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-${CI_COMMIT_TAG#v}.crate)

      ### Platform Bindings

      - [iOS XCFramework](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/VauchiPlatformFFI.xcframework.zip)
      - [Android](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-kotlin-${CI_COMMIT_TAG#v}.zip)

      ### Supply Chain

      - [vauchi-core SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-core/${CI_COMMIT_TAG#v}/vauchi-core-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-platform SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-platform/${CI_COMMIT_TAG#v}/vauchi-platform-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)
      - [vauchi-protocol SBOM](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-protocol/${CI_COMMIT_TAG#v}/vauchi-protocol-${CI_COMMIT_TAG#v}.sbom.json) (CycloneDX)

      ### Integration

      See [documentation](https://gitlab.com/vauchi/core/-/blob/main/README.md) for integration instructions.

# ============================================================
# Trigger Stage (Tags only) — Platform Distribution
# ============================================================
#
# ============================================================
# Direct Distribution
# ============================================================
# Core owns the entire distribution chain:
#   - Maven AAR: published by publish:maven (above)
#   - Swift SPM: updated by update:swift-bindings (below)
#   - Consumer triggers: trigger:ios, trigger:macos, trigger:android (below)

# Update vauchi-platform-swift Package.swift + Swift bindings directly.
# Uses PROJECT_ACCESS_TOKEN for git push (CI_JOB_TOKEN pushes don't trigger
# downstream pipelines in ios/macos).
update:swift-bindings:
  extends: [.linux-runner, .timeout-quick]
  stage: trigger
  interruptible: false
  needs: [package:xcframework, publish:packages]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      VERSION="${CI_COMMIT_TAG}"
      CLEAN_VERSION="${VERSION#v}"
      echo "Updating vauchi-platform-swift to $VERSION"

      # Resolve bot identity so git author matches GitLab account (pre-receive hook)
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')

      # Read checksum from local artifact (no network download needed)
      CHECKSUM=$(cat dist/VauchiPlatformFFI.xcframework.zip.sha256 | tr -d '[:space:]')
      echo "XCFramework checksum: $CHECKSUM"

      # Verify cosign signature on the checksum file
      CHECKSUM_FILE="dist/VauchiPlatformFFI.xcframework.zip.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ ! -f "$BUNDLE_FILE" ]]; then
        echo "ERROR: cosign bundle not found: $BUNDLE_FILE"
        echo "Signing may have been skipped or failed in package:xcframework"
        exit 1
      fi

      if [[ ! -f "$COSIGN_PUB" ]]; then
        echo "ERROR: cosign public key not found: $COSIGN_PUB"
        exit 1
      fi

      echo "Verifying cosign signature..."
      cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
        echo "ERROR: cosign verification FAILED for $VERSION"
        exit 1
      }
      echo "✓ Cosign signature verified"

      # Extract Swift bindings from local artifact (clean stale dirs from shared runners)
      rm -rf /tmp/swift-bindings
      unzip -o -j dist/VauchiPlatform-${CLEAN_VERSION}.zip \
        "VauchiPlatform-${CLEAN_VERSION}/Sources/vauchi_platform.swift" \
        -d /tmp/swift-bindings/

      # Clone platform-swift repo (clean up stale dir from previous runs on shared runners)
      rm -rf /tmp/platform-swift
      git clone --depth 1 "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/vauchi/vauchi-platform-swift.git" /tmp/platform-swift
      cd /tmp/platform-swift

      # Update Package.swift version + checksum
      sed -i "s/let version = \".*\"/let version = \"$CLEAN_VERSION\"/" Package.swift
      sed -i "s/let checksum = \".*\"/let checksum = \"$CHECKSUM\"/" Package.swift

      # Enforce REMOTE binaryTarget (wire-bindings-local.sh may have switched to LOCAL)
      # Rewrite the binaryTarget section to always use REMOTE URL mode.
      # This guards against wire-bindings-local.sh changes being committed.
      REMOTE_URL='https://gitlab.com/api/v4/projects/vauchi%2Fcore/packages/generic/vauchi-platform/\(version)/VauchiPlatformFFI.xcframework.zip'
      printf '%s\n' \
        'import re, sys' \
        'path, url = sys.argv[1], sys.argv[2]' \
        'Q = chr(34)' \
        'with open(path) as f: content = f.read()' \
        'content = re.sub(r"[ \t]+// REMOTE \(original.*?\n(?:[ \t]+//[^\n]*\n)*", "", content)' \
        'content = re.sub(r"[ \t]+// LOCAL \(set by wire-bindings-local\.sh\):\n", "", content)' \
        'pattern = r"([ \t]+)(?://[^\n]*\n\s*)*\.binaryTarget\([\s\S]*?\),"' \
        'repl = r"\g<1>.binaryTarget(" + "\n" + r"\g<1>    name: " + Q + "VauchiPlatformFFI" + Q + "," + "\n" + r"\g<1>    url: " + Q + url + Q + "," + "\n" + r"\g<1>    checksum: checksum" + "\n" + r"\g<1>),"' \
        'content = re.sub(pattern, repl, content)' \
        'with open(path, "w") as f: f.write(content)' \
        > /tmp/fix-package-swift.py
      python3 /tmp/fix-package-swift.py Package.swift "$REMOTE_URL"
      echo "Ensured Package.swift uses REMOTE binaryTarget"

      # Update Swift bindings source
      cp /tmp/swift-bindings/vauchi_platform.swift Sources/VauchiPlatform/vauchi_platform.swift

      echo "Updated Package.swift:"
      head -12 Package.swift

      # Commit and push
      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"
      git add Package.swift Sources/VauchiPlatform/vauchi_platform.swift
      if git diff --cached --quiet; then
        echo "No changes — bindings already up to date"
        exit 0
      fi
      git commit -m "chore: Update to $VERSION"
      git tag -f "$VERSION"
      git push origin main --tags --force

      echo "✓ Updated vauchi-platform-swift to $VERSION"

# Update windows/ repo with new CABI DLL version + SHA.
# Mirrors update:swift-bindings pattern.
trigger:windows:
  extends: [.linux-runner, .timeout-quick]
  stage: trigger
  interruptible: false
  needs: [build:cabi-windows]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      VERSION="${CI_COMMIT_TAG}"
      CLEAN_VERSION="${VERSION#v}"
      echo "Updating windows/ CABI version to $CLEAN_VERSION"

      # Resolve bot identity so git author matches GitLab account (pre-receive hook)
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/user" 2>/dev/null || true)
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email // empty')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // empty')

      # Read checksum from build artifact
      DLL_SHA256=$(cat dist/vauchi_cabi.dll.sha256 | tr -d '[:space:]')
      echo "DLL checksum: $DLL_SHA256"

      # Verify cosign signature before propagating
      CHECKSUM_FILE="dist/vauchi_cabi.dll.sha256"
      BUNDLE_FILE="${CHECKSUM_FILE}.bundle"
      COSIGN_PUB="cosign.pub"

      if [[ ! -f "$BUNDLE_FILE" ]]; then
        echo "ERROR: cosign bundle not found: $BUNDLE_FILE"
        exit 1
      fi

      cosign verify-blob --key "$COSIGN_PUB" --bundle "$BUNDLE_FILE" "$CHECKSUM_FILE" || {
        echo "ERROR: cosign verification FAILED for CABI DLL"
        exit 1
      }
      echo "✓ Cosign signature verified"

      # Clone windows/ and update cabi-version.json
      WINDOWS_REPO="https://project-access-token:${PROJECT_ACCESS_TOKEN}@gitlab.com/vauchi/windows.git"
      git clone --depth 1 "$WINDOWS_REPO" windows-checkout
      cd windows-checkout

      cat > cabi-version.json << JSONEOF
      {
        "version": "$CLEAN_VERSION",
        "sha256": "$DLL_SHA256",
        "source_commit": "$CI_COMMIT_SHA"
      }
      JSONEOF

      # Sync cosign.pub if it changed
      if ! diff -q ../cosign.pub cosign.pub >/dev/null 2>&1; then
        cp ../cosign.pub cosign.pub
        echo "✓ cosign.pub updated"
      fi

      git config user.name "${BOT_NAME:-${GITLAB_USER_NAME}}"
      git config user.email "${BOT_EMAIL:-${GITLAB_USER_EMAIL}}"
      git add cabi-version.json cosign.pub
      git diff --cached --quiet && { echo "No changes to push"; exit 0; }
      git commit -m "chore: update CABI DLL to $CLEAN_VERSION

      SHA-256: $DLL_SHA256
      Source: $CI_COMMIT_SHA"
      git push origin main
      echo "✓ windows/ updated to CABI $CLEAN_VERSION"

# Trigger consumer apps directly (no intermediary repos)
trigger:ios:
  stage: trigger
  needs: [update:swift-bindings]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/ios
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

trigger:macos:
  stage: trigger
  needs: [update:swift-bindings]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/macos
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

trigger:android:
  stage: trigger
  needs: [publish:maven]
  interruptible: false
  variables:
    BINDINGS_VERSION: $CI_COMMIT_TAG
  trigger:
    project: vauchi/android
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Downstream Verification (main branch only)
# ============================================================
# When core merges to main, verify that Rust consumer repos (cli,
# tui, e2e, relay, linux-gtk) still build and pass tests. This catches
# API breaks early — before a release is even considered.
#
# Uses GitLab's trigger: keyword which creates linked child pipelines
# visible in the pipeline graph. CI_JOB_TOKEN is used implicitly —
# downstream projects must add vauchi/core to their CI_JOB_TOKEN allowlist.

verify:downstream-rust:
  stage: trigger
  extends: .trigger-parallel
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/cli, vauchi/tui, vauchi/e2e, vauchi/relay, vauchi/linux-gtk]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"

# verify:downstream-dev removed — verify:downstream-rust on main already
# triggers the same 5 repos against the same code. Running again from the
# dev tag was pure redundancy (~20 min wasted per merge).

# When core gets an RC tag, trigger downstream to verify compatibility
verify:downstream-rc:
  extends: .trigger-parallel-prerelease
  parallel:
    matrix:
      - DOWNSTREAM: [vauchi/cli, vauchi/tui, vauchi/e2e, vauchi/relay, vauchi/linux-gtk]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Manual Dev Build (on-demand)
# ============================================================

build:dev:
  extends: .linux-runner
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    DEV_VERSION: "dev-${CI_COMMIT_SHORT_SHA}"
  before_script:
    - !reference [.self-hosted, before_script]
    # Find Android NDK - check common locations
    - |
      for ndk_path in /opt/android-sdk/ndk/* /opt/android-ndk $HOME/Android/Sdk/ndk/*; do
        if [ -d "$ndk_path" ]; then
          export ANDROID_NDK_HOME="$ndk_path"
          echo "Found Android NDK at: $ANDROID_NDK_HOME"
          break
        fi
      done
      if [ -z "$ANDROID_NDK_HOME" ]; then
        echo "ERROR: Android NDK not found. Please install it or set ANDROID_NDK_HOME."
        exit 1
      fi
    - rustup target add aarch64-linux-android x86_64-linux-android
  script:
    - ./scripts/build-bindings.sh --android
    - ./scripts/package-android.sh "$DEV_VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 3 days

# ============================================================
# Cleanup Stage (scheduled or manual)
# ============================================================
# Runs periodically to clean up runner disk space

cleanup:runner:
  extends: .cleanup-runner
  # Run on scheduled pipeline when CLEANUP_ENABLED is set.
  # On non-scheduled pipelines: never create (manual .post jobs cause
  # pipeline status to show "failed" even with allow_failure: true —
  # see problem record 2026-03-16-pipeline-reliability).
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_ENABLED == "true"
    - when: never

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
