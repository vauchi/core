[package]
name = "vauchi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for Vauchi - privacy-focused contact card exchange"

[features]
default = ["network"]
network = ["network-native-tls"]
network-native-tls = ["tungstenite", "tungstenite/handshake", "tungstenite/native-tls", "native-tls", "snow"]
network-rustls = ["tungstenite", "tungstenite/handshake", "tungstenite/rustls-tls-native-roots", "rustls", "webpki-roots", "snow"]
secure-storage = ["keyring"]
# Real audio proximity verification using CPAL (desktop only)
audio-cpal = ["cpal"]
# Enable this feature to expose internal modules for integration tests
testing = []
# Shorten protocol timeouts for fast e2e/integration tests (QR expiry: 300s → 5s)
test-timings = []
# Reduces Argon2id KDF cost parameters for faster test execution (~5x speedup).
# MUST NOT be enabled in production builds — only for test/dev profiles.
test-kdf = []
# JSON Schema generation for UI types (dev tooling only)
schema-gen = ["schemars"]
# WASM crypto backend (hybrid WebCrypto + RustCrypto)
crypto-wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys", "dep:getrandom"]
# Tor anonymity layer (embedded arti client)
tor = ["arti-client", "tor-rtcompat", "tokio-util"]
# Remote content updates (requires HTTP client)
content-updates = ["reqwest", "tokio"]

[dependencies]
# Cryptography (audited libraries)
aws-lc-rs = "1.16"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

# XChaCha20-Poly1305 (spec-mandated cipher, documented exception to aws-lc-rs-only rule)
chacha20poly1305 = "0.10.1"

# Argon2id password KDF (spec-mandated, documented exception to aws-lc-rs-only rule)
argon2 = "0.5.3"

# Async trait support for async sync pipeline
async-trait = "0.1"

# Compression for delta payloads
flate2 = "1.0"

# QR code generation
qrcode = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9"
postcard = { version = "1.1", features = ["alloc"] }

# Bitflags for transport capability negotiation
bitflags = { version = "2.6", features = ["serde"] }

# Error handling
thiserror = "2.0"

# Random number generation
rand = "0.8"

# Base64 encoding for keys/backups
base64 = "0.22"

# CRC32 checksums for animated QR frame validation
crc32fast = "1.4"

# Hex encoding for fingerprints
hex = "0.4"

# Constant-time comparison for cryptographic operations
subtle = "2.6"

# Zeroize sensitive data in memory
zeroize = { version = "1.8", features = ["derive"] }

# JSON Schema generation (optional, behind schema-gen feature)
schemars = { version = "0.8", optional = true }

# Password strength estimation
zxcvbn = "3"

# Database storage
rusqlite = { version = "0.32", features = ["bundled"] }

# UUID generation for IDs
uuid = { version = "1.0", features = ["v4"] }

# Noise protocol for inner transport encryption (defense-in-depth inside TLS)
snow = { version = "0.9", optional = true }

# WebSocket transport (optional, not needed for mobile)
tungstenite = { version = "0.24", default-features = false, optional = true }
native-tls = { version = "0.2", optional = true }

# TLS for rustls feature (aws-lc-rs backend - works on Android/iOS)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

# Platform keychain access (optional, for desktop apps)
keyring = { version = "3", optional = true }

# Cross-platform audio for ultrasonic proximity verification (desktop only)
cpal = { version = "0.15", optional = true }

# HTTP client for remote content updates (optional)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"], optional = true }

# Async runtime for content fetching
tokio = { version = "1.0", features = ["rt"], optional = true }

# Embedded Tor client (optional, behind tor feature)
arti-client = { version = "0.27", optional = true, default-features = false, features = ["tokio", "native-tls"] }
tor-rtcompat = { version = "0.27", optional = true, features = ["tokio", "native-tls"] }
tokio-util = { version = "0.7", optional = true, features = ["io", "io-util"] }

# WASM crypto backend (hybrid WebCrypto + RustCrypto — behind crypto-wasm feature)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Crypto", "SubtleCrypto", "CryptoKey", "CryptoKeyPair",
    "HmacImportParams", "HkdfParams", "Pbkdf2Params",
    "Algorithm", "WorkerGlobalScope"
], optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
# ChaCha20-Poly1305 already a non-optional dep (compiles to wasm32 as pure Rust)
# Argon2 already a non-optional dep (compiles to wasm32 as pure Rust)

[dev-dependencies]
# JSON Schema validation for contract tests
jsonschema = "0.28"
# Temporary directories for storage tests
tempfile = "3.0"
# Async runtime for async sync tests
tokio = { version = "1.0", features = ["rt", "macros"] }
# Property-based testing
proptest = "1.4"
# Benchmarking
criterion = "0.5"
# BDD testing (executable Gherkin)
cucumber = "0.21"
futures = "0.3"

[[test]]
name = "cucumber_tests"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

