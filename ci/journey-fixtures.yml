check:journey-fixtures:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs: []
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - python3 -m unittest discover -s ci/tests -p journey_fixtures_test.py
    - cargo clippy -p vauchi-app --test screen_catalog_fixture_tests --features test-kdf,testing,network-http -- -D warnings
    - cargo test -p vauchi-app --test presentation_contract_fixture_tests --test screen_catalog_fixture_tests --features test-kdf,testing,network-http
    - cargo test -p vauchi-app --test presentation_contract_fixture_tests --features test-kdf,testing,network-http regenerate_shared_fixture -- --ignored
    - git diff --exit-code -- vauchi-app/fixtures/journeys/presentation_contract_v1.json
    - python3 ci/journey_fixtures.py build dist/journey-fixtures --core-revision "$CI_COMMIT_SHA"
  artifacts:
    paths: [dist/journey-fixtures/]
    expire_in: 1 week

publish:journey-fixtures:
  extends: [.linux-runner, .timeout-quick]
  stage: publish
  needs:
    - job: check:journey-fixtures
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - python3 ci/journey_fixtures.py publish dist/journey-fixtures --core-revision "$CI_COMMIT_SHA"
