# GitLab CI for vauchi-core
#
# Pipeline strategy (PI-13 fail-fast DAG):
#   - MR: Validation with DAG ordering — cheap checks gate expensive ones
#   - Tags (v*): Build, package, publish releases
#
# DAG execution order (MR pipelines):
#   lint (< 2 min) ──┬── test (< 5 min) ──── mutation (advisory)
#                     ├── bench (advisory, change-based)
#                     └── security (< 5 min)
#
#   Lint must pass before tests or security run. Mutation only runs
#   after tests pass. Security runs parallel with tests.
#
# Uses shared templates from vauchi/scripts for consistency.
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#     - Rust lint/test: *.rs, Cargo.toml, Cargo.lock
#     - REUSE lint: LICENSES/, REUSE.toml, LICENSE*
#     - Security audit: Cargo.toml, Cargo.lock (dependencies)
#     - License check: Cargo.*, deny.toml
#   - Test and coverage combined in single pass
#   - DAG execution: needs: with optional:true for cross-rule compatibility
#   - Parallel build jobs (iOS + Android)
#   - Parallel test jobs (core + mobile)
#   - Parallel publish jobs (core + mobile)
#   - CARGO_INCREMENTAL=0 to reduce target/ size and cache overhead
#   - No-cache/read-only cache for lint/security jobs (skip expensive upload)
#   - mold linker on Linux (2-5x faster linking)
#   - Cargo.lock-based cache keys (smarter invalidation)

# Include shared templates
include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/test-quality.yml'

stages:
  - auto-tag
  - lint
  - test
  - security
  - mutation
  - build
  - package
  - publish
  - trigger

# Override: advisory until pre-existing proptest/fuzz zero-assertion tests
# are refactored (scanner cannot detect prop_assert! inside proptest! macros)
quality:zero-assertions:
  allow_failure: true

# ============================================================
# Auto-Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.

auto-tag:version:
  extends: [.linux-runner-nocache, .main-only]
  stage: auto-tag
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  before_script: []
  script:
    - |
      VERSION=$(grep -A5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "✓ Tag ${TAG} already exists — nothing to do"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git config user.name "vauchi-gitlab-runner"
      git config user.email "noreply@vauchi.app"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/package/publish stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"

# ============================================================
# Lint Stage — Preflight Gate (MR only, change-based)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.linux-runner-nocache, .validation-rust, .timeout-quick]
  stage: lint
  needs: []
  script:
    - cargo fmt --all -- --check

lint:clippy:
  extends: [.linux-runner, .validation-rust, .timeout-standard]
  stage: lint
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
  script:
    - cargo clippy --all-targets -- -D warnings

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

# ============================================================
# Test Stage (MR only, gated by lint)
# ============================================================

# Clone sibling locales repo (needed by build.rs and i18n tests)
.clone-locales:
  before_script:
    - if [ ! -d ../locales ]; then git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales; else git -C ../locales pull --ff-only 2>/dev/null || true; fi

# MR test jobs: use nextest for fast feedback (12x faster than cargo test,
# avoids llvm-cov instrumentation rebuild). Coverage runs on main only.
# Cucumber tests use cargo test (not nextest) because harness=false output
# is incompatible with nextest's test listing format.
test:core:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - cargo nextest run -p vauchi-core

test:cucumber:
  extends: [.linux-runner, .validation-rust, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - if [ ! -d ../features ]; then git clone --depth=1 https://gitlab.com/vauchi/features.git ../features; else git -C ../features pull --ff-only 2>/dev/null || true; fi
  script:
    - cargo test --test cucumber_tests -- --tags "not @wip"

test:mobile:
  extends: [.linux-runner, .validation-mobile, .timeout-quick]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  script:
    - cargo nextest run -p vauchi-mobile

# Coverage jobs: run on main merges only (not MRs) — llvm-cov is too slow
# for per-push feedback but still needed for coverage tracking/badges.
coverage:core:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo binstall cargo-llvm-cov --no-confirm 2>/dev/null || cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov -p vauchi-core --lcov --output-path lcov-core.info
    - cargo llvm-cov report -p vauchi-core --cobertura --output-path cobertura-core.xml
    - cargo llvm-cov report -p vauchi-core
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-core.xml
    paths:
      - lcov-core.info
      - cobertura-core.xml
    expire_in: 1 week

coverage:mobile:
  extends: [.linux-runner, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-locales, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo binstall cargo-llvm-cov --no-confirm 2>/dev/null || cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov -p vauchi-mobile --lcov --output-path lcov-mobile.info
    - cargo llvm-cov report -p vauchi-mobile --cobertura --output-path cobertura-mobile.xml
    - cargo llvm-cov report -p vauchi-mobile
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura-mobile.xml
    paths:
      - lcov-mobile.info
      - cobertura-mobile.xml
    expire_in: 1 week

# ============================================================
# Benchmark Stage — Performance Regression Gate (PI-10)
# ============================================================
# Criterion benchmarks with baseline comparison.
# - merge to main: save baseline results
# - MR: compare against saved baseline, warn on > 20% regression

# Cache for benchmark baselines (shared between main and MR jobs)
.bench-cache:
  cache:
    key: bench-baseline-main
    paths:
      - target/criterion/

# Save baseline on merge to main
bench:save-baseline:
  extends: [.linux-runner, .timeout-standard, .bench-cache]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression -- --save-baseline main
  artifacts:
    paths:
      - target/criterion/
    expire_in: 30 days

# Compare against baseline on MRs (advisory)
bench:compare:
  extends: [.linux-runner, .timeout-standard, .bench-cache]
  stage: test
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "vauchi-core/src/**/*.rs"
          - "vauchi-core/benches/**/*.rs"
          - "vauchi-core/Cargo.toml"
          - ".gitlab-ci.yml"
      when: manual
  allow_failure: true
  cache:
    key: bench-baseline-main
    paths:
      - target/criterion/
    policy: pull
  script:
    - |
      if [ -d "target/criterion" ]; then
        echo "Found baseline — comparing..."
        cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression -- --baseline main 2>&1 | tee bench-results.txt
        # Check for regressions > 20%
        if grep -E 'regressed.*\+[2-9][0-9]\.' bench-results.txt || grep -E 'regressed.*\+[1-9][0-9][0-9]' bench-results.txt; then
          echo "⚠ WARNING: Performance regression > 20% detected!"
          echo "  Review bench-results.txt for details."
        else
          echo "✓ No significant regressions detected"
        fi
      else
        echo "No baseline found — running benchmarks without comparison"
        cargo bench -p vauchi-core --bench crypto_benchmarks --bench performance_regression 2>&1 | tee bench-results.txt
      fi
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 1 week
    when: always

# ============================================================
# Mutation Stage
# ============================================================

# Nightly full mutation testing (scheduled pipeline)
mutation:nightly:
  extends: [.linux-runner, .timeout-extended]
  stage: mutation
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - command -v cargo-mutants >/dev/null 2>&1 || cargo binstall cargo-mutants --no-confirm 2>/dev/null || cargo install cargo-mutants --locked || true
    - |
      MUTANTS_OUT="target/mutants"
      cargo mutants -p vauchi-core --timeout 60 --output "$MUTANTS_OUT" &
      MUTANTS_PID=$!
      trap 'kill $MUTANTS_PID 2>/dev/null; wait $MUTANTS_PID 2>/dev/null' EXIT

      G='\033[32m'; R='\033[31m'; Y='\033[33m'; D='\033[2m'
      B='\033[1m'; C='\033[36m'; Z='\033[0m'

      count() { if [ -f "$1" ]; then wc -l < "$1" | tr -d ' '; else echo 0; fi; }
      color_type() {
        case "$1" in
          caught)  printf "${G}caught${Z}" ;;
          missed)  printf "${R}MISSED${Z}" ;;
          timeout) printf "${Y}timeout${Z}" ;;
          *)       printf "${D}unviable${Z}" ;;
        esac
      }
      last_mutant() {
        local f
        f=$(ls -t "$MUTANTS_OUT"/caught.txt "$MUTANTS_OUT"/missed.txt \
              "$MUTANTS_OUT"/timeout.txt "$MUTANTS_OUT"/unviable.txt 2>/dev/null | head -1)
        if [ -n "$f" ]; then
          printf "  \xe2\x94\x94 %s \xe2\x80\x94 %b\n" "$(tail -1 "$f")" "$(color_type "$(basename "$f" .txt)")"
        fi
      }

      while [ ! -f "$MUTANTS_OUT/mutants.json" ] && kill -0 "$MUTANTS_PID" 2>/dev/null; do
        sleep 10
      done
      if ! kill -0 "$MUTANTS_PID" 2>/dev/null; then
        wait "$MUTANTS_PID"; exit $?
      fi

      TOTAL=$(python3 -c "import json; print(len(json.load(open('$MUTANTS_OUT/mutants.json'))))" 2>/dev/null || echo "0")

      printf "\033[0Ksection_start:%s:baseline[collapsed=true]\r\033[0K" "$(date +%s)"
      printf "${B}${C}Baseline: compiling and running unmutated tests${Z}\n"

      SECONDS=0; BASELINE_OPEN=true; TESTING_OPEN=false

      while kill -0 "$MUTANTS_PID" 2>/dev/null; do
        sleep 30
        c=$(count "$MUTANTS_OUT/caught.txt"); m=$(count "$MUTANTS_OUT/missed.txt")
        t=$(count "$MUTANTS_OUT/timeout.txt"); u=$(count "$MUTANTS_OUT/unviable.txt")
        d=$((c + m + t + u))

        if [ "$d" -eq 0 ]; then
          printf "Waiting... (%dm elapsed)\n" "$((SECONDS / 60))"
          continue
        fi

        if $BASELINE_OPEN; then
          printf "\033[0Ksection_end:%s:baseline\r\033[0K" "$(date +%s)"
          printf "\033[0Ksection_start:%s:testing\r\033[0K" "$(date +%s)"
          printf "${B}${C}Testing %d mutants${Z}\n" "$TOTAL"
          BASELINE_OPEN=false; TESTING_OPEN=true
        fi

        pct=$((d * 100 / TOTAL))
        eta=""
        if [ "$SECONDS" -gt 0 ] && [ "$d" -gt 0 ]; then
          rem=$(( (TOTAL - d) * SECONDS / d / 60 ))
          eta="  ${D}(~${rem}m remaining)${Z}"
        fi

        printf "[%3d/%d %2d%%] ${G}%d caught${Z}, ${R}%d missed${Z}, ${Y}%d timeout${Z}, ${D}%d unviable${Z}%b\n" \
          "$d" "$TOTAL" "$pct" "$c" "$m" "$t" "$u" "$eta"
        last_mutant
      done

      $BASELINE_OPEN && printf "\033[0Ksection_end:%s:baseline\r\033[0K" "$(date +%s)"
      $TESTING_OPEN && printf "\033[0Ksection_end:%s:testing\r\033[0K" "$(date +%s)"

      wait "$MUTANTS_PID"
      EXIT_CODE=$?

      c=$(count "$MUTANTS_OUT/caught.txt"); m=$(count "$MUTANTS_OUT/missed.txt")
      t=$(count "$MUTANTS_OUT/timeout.txt"); u=$(count "$MUTANTS_OUT/unviable.txt")
      d=$((c + m + t + u))
      [ "$TOTAL" -gt 0 ] 2>/dev/null && cpct=$((c * 100 / TOTAL)) || cpct=0

      echo ""
      printf "${B}=== Mutation Testing Summary ===${Z}\n"
      printf "  Total:    %d / %d\n" "$d" "$TOTAL"
      printf "  Caught:   ${G}%d (%d%%)${Z}\n" "$c" "$cpct"
      printf "  Missed:   ${R}%d${Z}\n" "$m"
      printf "  Timeout:  ${Y}%d${Z}\n" "$t"
      printf "  Unviable: ${D}%d${Z}\n" "$u"
      if [ -s "$MUTANTS_OUT/missed.txt" ]; then
        echo ""
        printf "${R}${B}Missed mutants:${Z}\n"
        while IFS= read -r line; do printf "  ${R}%s${Z}\n" "$line"; done < "$MUTANTS_OUT/missed.txt"
      fi

      exit "$EXIT_CODE"
  artifacts:
    paths:
      - target/mutants/
    expire_in: 1 week

# Per-MR incremental mutation testing (advisory, runs after tests pass)
mutation:incremental:
  extends: [.linux-runner, .timeout-extended]
  stage: mutation
  needs:
    - job: test:core
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  variables:
    GIT_DEPTH: "100"
  script:
    - command -v cargo-mutants >/dev/null 2>&1 || cargo binstall cargo-mutants --no-confirm 2>/dev/null || cargo install cargo-mutants --locked || true
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=100
    - git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"...HEAD > mr.diff
    - |
      MUTANTS_OUT="mutants.out"
      cargo mutants -p vauchi-core --in-diff mr.diff --timeout 120 --mutant-limit 50 --baseline skip &
      MUTANTS_PID=$!
      trap 'kill $MUTANTS_PID 2>/dev/null; wait $MUTANTS_PID 2>/dev/null' EXIT

      G='\033[32m'; R='\033[31m'; Y='\033[33m'; D='\033[2m'
      B='\033[1m'; C='\033[36m'; Z='\033[0m'

      count() { if [ -f "$1" ]; then wc -l < "$1" | tr -d ' '; else echo 0; fi; }
      color_type() {
