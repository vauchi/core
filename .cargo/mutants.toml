# cargo-mutants configuration for vauchi-core
# See: https://mutants.rs/config-file.html

# Exclude test infrastructure, generated code, and benchmarks from mutation
exclude_globs = ["tests/**", "benches/**", "fuzz/**"]

# Allow 1.5x the normal test timeout per mutant
timeout_multiplier = 1.5

# Use nextest for faster mutant killing (exits on first failure)
test_tool = "nextest"

# Skip doctests — each doctest compiles as a separate binary, slow for mutation
additional_cargo_test_args = ["--all-targets"]
