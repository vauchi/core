# Core — Package Stage (release-or-rc tag pipelines only)
#
# Extracted from core/.gitlab-ci.yml on 2026-04-22 as Phase 0 Part 4
# of the T2.3 split (2026-04-22-ci-pipeline-health-audit).
# Pure extraction — byte-identical to the deleted block. Included as
# `local: ci/package.yml` from core/.gitlab-ci.yml.
#
# Contents:
#   - test:packaging-matrix   — MR/main smoke test of packaging scripts in their
#                               target environments (Linux + macOS)
#   - package:xcframework     — Swift package (tags only)
#   - package:android         — Android AAR (tags only)
#   - package:cabi-windows    — Windows CABI zip (tags only)
#   - package:sbom            — CycloneDX SBOM (tags only)
#   - package:slsa-provenance — SLSA L2 provenance bundle (tags only)

# ============================================================
# Packaging Script Environment Matrix (MR + main)
# ============================================================
# The packaging scripts have high fix-commit density (see
# _private/scripts/git_hotspot_analyzer.py --rank-by fix_ratio).
# Running them in their target environments on every packaging change
# catches environment-specific breakage before release tags, when the
# real package:* jobs run. Uses --release-only for speed and dev
# versions to skip cosign signing.

test:packaging-matrix:
  stage: test
  needs: []
  tags:
    - $RUNNER_OS
    - self-hosted
  parallel:
    matrix:
      - RUNNER_OS: [linux, macos]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "scripts/build-bindings.sh"
          - "scripts/package-xcframework.sh"
          - "scripts/package-android.sh"
          - "ci/package.yml"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -euo pipefail
      case "$RUNNER_OS" in
        linux)
          echo "=== Linux matrix: build-bindings --android + package-android ==="
          ./scripts/build-bindings.sh --android --release-only
          ./scripts/package-android.sh "dev-${CI_COMMIT_SHORT_SHA}"
          ;;
        macos)
          echo "=== macOS matrix: build-bindings --apple + package-xcframework ==="
          # package-xcframework.sh needs both device and simulator slices,
          # so we cannot use --release-only here.
          ./scripts/build-bindings.sh --apple
          ./scripts/package-xcframework.sh "dev-${CI_COMMIT_SHORT_SHA}"
          ;;
        *)
          echo "ERROR: unsupported RUNNER_OS '$RUNNER_OS'" >&2
          exit 1
          ;;
      esac

# ============================================================
# Package Stage (Tags only)
# ============================================================

package:xcframework:
  extends: [.macos-runner, .release-or-rc]
  stage: package
  needs: [build:apple, build:validate-bindings]
  # Belt-and-braces against the nell file-variable staging race: the
  # in-script retry budget in package-xcframework.sh already waits up to
  # ~27s for COSIGN_KEY to land on disk, but if that still isn't enough,
  # auto-retry the job once. The shared template's default `retry.when`
  # is REPLACED (not merged) when a job overrides retry, so the standard
  # system-failure conditions must be listed alongside script_failure.
  # Two consecutive v0.51.17 + v0.51.18 release tag pipelines both lost
  # the race on attempt 1 (jobs 14546357593 + 14577073994) — proof in
  # MR description.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
  script:
    - ./scripts/package-xcframework.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/VauchiPlatformFFI.xcframework.zip
      - dist/VauchiPlatformFFI.xcframework.zip.sha256
      - dist/VauchiPlatformFFI.xcframework.zip.sha256.bundle
      - dist/VauchiPlatform-*.zip
    expire_in: 1 week

package:android:
  extends: [.linux-runner, .release-or-rc]
  stage: package
  needs: [build:android, build:validate-bindings]
  script:
    - ./scripts/package-android.sh "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - dist/vauchi-platform-kotlin-*.zip
      - dist/vauchi-platform-kotlin-*.zip.sha256
      - dist/vauchi-platform-kotlin-*.zip.sha256.bundle
    expire_in: 1 week

# Build CABI DLL for Windows consumers (P/Invoke).
# Cross-compiles from Linux using cargo-xwin (clang-cl + lld-link).
# Eliminates dependency on SaaS Windows runner availability.
# Signs checksum with cosign and uploads to generic package registry.
build:cabi-windows:
  extends: .linux-runner-nocache
  stage: package
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  script:
    - !reference [.cosign-install, script]
    - |
      # Verify cross-compilation toolchain
      rustup target add x86_64-pc-windows-msvc
      cargo xwin --version || { echo "ERROR: cargo-xwin not installed — run 'cargo install cargo-xwin' on runner"; exit 1; }
      clang-cl --version || { echo "ERROR: clang-cl not found — install clang/llvm on runner"; exit 1; }
      cmake --version || { echo "ERROR: cmake not found"; exit 1; }
      nasm -v || { echo "ERROR: nasm not found"; exit 1; }

      # Build CABI DLL via cross-compilation
      echo "Cross-compiling vauchi-cabi for x86_64-pc-windows-msvc..."
      cargo xwin build -p vauchi-cabi --release \
        --target x86_64-pc-windows-msvc
      echo "Cross-compilation complete"

      # Prepare dist
      mkdir -p dist
      cp target/x86_64-pc-windows-msvc/release/vauchi_cabi.dll dist/
      cp vauchi-cabi/include/vauchi.h dist/

      # Compute SHA-256
      HASH=$(sha256sum dist/vauchi_cabi.dll | awk '{print $1}')
      printf '%s' "$HASH" > dist/vauchi_cabi.dll.sha256
      echo "SHA-256: $HASH"

      # Sign checksum with cosign (matches package-xcframework.sh pattern)
      # GitLab masked file variables store base64-encoded content — decode if needed.
      if [ -z "${COSIGN_KEY:-}" ]; then
        echo "ERROR: COSIGN_KEY is required for DLL signing"
        exit 1
      fi
      COSIGN_KEY_FILE="$COSIGN_KEY"
      if ! head -1 "$COSIGN_KEY" | grep -q -- "-----BEGIN"; then
        COSIGN_KEY_FILE=$(mktemp)
        base64 -d < "$COSIGN_KEY" > "$COSIGN_KEY_FILE"
      fi
      cosign sign-blob --yes \
        --key "$COSIGN_KEY_FILE" \
        --bundle dist/vauchi_cabi.dll.sha256.bundle \
        dist/vauchi_cabi.dll.sha256
      [ "$COSIGN_KEY_FILE" != "$COSIGN_KEY" ] && rm -f "$COSIGN_KEY_FILE"
      echo "DLL checksum signed"

      # Upload to generic package registry
      CLEAN_VERSION="${CI_COMMIT_TAG#v}"
      BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/vauchi-cabi-windows/${CLEAN_VERSION}"

      for file in vauchi_cabi.dll vauchi_cabi.dll.sha256 vauchi_cabi.dll.sha256.bundle vauchi.h; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "dist/${file}" \
          "${BASE_URL}/${file}" && echo "Uploaded ${file}" \
          || { echo "ERROR: Failed to upload ${file}"; exit 1; }
      done
      echo "All artifacts uploaded (${CLEAN_VERSION})"
  artifacts:
    paths:
      - dist/vauchi_cabi.dll
      - dist/vauchi_cabi.dll.sha256
      - dist/vauchi_cabi.dll.sha256.bundle
      - dist/vauchi.h
    expire_in: 1 week
  timeout: 30 minutes

# Generate CycloneDX SBOM for supply-chain traceability (T0-2)
package:sbom:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [release:verify]
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Generating SBOM for vauchi v${VERSION}..."

      # Install cargo-cyclonedx (prefer pre-built binary, fall back to source)
      cargo binstall cargo-cyclonedx --no-confirm 2>/dev/null || cargo install cargo-cyclonedx --locked

      # Generate CycloneDX JSON for all workspace crates in one pass
      # cargo-cyclonedx v0.5.7 outputs {crate}/{crate}.cdx.json
      mkdir -p dist
      cargo cyclonedx --all --format json

      for crate in vauchi-core vauchi-platform vauchi-protocol; do
        mv "${crate}/${crate}.cdx.json" "dist/${crate}-${VERSION}.sbom.json"
      done

      # Generate checksums
      for f in dist/*.sbom.json; do
        sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
      done

      # Sign SBOM checksums with cosign (required in CI, matches xcframework/android guards)
      # GitLab masked file variables store base64-encoded content — decode if needed.
      if [[ -n "${COSIGN_KEY:-}" ]]; then
        COSIGN_KEY_FILE="$COSIGN_KEY"
        if ! head -1 "$COSIGN_KEY" | grep -q -- "-----BEGIN"; then
          COSIGN_KEY_FILE=$(mktemp)
          base64 -d < "$COSIGN_KEY" > "$COSIGN_KEY_FILE"
        fi
        for f in dist/*.sbom.json.sha256; do
          cosign sign-blob --yes --key "$COSIGN_KEY_FILE" \
            --bundle "${f}.bundle" "$f"
        done
        [[ "$COSIGN_KEY_FILE" != "$COSIGN_KEY" ]] && rm -f "$COSIGN_KEY_FILE"
        echo "SBOMs signed"
      elif [[ -n "${CI:-}" ]]; then
        echo "ERROR: COSIGN_KEY is required in CI for SBOM signing"
        exit 1
      fi

      # Ensure all dist artifacts are world-readable — shell runners may have
      # restrictive umask (0077), producing 0600 files that downstream Docker
      # jobs can't read.
      chmod 644 dist/*

      echo "SBOM generation complete"
  artifacts:
    paths:
      - dist/*.sbom.json
      - dist/*.sbom.json.sha256
      - dist/*.sbom.json.sha256.bundle
    expire_in: 1 week

# SLSA L2 provenance attestation (G3)
# Generates an in-toto v1 provenance statement capturing: who built it,
# from what source, with what commands, producing what artifacts.
# Signed with cosign — verifiable by end users with cosign.pub.
package:slsa-provenance:
  extends: [.linux-runner, .release-only]
  stage: package
  needs: [package:sbom]
  script:
    - !reference [.cosign-install, script]
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Generating SLSA L2 provenance for v${VERSION}..."

      # Collect artifact checksums (SBOMs + any dist files from prior jobs)
      SUBJECTS="[]"
      for f in dist/*.sbom.json; do
        NAME=$(basename "$f")
        DIGEST=$(sha256sum "$f" | awk '{print $1}')
        SUBJECTS=$(echo "$SUBJECTS" | jq --arg name "$NAME" --arg digest "$DIGEST" \
          '. + [{"name": $name, "digest": {"sha256": $digest}}]')
      done

      # Build the in-toto v1 provenance statement (SLSA v1.0 format)
      cat > dist/provenance.intoto.jsonl <<PROVENANCE
      {
        "_type": "https://in-toto.io/Statement/v1",
        "subject": ${SUBJECTS},
        "predicateType": "https://slsa.dev/provenance/v1",
        "predicate": {
          "buildDefinition": {
            "buildType": "https://gitlab.com/vauchi/core/-/blob/main/.gitlab-ci.yml",
            "externalParameters": {
              "ref": "${CI_COMMIT_REF_NAME}",
              "tag": "${CI_COMMIT_TAG}"
            },
            "resolvedDependencies": [
              {
                "uri": "git+https://gitlab.com/vauchi/core@${CI_COMMIT_SHA}",
                "digest": {"gitCommit": "${CI_COMMIT_SHA}"}
              }
            ]
          },
          "runDetails": {
            "builder": {
              "id": "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/runners/${CI_RUNNER_ID}",
              "version": {
                "rustc": "$(rustc --version | awk '{print $2}')",
                "cargo": "$(cargo --version | awk '{print $2}')"
              }
            },
            "metadata": {
              "invocationId": "${CI_PIPELINE_URL}",
              "startedOn": "${CI_PIPELINE_CREATED_AT}",
              "finishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
        }
      }
      PROVENANCE

      # Compact the JSON (remove heredoc indentation)
      jq -c '.' dist/provenance.intoto.jsonl > dist/provenance.intoto.jsonl.tmp
      mv dist/provenance.intoto.jsonl.tmp dist/provenance.intoto.jsonl

      # Sign provenance with cosign
      if [[ -n "${COSIGN_KEY:-}" ]]; then
        COSIGN_KEY_FILE="$COSIGN_KEY"
        if ! head -1 "$COSIGN_KEY" | grep -q -- "-----BEGIN"; then
          COSIGN_KEY_FILE=$(mktemp)
          base64 -d < "$COSIGN_KEY" > "$COSIGN_KEY_FILE"
        fi
        cosign sign-blob --yes --key "$COSIGN_KEY_FILE" \
          --bundle "dist/provenance.intoto.jsonl.bundle" \
          "dist/provenance.intoto.jsonl"
        [[ "$COSIGN_KEY_FILE" != "$COSIGN_KEY" ]] && rm -f "$COSIGN_KEY_FILE"
        echo "✓ SLSA provenance signed"
      elif [[ -n "${CI:-}" ]]; then
        echo "ERROR: COSIGN_KEY required for provenance signing"
        exit 1
      fi

      chmod 644 dist/provenance.*
      echo "SLSA L2 provenance complete"
  artifacts:
    paths:
      - dist/provenance.intoto.jsonl
      - dist/provenance.intoto.jsonl.bundle
    expire_in: 1 week
