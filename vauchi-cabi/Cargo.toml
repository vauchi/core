[package]
name = "vauchi-cabi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI bindings for vauchi-core workflow engines"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
audio = ["vauchi-core/audio-cpal"]
secure-storage = ["vauchi-core/secure-storage-linux"]

[dependencies]
vauchi-core = { workspace = true, default-features = false, features = ["storage", "network-rustls"] }
vauchi-app = { workspace = true, default-features = false, features = ["network-rustls"] }
serde_json = "1.0"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.29"
