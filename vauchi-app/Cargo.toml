[package]
name = "vauchi-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "App-layer modules for Vauchi — themes, UI, content, i18n, help"

[dependencies]
vauchi-core = { version = "0.10.2", path = "../vauchi-core", default-features = false, features = ["storage", "network-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Crypto deps used by content/integrity.rs for manifest verification
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# JSON Schema generation (optional, behind schema-gen feature)
schemars = { version = "0.8", optional = true }

# Remote content (optional)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"], optional = true }
tokio = { version = "1.0", features = ["rt"], optional = true }

[features]
default = ["content-updates"]
content-updates = ["reqwest", "tokio"]
network-native-tls = ["vauchi-core/network-native-tls"]
network-rustls = ["vauchi-core/network-rustls"]
# JSON Schema generation (dev tooling, forwarded from vauchi-core)
schema-gen = ["schemars", "vauchi-core/schema-gen"]

[package.metadata.cargo-machete]
ignored = ["tokio"]  # Optional dep behind content-updates feature

[dev-dependencies]
tempfile = "3.0"
proptest = "1.4"
